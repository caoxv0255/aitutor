<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>智能复习 - AI Tutor</title>

  <!-- Design Token v1 (含 info 修复版 + Legacy aliases) -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    /* ============= PageHeader ============= */
    .rv-header {
      height: 56px; padding: 0 16px;
      background: var(--ait-bg-surface);
      border-bottom: 1px solid var(--ait-color-neutral-100);
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 50;
    }
    .rv-header__back {
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--ait-radius-md);
      color: var(--ait-fg-secondary);
      text-decoration: none;
    }
    .rv-header__back:hover { background: var(--ait-color-neutral-100); }
    .rv-header__title {
      font-size: 16px; font-weight: 600;
      color: var(--ait-fg-strong); flex: 1;
    }
    .rv-header__progress {
      font-size: 15px; color: var(--ait-fg-secondary);
      font-variant-numeric: tabular-nums;
    }
    .rv-header__progress b { color: var(--ait-fg-strong); font-weight: 600; }

    /* ============= 主区 ============= */
    .rv-shell { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }
    .rv-loading { text-align: center; padding: 80px 24px; color: var(--ait-fg-tertiary); }
    .rv-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--ait-color-neutral-200);
      border-top-color: var(--ait-color-primary-500);
      border-radius: 50%;
      animation: rv-spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes rv-spin { to { transform: rotate(360deg); } }

    /* ============= Flashcard ============= */
    .rv-card {
      background: var(--ait-bg-surface);
      border-radius: var(--ait-radius-xl);
      box-shadow: var(--ait-shadow-lg);
      padding: 24px;
      min-height: 480px;
      display: flex; flex-direction: column;
      gap: 16px;
    }
    .rv-card[data-state="answer"] {
      background: linear-gradient(180deg, var(--ait-color-primary-50) 0%, var(--ait-bg-surface) 60%);
    }
    .rv-card__head {
      display: flex; align-items: center; justify-content: space-between;
    }
    .rv-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 12px; border-radius: var(--ait-radius-sm);
      font-size: 12px; font-weight: 500;
    }
    .rv-tag--neutral { background: var(--ait-color-neutral-100); color: var(--ait-fg-secondary); }
    .rv-tag--primary { background: var(--ait-color-primary-100); color: var(--ait-color-primary-700); }
    .rv-card__stem {
      font-size: 18px; line-height: 1.6;
      color: var(--ait-fg-strong); font-weight: 500;
    }
    .rv-card__formula {
      background: var(--ait-color-neutral-50);
      border: 1px solid var(--ait-color-neutral-100);
      border-radius: var(--ait-radius-md);
      padding: 12px 16px;
      font-family: "SF Mono", "JetBrains Mono", monospace;
      font-size: 14px; color: var(--ait-fg-strong);
    }
    .rv-card__explain {
      font-size: 16px; line-height: 1.7;
      color: var(--ait-fg-default);
    }
    .rv-card__hint {
      margin-top: auto;
      display: flex; align-items: center; gap: 4px;
      font-size: 13px; color: var(--ait-fg-tertiary);
    }

    /* ============= Rating Bar ============= */
    .rv-rating {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, var(--ait-bg-surface) 30%);
      display: flex; gap: 12px;
      z-index: 40;
    }
    .rv-rating__btn {
      flex: 1; height: 56px;
      border-radius: var(--ait-radius-lg);
      font-size: 15px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 0; cursor: pointer;
      transition: filter 120ms ease, transform 120ms ease;
    }
    .rv-rating__btn:active { transform: scale(0.97); filter: brightness(0.92); }
    .rv-rating__btn--danger  { background: var(--ait-color-danger-50);  color: var(--ait-color-danger-600); }
    .rv-rating__btn--warning { background: var(--ait-color-warning-50); color: var(--ait-color-warning-600); }
    .rv-rating__btn--success { background: var(--ait-color-success-50); color: var(--ait-color-success-600); }

    @media (prefers-reduced-motion: reduce) {
      .rv-spinner { animation: none; }
    }
  </style>
</head>
<body>

  <!-- ====== PageHeader (移动端) ====== -->
  <header class="rv-header">
    <a href="dashboard.html" class="rv-header__back" aria-label="返回">
      <i data-lucide="arrow-left"></i>
    </a>
    <h1 class="rv-header__title">智能复习</h1>
    <div class="rv-header__progress" id="rvProgress" hidden>
      <b id="rvCurrent">0</b> / <span id="rvTotal">0</span>
    </div>
  </header>

  <main class="rv-shell">
    <!-- ====== Loading 态 ====== -->
    <div class="rv-loading" id="rvLoading">
      <div class="rv-spinner"></div>
      <p>正在准备复习题目…</p>
    </div>

    <!-- ====== 题目卡片容器 ====== -->
    <div id="rvCardContainer" hidden></div>

    <!-- ====== 完成态（由 EmptyState 替代 V1.0 之前内联 HTML）====== -->
    <div id="rvDoneContainer" hidden></div>
  </main>

  <!-- ====== Rating Bar（题目展示时显示）====== -->
  <div class="rv-rating" id="rvRating" hidden>
    <button class="rv-rating__btn rv-rating__btn--danger" data-rate="0">
      <i data-lucide="x"></i> 还是不会
    </button>
    <button class="rv-rating__btn rv-rating__btn--warning" data-rate="1">
      <i data-lucide="minus"></i> 有点印象
    </button>
    <button class="rv-rating__btn rv-rating__btn--success" data-rate="2">
      <i data-lucide="check"></i> 完全掌握
    </button>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/js/components/toast.js"></script>
  <script src="assets/js/components/emptyState.js"></script>
  <script>
  (function() {
    'use strict';

    // ====== Toast 桥接 ======
    const _toast = window.toast;
    const toastBus = {
      success: (m, d) => _toast && _toast.success(m, d),
      error:   (m, d) => _toast && _toast.error(m, d),
      info:    (m, d) => _toast && _toast.info(m, d),
    };

    // ====== 鉴权 ======
    const token = localStorage.getItem('token');
    if (!token) { location.href = 'login.html'; return; }

    // ====== 元素引用 ======
    const $ = (s) => document.querySelector(s);
    const loading     = $('#rvLoading');
    const cardBox     = $('#rvCardContainer');
    const doneBox     = $('#rvDoneContainer');
    const ratingBar   = $('#rvRating');
    const progressEl  = $('#rvProgress');
    const currentEl   = $('#rvCurrent');
    const totalEl     = $('#rvTotal');

    // ====== 状态 ======
    let queue = [];
    let idx = 0;

    // ====== 主流程：加载 SRS 队列 ======
    async function loadQueue() {
      try {
        const res = await fetch('/api/reviews/today', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.status === 401) {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          location.href = 'login.html';
          return;
        }
        if (!res.ok) throw new Error('Failed to load queue');
        const payload = await res.json();
        queue = (payload && payload.data && Array.isArray(payload.data.cards)) ? payload.data.cards : [];
        if (queue.length > 0) {
          startReview();
        } else {
          showDone();
        }
      } catch (err) {
        showError();
      }
    }

    // ====== V1.0 整合：完成态 = reviewDone 场景 ======
    function showDone() {
      loading.hidden = true;
      cardBox.hidden = true;
      ratingBar.hidden = true;
      progressEl.hidden = true;
      doneBox.hidden = false;
      EmptyState.mount('rvDoneContainer', {
        scenario: 'reviewDone',
        primary_action:   { label: '返回首页', target_url: 'dashboard.html' },
        secondary_action: { label: '看看错题本', target_url: 'wrong-book.html' }
      });
      if (window.lucide && lucide.createIcons) lucide.createIcons();
    }

    // ====== V1.0 整合：错误态 = pathFail 场景 ======
    function showError() {
      loading.hidden = true;
      EmptyState.mount('rvLoading', {
        scenario: 'pathFail',
        title: '复习队列加载失败',
        description: '请检查网络后重试，或稍后再来。',
        primary_action:   { label: '重新加载', target_url: 'javascript:location.reload()' },
        secondary_action: { label: '返回首页', target_url: 'dashboard.html' }
      });
      if (window.lucide && lucide.createIcons) lucide.createIcons();
    }

    // ====== 开始复习 ======
    function startReview() {
      loading.hidden = true;
      cardBox.hidden = false;
      ratingBar.hidden = false;
      progressEl.hidden = false;
      totalEl.textContent = queue.length;
      idx = 0;
      showCard();
    }

    // ====== 渲染单张卡片 ======
    function showCard() {
      if (idx >= queue.length) {
        // 全部完成 → 提交后展示完成态
        showDone();
        return;
      }
      currentEl.textContent = idx + 1;
      const item = queue[idx];
      cardBox.innerHTML = `
        <article class="rv-card" data-state="${item.shown_answer ? 'answer' : 'question'}">
          <div class="rv-card__head">
            <span class="rv-tag rv-tag--neutral">${item.subject || '数学'}</span>
            ${item.shown_answer ? '<span class="rv-tag rv-tag--primary"><i data-lucide="sparkles" style="width:12px;height:12px"></i> AI 解析</span>' : ''}
          </div>
          <div class="rv-card__stem">${escapeHtml(item.stem || '')}</div>
          ${item.formula ? `<div class="rv-card__formula">${escapeHtml(item.formula)}</div>` : ''}
          ${item.shown_answer
            ? `<div class="rv-card__explain">${escapeHtml(item.explain || '')}</div>`
            : `<div class="rv-card__hint"><i data-lucide="chevron-down" style="width:14px;height:14px"></i> 点击卡片或下滑查看答案</div>`}
        </article>
      `;
      if (window.lucide && lucide.createIcons) lucide.createIcons();
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ====== 评分点击 ======
    ratingBar.addEventListener('click', async (e) => {
      const btn = e.target.closest('.rv-rating__btn');
      if (!btn) return;
      const rate = btn.dataset.rate;
      const item = queue[idx];
      try {
        await fetch('/api/reviews/' + (item.id || idx) + '/rate', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ quality: rate })
        });
      } catch (_) {}
      idx += 1;
      showCard();
    });

    // ====== 启动 ======
    document.addEventListener('DOMContentLoaded', loadQueue);
  })();
  </script>
</body>
</html>
