<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拍照搜题 — AI Tutor</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

:root {
  --aitutor-primary-50: #fff1f1;
  --aitutor-primary-100: #ffe0e0;
  --aitutor-primary-200: #ffc5c5;
  --aitutor-primary-300: #ffa0a0;
  --aitutor-primary-400: #f36b6b;
  --aitutor-primary-500: #d71920;
  --aitutor-primary-600: #b8151b;
  --aitutor-primary-700: #941218;
  --aitutor-primary-800: #7a1014;
  --aitutor-primary-900: #660f13;
  --aitutor-blue-50: #eff6ff;
  --aitutor-blue-100: #dbeafe;
  --aitutor-blue-200: #bfdbfe;
  --aitutor-blue-300: #93c5fd;
  --aitutor-blue-400: #60a5fa;
  --aitutor-blue-500: #2563eb;
  --aitutor-blue-600: #1d4ed8;
  --aitutor-blue-700: #1e40af;
  --aitutor-blue-800: #1e3a8a;
  --aitutor-blue-900: #172554;
  --aitutor-success-50: #ecfdf5;
  --aitutor-success-100: #d1fae5;
  --aitutor-success-200: #a7f3d0;
  --aitutor-success-300: #6ee7b7;
  --aitutor-success-400: #34d399;
  --aitutor-success-500: #059669;
  --aitutor-success-600: #047857;
  --aitutor-warning-50: #fffbeb;
  --aitutor-warning-100: #fef3c7;
  --aitutor-warning-200: #fde68a;
  --aitutor-warning-300: #fcd34d;
  --aitutor-warning-400: #fbbf24;
  --aitutor-warning-500: #f59e0b;
  --aitutor-error-50: #fef2f2;
  --aitutor-error-100: #fee2e2;
  --aitutor-error-200: #fecaca;
  --aitutor-error-300: #fca5a5;
  --aitutor-error-400: #f87171;
  --aitutor-error-500: #ef4444;
  --aitutor-error-600: #dc2626;

  --primary: var(--aitutor-primary-500); --primary-hover: var(--aitutor-primary-600); --primary-foreground: #ffffff;
  --secondary: var(--aitutor-blue-500); --secondary-hover: var(--aitutor-blue-600); --secondary-foreground: #ffffff;
  --accent: var(--aitutor-primary-500); --accent-hover: var(--aitutor-primary-600); --accent-foreground: #ffffff;
  --background: #f8f9fa; --foreground: #1a1a2e; --muted: #94a3b8; --muted-foreground: #64748b;
  --border: #e2e8f0; --ring: var(--aitutor-primary-500);
  --error: var(--aitutor-error-600); --error-foreground: #ffffff; --success: var(--aitutor-success-600); --warning: var(--aitutor-warning-600);
  --surface: #ffffff; --surface-dim: #f1f5f9; --surface-container-lowest: #f8f9fa;
  --surface-container-low: #f1f5f9; --surface-container: #e8ecf1; --surface-container-high: #dfe4ea; --surface-container-highest: #d5dae1;
  --inverse-surface: #1a1a2e; --inverse-on-surface: #f1f5f9;
  --bg: var(--background); --fg: var(--foreground); --rule: var(--border); --link: var(--aitutor-blue-600); --card-bg: var(--surface);

  --font-display: 'DM Sans', 'Noto Sans SC', sans-serif; --font-heading: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', 'DM Sans', sans-serif; --font-mono: 'DM Sans', monospace;
  --font-size-display: 56px; --font-size-h1: 40px; --font-size-h2: 32px; --font-size-h3: 24px;
  --font-size-h4: 20px; --font-size-body: 16px; --font-size-lead: 18px; --font-size-caption: 12px;
  --font-size-eyebrow: 11px; --font-size-mono: 14px;
  --font-weight-display: 700; --font-weight-h1: 700; --font-weight-h2: 600; --font-weight-h3: 600;
  --font-weight-h4: 600; --font-weight-body: 400; --font-weight-lead: 400; --font-weight-caption: 400;
  --font-weight-eyebrow: 600; --font-weight-mono: 400;
  --line-height-display: 1.1; --line-height-h1: 1.2; --line-height-h2: 1.25; --line-height-h3: 1.3;
  --line-height-h4: 1.4; --line-height-body: 1.6; --line-height-lead: 1.7; --line-height-caption: 1.5;
  --line-height-eyebrow: 1.4; --line-height-mono: 1.6;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;

  --size-button-sm: 32px; --size-button-md: 40px; --size-button-lg: 48px;
  --size-input-height: 40px; --size-icon-sm: 16px; --size-icon-md: 24px; --size-icon-lg: 32px;

  --radius-sm: 8px; --radius-md: 14px; --radius-lg: 16px; --radius-pill: 9999px;

  --shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 1px 1px rgba(0,0,0,.04);
  --shadow-2: 0 4px 8px -2px rgba(0,0,0,.10);
  --shadow-3: 0 8px 24px -8px rgba(0,0,0,.18);
  --shadow-4: 0 16px 40px -12px rgba(0,0,0,.24);
  --shadow-5: 0 24px 60px -20px rgba(0,0,0,.30);

  --color-background: var(--bg); --color-foreground: var(--fg);
  --color-surface: var(--surface); --color-surface-dim: var(--surface-dim);
  --color-surface-variant: var(--surface-container-high);
  --color-surface-container: var(--surface-container);
  --color-surface-container-low: var(--surface-container-low);
  --color-surface-container-high: var(--surface-container-high);
  --color-surface-container-highest: var(--surface-container-highest);
  --color-card: var(--surface); --color-on-surface: var(--fg); --color-on-surface-variant: var(--muted);
  --color-muted-foreground: var(--muted); --color-primary: var(--accent); --color-primary-hover: var(--accent-hover);
  --color-on-primary: #ffffff; --color-primary-container: var(--aitutor-primary-50);
  --color-on-primary-container: var(--aitutor-primary-900);
  --color-secondary: var(--aitutor-blue-100); --color-secondary-container: var(--aitutor-blue-50);
  --color-on-secondary-container: var(--aitutor-blue-900);
  --color-outline: var(--rule); --color-outline-variant: var(--aitutor-blue-100); --color-border: var(--rule);
  --color-success: var(--aitutor-success-600); --color-warning: var(--aitutor-warning-600);
  --color-error: var(--aitutor-error-600); --color-info: var(--aitutor-info-600);
  --radius-full: 9999px; --type-display-sm: 40px; --type-heading-sm: 24px;
  --type-body-md: 16px; --type-body-sm: 14px; --font-family-base: var(--font-body);
}

.dark {
  --background: #0f1117; --foreground: #e8ecf1; --surface: #1a1d27; --surface-dim: #12141c;
  --surface-container-lowest: #0f1117; --surface-container-low: #1a1d27;
  --surface-container: #22252f; --surface-container-high: #2a2d38; --surface-container-highest: #33374a;
  --inverse-surface: #f1f5f9; --inverse-on-surface: #1a1a2e;
  --muted: #64748b; --muted-foreground: #94a3b8; --border: #2a2d38;
  --bg: var(--background); --fg: var(--foreground); --rule: var(--border); --card-bg: var(--surface);
  --color-background: var(--bg); --color-foreground: var(--fg); --color-surface: var(--surface);
  --color-surface-dim: var(--surface-dim); --color-surface-variant: var(--surface-container-high);
  --color-surface-container: var(--surface-container); --color-surface-container-low: var(--surface-container-low);
  --color-surface-container-high: var(--surface-container-high); --color-surface-container-highest: var(--surface-container-highest);
  --color-card: var(--surface); --color-on-surface: var(--fg); --color-on-surface-variant: var(--muted);
  --color-muted-foreground: var(--muted); --color-outline: var(--rule); --color-outline-variant: #2a2d38;
  --color-border: var(--rule);
}

.aitutor-display { font-family: var(--font-display); font-size: 3.5rem; font-weight: var(--font-weight-display); line-height: var(--line-height-display); letter-spacing: -0.02em; }
.aitutor-h1 { font-family: var(--font-heading); font-size: 2.5rem; font-weight: var(--font-weight-h1); line-height: var(--line-height-h1); }
.aitutor-h2 { font-family: var(--font-heading); font-size: 2rem; font-weight: var(--font-weight-h2); line-height: var(--line-height-h2); }
.aitutor-h3 { font-family: var(--font-heading); font-size: 1.5rem; font-weight: var(--font-weight-h3); line-height: var(--line-height-h3); }
.aitutor-h4 { font-family: var(--font-heading); font-size: 1.25rem; font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); }
.aitutor-body { font-family: var(--font-body); font-size: 1rem; font-weight: var(--font-weight-body); line-height: var(--line-height-body); }
.aitutor-lead { font-family: var(--font-body); font-size: 1.125rem; font-weight: var(--font-weight-lead); line-height: var(--line-height-lead); }
.aitutor-caption { font-family: var(--font-body); font-size: 0.75rem; font-weight: var(--font-weight-caption); line-height: var(--line-height-caption); }
.aitutor-eyebrow { font-family: var(--font-body); font-size: 0.6875rem; font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .navbar { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 var(--space-5); background: var(--color-surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--color-border); width: 100%; box-sizing: border-box; }
      .navbar-logo { font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h2); color: var(--color-on-surface); white-space: nowrap; text-decoration: none; }
      .navbar-links { display: flex; align-items: center; gap: var(--space-5); list-style: none; margin: 0; padding: 0; }
      .navbar-link { font-size: var(--font-size-body); font-weight: var(--font-weight-body); color: var(--color-on-surface-variant); text-decoration: none; white-space: nowrap; transition: filter .15s; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); }
      .navbar-link:hover { filter: brightness(1.2); }
      .navbar-link.active { color: var(--color-on-surface); font-weight: var(--font-weight-h4); }
      .navbar-hamburger { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: none; border: none; color: var(--color-on-surface-variant); cursor: pointer; border-radius: var(--radius-sm); transition: filter .15s; flex-shrink: 0; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); font-family: var(--font-body); font-weight: var(--font-weight-body); white-space: nowrap; cursor: pointer; border: none; border-radius: var(--radius-pill); transition: background .15s, border-color .15s, opacity .15s; flex-shrink: 0; }
      .btn.primary { background: var(--accent); color: var(--primary-foreground); }
      .btn.primary:hover { background: var(--accent-hover); }
      .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
      .btn.ghost:hover { background: var(--color-surface-container-low); }
      .btn.sm { height: var(--size-button-sm); padding: 0 var(--space-4); font-size: var(--font-size-caption); min-width: var(--size-button-sm); }
      .btn.md { height: var(--size-button-md); padding: 0 var(--space-5); font-size: var(--font-size-body); min-width: var(--size-button-md); }
      .btn.lg { height: var(--size-button-lg); padding: 0 var(--space-6); font-size: var(--font-size-body); min-width: var(--size-button-lg); }
      .card { background: var(--color-card); border: 1px solid var(--color-outline); border-radius: var(--radius-md); padding: var(--space-5); box-shadow: var(--shadow-1); }
      .tag { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--space-3); border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1; min-width: 24px; flex-shrink: 0; }
      .tag--default { background: var(--color-surface); border: 1px solid var(--color-outline); color: var(--color-on-surface); }
      .tag--primary { background: var(--aitutor-primary-50); color: var(--aitutor-primary-700); border: 1px solid var(--aitutor-primary-200); }
      .tag--success { background: var(--aitutor-success-50); color: var(--aitutor-success-700); border: 1px solid var(--aitutor-success-200); }
      .tag--warning { background: var(--aitutor-warning-50); color: var(--aitutor-warning-700); border: 1px solid var(--aitutor-warning-200); }
      .upload-area { border: 2px dashed var(--color-outline); border-radius: var(--radius-lg); padding: var(--space-8); text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
      .upload-area:hover, .upload-area.dragover { border-color: var(--color-primary); background: var(--color-primary-container); }
      .upload-area.has-image { border-style: solid; padding: 0; }
      .upload-area.has-image img { width: 100%; height: auto; display: block; border-radius: var(--radius-lg); }
      .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
      .loading-spinner { width: 64px; height: 64px; border: 4px solid var(--color-border); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <nav class="navbar" style="position:sticky;top:0;z-index:50;">
      <div style="max-width:1280px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;">
        <a class="navbar-logo" href="home.html">AI Tutor</a>
        <ul class="navbar-links hidden md:flex">
          <li><a class="navbar-link" href="dashboard.html">学习驾驶舱</a></li>
          <li><a class="navbar-link" href="trends-analysis.html">考试趋势</a></li>
          <li><a class="navbar-link" href="wrong-book.html">错题本</a></li>
          <li><a class="navbar-link active" href="photo-search.html">拍照搜题</a></li>
        </ul>
        <div class="navbar-actions">
          <button class="navbar-hamburger" id="themeToggle" aria-label="切换主题">
            <i data-lucide="moon" style="width:20px;height:20px;"></i>
          </button>
        </div>
      </div>
    </nav>

    <main style="max-width:1280px;margin:0 auto;width:100%;padding:var(--space-6) var(--space-4);">
      <div style="margin-bottom:var(--space-6);">
        <h1 class="aitutor-h2" style="color:var(--color-on-surface);margin:0 0 var(--space-2);">拍照搜题</h1>
        <p class="aitutor-body" style="color:var(--color-on-surface-variant);margin:0;">拍摄题目照片，AI智能识别并提供详细解析</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);">
        <div>
          <div class="card">
            <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0 0 var(--space-4);">上传题目图片</h3>
            <div class="upload-area" id="uploadArea">
              <input type="file" id="fileInput" accept="image/*" style="display:none;">
              <div id="uploadPlaceholder">
                <div style="width:80px;height:80px;border-radius:50%;background:var(--color-surface-container-low);display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-4);">
                  <i data-lucide="camera" style="width:40px;height:40px;color:var(--color-primary);"></i>
                </div>
                <div style="font-size:var(--font-size-h4);font-weight:var(--font-weight-h4);color:var(--color-on-surface);margin-bottom:var(--space-2);">拍照或上传图片</div>
                <div style="font-size:var(--font-size-body);color:var(--color-on-surface-variant);margin-bottom:var(--space-4);">支持 JPG、PNG、WebP 格式</div>
                <button class="btn primary md" id="uploadBtn">选择图片</button>
              </div>
              <div id="imagePreview" style="display:none;position:relative;">
                <img id="previewImg" src="" alt="题目图片">
                <button class="btn ghost sm" style="position:absolute;top:var(--space-3);right:var(--space-3);" id="removeImageBtn">
                  <i data-lucide="x" style="width:16px;height:16px;"></i>
                </button>
              </div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-4);">
              <button class="btn ghost sm" id="cameraBtn">
                <i data-lucide="camera" style="width:16px;height:16px;"></i> 使用相机
              </button>
              <button class="btn ghost sm" id="rotateBtn" disabled>
                <i data-lucide="rotate-cw" style="width:16px;height:16px;"></i> 旋转
              </button>
              <button class="btn ghost sm" id="cropBtn" disabled>
                <i data-lucide="crop" style="width:16px;height:16px;"></i> 裁剪
              </button>
            </div>
          </div>

          <div class="card" style="margin-top:var(--space-5);">
            <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0 0 var(--space-4);">题目信息</h3>
            <div style="display:flex;flex-wrap:wrap;gap:var(--space-4);">
              <div style="flex:1;min-width:200px;">
                <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-1);">学科</div>
                <select id="subject" class="input-field">
                  <option value="math">数学</option>
                  <option value="physics">物理</option>
                  <option value="chemistry">化学</option>
                  <option value="biology">生物</option>
                  <option value="chinese">语文</option>
                  <option value="english">英语</option>
                  <option value="history">历史</option>
                  <option value="geography">地理</option>
                  <option value="politics">政治</option>
                </select>
              </div>
              <div style="flex:1;min-width:200px;">
                <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-1);">你的答案</div>
                <input type="text" id="studentAnswer" placeholder="选填，帮助分析错误原因" class="input-field">
              </div>
            </div>
            <button class="btn primary lg" style="width:100%;margin-top:var(--space-5);" id="searchBtn">
              <i data-lucide="search" style="width:20px;height:20px;"></i> 开始搜题
            </button>
          </div>
        </div>

        <div>
          <div class="card" id="resultCard" style="display:none;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);">
              <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0;">搜题结果</h3>
              <button class="btn ghost sm" id="addToWrongBtn">
                <i data-lucide="book-x" style="width:16px;height:16px;"></i> 加入错题本
              </button>
            </div>

            <div id="questionContent" style="margin-bottom:var(--space-4);">
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-2);">识别题目</div>
              <div style="font-size:var(--font-size-body);color:var(--color-on-surface);line-height:var(--line-height-body);background:var(--color-surface-container-low);padding:var(--space-4);border-radius:var(--radius-md);" id="questionText"></div>
            </div>

            <div id="errorAnalysis" style="margin-bottom:var(--space-4);">
              <div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);">
                <i data-lucide="lightbulb" style="width:20px;height:20px;color:var(--color-warning);"></i>
                <h4 style="font-size:var(--font-size-h4);font-weight:var(--font-weight-h4);color:var(--color-on-surface);margin:0;">答案与解析</h4>
              </div>
              <div style="margin-bottom:var(--space-3);">
                <span style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);">正确答案：</span>
                <span style="font-size:var(--font-size-body);font-weight:600;color:var(--color-success);" id="correctAnswer"></span>
              </div>
              <div style="font-size:var(--font-size-body);color:var(--color-on-surface);line-height:var(--line-height-body);" id="analysisText"></div>
            </div>

            <div id="errorTypes" style="margin-bottom:var(--space-4);">
              <div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);">
                <i data-lucide="alert-circle" style="width:20px;height:20px;color:var(--color-error);"></i>
                <h4 style="font-size:var(--font-size-h4);font-weight:var(--font-weight-h4);color:var(--color-on-surface);margin:0;">错误类型分析</h4>
              </div>
              <div id="errorTypesList" style="display:flex;flex-wrap:wrap;gap:var(--space-2);"></div>
            </div>

            <div id="similarQuestions" style="margin-bottom:var(--space-4);">
              <div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);">
                <i data-lucide="repeat" style="width:20px;height:20px;color:var(--color-secondary);"></i>
                <h4 style="font-size:var(--font-size-h4);font-weight:var(--font-weight-h4);color:var(--color-on-surface);margin:0;">相似题目</h4>
              </div>
              <div id="similarList"></div>
            </div>

            <div id="learningPlan">
              <div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);">
                <i data-lucide="calendar" style="width:20px;height:20px;color:var(--color-primary);"></i>
                <h4 style="font-size:var(--font-size-h4);font-weight:var(--font-weight-h4);color:var(--color-on-surface);margin:0;">学习建议</h4>
              </div>
              <div id="planContent"></div>
            </div>
          </div>

          <div class="card" id="emptyState" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-8);">
            <div style="width:120px;height:120px;border-radius:50%;background:var(--color-surface-container-low);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-5);">
              <i data-lucide="search" style="width:60px;height:60px;color:var(--color-on-surface-variant);"></i>
            </div>
            <div style="font-size:var(--font-size-h4);font-weight:var(--font-weight-h4);color:var(--color-on-surface);margin-bottom:var(--space-2);">上传题目开始搜题</div>
            <div style="font-size:var(--font-size-body);color:var(--color-on-surface-variant);text-align:center;">AI将识别题目内容，提供详细解析和相似题目推荐</div>
          </div>
        </div>
      </div>
    </main>

    <div class="loading-overlay" id="loadingOverlay" style="display:none;">
      <div style="text-align:center;">
        <div class="loading-spinner"></div>
        <div style="margin-top:var(--space-4);font-size:var(--font-size-body);color:#ffffff;">正在分析题目...</div>
      </div>
    </div>

    <script>
    (function() {
      'use strict';

      var imageData = null;
      var rotateAngle = 0;
      var searchResult = null;

      var uploadArea = document.getElementById('uploadArea');
      var fileInput = document.getElementById('fileInput');
      var uploadBtn = document.getElementById('uploadBtn');
      var uploadPlaceholder = document.getElementById('uploadPlaceholder');
      var imagePreview = document.getElementById('imagePreview');
      var previewImg = document.getElementById('previewImg');
      var removeImageBtn = document.getElementById('removeImageBtn');
      var cameraBtn = document.getElementById('cameraBtn');
      var rotateBtn = document.getElementById('rotateBtn');
      var cropBtn = document.getElementById('cropBtn');
      var searchBtn = document.getElementById('searchBtn');
      var resultCard = document.getElementById('resultCard');
      var emptyState = document.getElementById('emptyState');
      var loadingOverlay = document.getElementById('loadingOverlay');
      var addToWrongBtn = document.getElementById('addToWrongBtn');

      uploadBtn.addEventListener('click', function() { fileInput.click(); });
      uploadArea.addEventListener('click', function(e) {
        if (!uploadArea.classList.contains('has-image')) {
          fileInput.click();
        }
      });

      fileInput.addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (file) {
          loadImage(file);
        }
      });

      cameraBtn.addEventListener('click', function() {
        fileInput.click();
      });

      removeImageBtn.addEventListener('click', function() {
        removeImage();
      });

      rotateBtn.addEventListener('click', function() {
        rotateAngle += 90;
        previewImg.style.transform = 'rotate(' + rotateAngle + 'deg)';
      });

      searchBtn.addEventListener('click', async function() {
        if (!imageData) {
          alert('请先上传题目图片');
          return;
        }

        loadingOverlay.style.display = 'flex';

        try {
          var subject = document.getElementById('subject').value;
          var studentAnswer = document.getElementById('studentAnswer').value;

          var response = await fetch('/api/vision/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              image: imageData,
              subject: subject,
              student_answer: studentAnswer,
              include_similar: true,
              generate_plan: true
            })
          });

          var result = await response.json();

          if (result.success && result.data) {
            searchResult = result.data;
            renderResult(result.data);
            emptyState.style.display = 'none';
            resultCard.style.display = 'block';
          } else {
            alert(result.message || '搜题失败');
          }
        } catch (error) {
          console.error('Search error:', error);
          alert('搜题失败，请重试');
        } finally {
          loadingOverlay.style.display = 'none';
        }
      });

      addToWrongBtn.addEventListener('click', async function() {
        if (!searchResult) return;
        try {
          var response = await fetch('/api/user/wrong-questions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              content: searchResult.parse?.full_content || '',
              subject_code: searchResult.parse?.subject_code || '',
              correct_answer: searchResult.errorAnalysis?.correct_answer || '',
              error_analysis: searchResult.errorAnalysis?.analysis || '',
              error_types: searchResult.errorAnalysis?.error_types?.map(e => e.type) || []
            })
          });
          var result = await response.json();
          if (result.success) {
            alert('已加入错题本');
          } else {
            alert(result.message || '加入失败');
          }
        } catch (error) {
          alert('加入失败');
        }
      });

      function loadImage(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          imageData = e.target.result;
          previewImg.src = imageData;
          previewImg.style.transform = 'rotate(0deg)';
          rotateAngle = 0;

          uploadPlaceholder.style.display = 'none';
          imagePreview.style.display = 'block';
          uploadArea.classList.add('has-image');
          rotateBtn.disabled = false;
          cropBtn.disabled = false;
        };
        reader.readAsDataURL(file);
      }

      function removeImage() {
        imageData = null;
        uploadPlaceholder.style.display = 'block';
        imagePreview.style.display = 'none';
        uploadArea.classList.remove('has-image');
        rotateBtn.disabled = true;
        cropBtn.disabled = true;
        resultCard.style.display = 'none';
        emptyState.style.display = 'flex';
      }

      function renderResult(data) {
        document.getElementById('questionText').textContent = data.parse?.full_content || '未识别到题目内容';
        document.getElementById('correctAnswer').textContent = data.errorAnalysis?.correct_answer || '暂无答案';
        document.getElementById('analysisText').textContent = data.errorAnalysis?.analysis || '暂无解析';

        var errorTypesList = document.getElementById('errorTypesList');
        errorTypesList.innerHTML = '';
        (data.errorAnalysis?.error_types || []).forEach(function(type) {
          var tag = document.createElement('span');
          tag.className = 'tag tag--warning';
          tag.textContent = type.type;
          errorTypesList.appendChild(tag);
        });

        var similarList = document.getElementById('similarList');
        similarList.innerHTML = '';
        (data.similarQuestions || []).slice(0, 3).forEach(function(q, index) {
          var item = document.createElement('div');
          item.style.padding = 'var(--space-3)';
          item.style.background = 'var(--color-surface-container-low)';
          item.style.borderRadius = 'var(--radius-md)';
          item.style.marginBottom = 'var(--space-2)';
          item.style.cursor = 'pointer';
          item.style.transition = 'background .15s';
          item.innerHTML = '<div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-1);">相似题目 ' + (index + 1) + '</div><div style="font-size:var(--font-size-body);color:var(--color-on-surface);line-height:var(--line-height-body);">' + (q.content || '').substring(0, 100) + '...</div>';
          similarList.appendChild(item);
        });

        var planContent = document.getElementById('planContent');
        if (data.learningPlan) {
          planContent.innerHTML = '<div style="font-size:var(--font-size-body);color:var(--color-on-surface);margin-bottom:var(--space-3);"><strong>' + data.learningPlan.plan_title + '</strong> · ' + data.learningPlan.duration + '</div><ul style="margin:0;padding-left:var(--space-5);">';
          (data.learningPlan.learning_suggestions || []).forEach(function(suggestion) {
            planContent.innerHTML += '<li style="font-size:var(--font-size-body);color:var(--color-on-surface-variant);margin-bottom:var(--space-1);">' + suggestion + '</li>';
          });
          planContent.innerHTML += '</ul>';
        } else {
          planContent.innerHTML = '<div style="font-size:var(--font-size-body);color:var(--color-on-surface-variant);">暂无学习建议</div>';
        }

        lucide.createIcons();
      }

      var themeToggle = document.getElementById('themeToggle');
      function updateThemeIcon() {
        var isDark = document.documentElement.classList.contains('dark');
        var icon = themeToggle.querySelector('i');
        if (icon) {
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        }
      }
      themeToggle.addEventListener('click', function() {
        var html = document.documentElement;
        if (html.classList.contains('dark')) {
          html.classList.remove('dark');
          html.classList.add('light');
          localStorage.setItem('aitutor-theme', 'light');
        } else {
          html.classList.remove('light');
          html.classList.add('dark');
          localStorage.setItem('aitutor-theme', 'dark');
        }
        updateThemeIcon();
      });
      (function() {
        var saved = localStorage.getItem('aitutor-theme');
        if (saved) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(saved);
        }
        updateThemeIcon();
      })();

    })();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
