    <style>
      /* Auth tab active/inactive styles */
      .auth-tab.active {
        background: var(--color-primary);
        color: var(--color-on-primary);
      }
      .auth-tab:not(.active) {
        background: transparent;
        color: var(--color-on-surface-variant);
      }
      .auth-tab:not(.active):hover {
        background: var(--color-surface-container);
      }

      /* Input error state */
      .input-wrap.input--error {
        border-color: var(--color-error);
      }
      .input-wrap.input--error:focus-within {
        border-color: var(--color-error);
      }

      /* Form animation */
      .auth-form {
        animation: authFadeIn .25s ease-out;
      }
      @keyframes authFadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Loading state */
      .auth-submit-btn.loading {
        opacity: .7;
        pointer-events: none;
      }

      /* Desktop nav links visibility */
      @media (min-width: 1024px) {
        #desktopNavLinks { display: flex !important; }
        #hamburgerBtn { display: none !important; }
      }
      @media (max-width: 1023px) {
        .bottom-nav { display: flex !important; }
      }
    </style>

    <script>
    (function() {
      'use strict';

      /* ── Tab Toggle ── */
      var tabLogin = document.getElementById('tabLogin');
      var tabRegister = document.getElementById('tabRegister');
      var loginForm = document.getElementById('loginForm');
      var registerForm = document.getElementById('registerForm');
      var switchToRegister = document.getElementById('switchToRegister');
      var switchToLogin = document.getElementById('switchToLogin');

      function showForm(formToShow, activeTab) {
        loginForm.style.display = 'none';
        loginForm.classList.remove('active');
        registerForm.style.display = 'none';
        registerForm.classList.remove('active');
        tabLogin.classList.remove('active');
        tabLogin.setAttribute('aria-selected', 'false');
        tabRegister.classList.remove('active');
        tabRegister.setAttribute('aria-selected', 'false');
        formToShow.style.display = 'flex';
        formToShow.classList.add('active');
        activeTab.classList.add('active');
        activeTab.setAttribute('aria-selected', 'true');
        // Re-trigger animation
        formToShow.style.animation = 'none';
        formToShow.offsetHeight; // reflow
        formToShow.style.animation = '';
      }

      tabLogin.addEventListener('click', function(e) {
        e.preventDefault();
        showForm(loginForm, tabLogin);
      });
      tabRegister.addEventListener('click', function(e) {
        e.preventDefault();
        showForm(registerForm, tabRegister);
      });
      switchToRegister.addEventListener('click', function(e) {
        e.preventDefault();
        showForm(registerForm, tabRegister);
      });
      switchToLogin.addEventListener('click', function(e) {
        e.preventDefault();
        showForm(loginForm, tabLogin);
      });

      /* ── Password Toggle ── */
      document.querySelectorAll('.password-toggle').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var targetId = btn.getAttribute('data-target');
          var input = document.getElementById(targetId);
          var icon = btn.querySelector('i');
          if (input.type === 'password') {
            input.type = 'text';
            icon.setAttribute('data-lucide', 'eye');
          } else {
            input.type = 'password';
            icon.setAttribute('data-lucide', 'eye-off');
          }
          if (window.lucide) lucide.createIcons();
        });
      });

      /* ── Validation Helpers ── */
      var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      function setError(inputWrap, errorEl, show) {
        if (show) {
          inputWrap.classList.add('input--error');
          errorEl.style.display = 'block';
        } else {
          inputWrap.classList.remove('input--error');
          errorEl.style.display = 'none';
        }
      }

      function setLoading(btn, loading) {
        if (loading) {
          btn.classList.add('loading');
          btn.textContent = '处理中...';
        } else {
          btn.classList.remove('loading');
        }
      }

      /* ── Login Form Validation ── */
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = document.getElementById('loginEmail');
        var password = document.getElementById('loginPassword');
        var emailWrap = email.closest('.input-wrap');
        var emailError = document.getElementById('loginEmailError');
        var valid = true;

        if (!emailRegex.test(email.value.trim())) {
          setError(emailWrap, emailError, true);
          valid = false;
        } else {
          setError(emailWrap, emailError, false);
        }

        if (valid) {
          var btn = loginForm.querySelector('[data-dom-id="btn-login"]');
          setLoading(btn, true);
          setTimeout(function() {
            setLoading(btn, false);
            btn.textContent = '登 录';
            checkInitialization();
          }, 1200);
        }
      });

      /* ── Register Form Validation ── */
      registerForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = document.getElementById('regEmail');
        var username = document.getElementById('regUsername');
        var password = document.getElementById('regPassword');
        var confirm = document.getElementById('regConfirmPassword');
        var emailWrap = email.closest('.input-wrap');
        var emailError = document.getElementById('regEmailError');
        var passwordWrap = password.closest('.input-wrap');
        var passwordError = document.getElementById('regPasswordError');
        var confirmWrap = confirm.closest('.input-wrap');
        var confirmError = document.getElementById('regConfirmError');
        var valid = true;

        if (!emailRegex.test(email.value.trim())) {
          setError(emailWrap, emailError, true);
          valid = false;
        } else {
          setError(emailWrap, emailError, false);
        }

        if (password.value.length < 8) {
          setError(passwordWrap, passwordError, true);
          valid = false;
        } else {
          setError(passwordWrap, passwordError, false);
        }

        if (confirm.value !== password.value || confirm.value.length === 0) {
          setError(confirmWrap, confirmError, true);
          valid = false;
        } else {
          setError(confirmWrap, confirmError, false);
        }

        if (valid) {
          var btn = registerForm.querySelector('[data-dom-id="btn-register"]');
          setLoading(btn, true);
          setTimeout(function() {
            setLoading(btn, false);
            btn.textContent = '注 册';
            checkInitialization();
          }, 1200);
        }
      });

      /* ── Guest Login ── */
      document.querySelector('[data-dom-id="btn-guest"]').addEventListener('click', function() {
        checkInitialization();
      });

      /* ── Check Initialization ── */
      async function checkInitialization() {
        var token = localStorage.getItem('aitutor_token');
        if (!token) {
          window.location.href = 'dashboard.html';
          return;
        }

        try {
          var response = await fetch('/api/user/profile', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          var result = await response.json();
          if (result.success && result.data && result.data.initialized) {
            window.location.href = 'dashboard.html';
          } else {
            window.location.href = 'onboarding.html';
          }
        } catch (error) {
          console.error('Check initialization error:', error);
          window.location.href = 'dashboard.html';
        }
      }

      /* ── Theme Toggle ── */
      var themeToggle = document.getElementById('themeToggle');
      function updateThemeIcon() {
        var isDark = document.documentElement.classList.contains('dark');
        var icon = themeToggle.querySelector('i');
        if (icon) {
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        }
      }
      themeToggle.addEventListener('click', function() {
        var html = document.documentElement;
        if (html.classList.contains('dark')) {
          html.classList.remove('dark');
          html.classList.add('light');
          localStorage.setItem('aitutor-theme', 'light');
        } else {
          html.classList.remove('light');
          html.classList.add('dark');
          localStorage.setItem('aitutor-theme', 'dark');
        }
        updateThemeIcon();
      });
      // Init theme from localStorage
      (function() {
        var saved = localStorage.getItem('aitutor-theme');
        if (saved) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(saved);
        }
        updateThemeIcon();
      })();

    })();
    </script>
    <script>lucide.createIcons();</script>
