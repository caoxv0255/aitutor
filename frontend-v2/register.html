<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d71920" media="(prefers-color-scheme: light)">
  <meta name="description" content="注册智启AI导师 — 邮箱注册，保存你的错题本与学习进度">
  <title>注册 · 智启AI导师</title>
  <link rel="stylesheet" href="/assets/v2/css/fonts.css">
  <link rel="stylesheet" href="/assets/v2/css/system.css">
  <link rel="stylesheet" href="/assets/v2/css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a href="login.html">← 已有账号，去登录</a>
      <span class="eyebrow">Sign up</span>
    </header>

    <div class="form-card">
      <h1>注册</h1>
      <p class="lede">注册后错题与学习进度会保存在你的账号下。</p>

      <!-- 状态：表单 / 加载 / 成功 / 错误 / 离线（认证页以表单态承担"未登录"语义） -->
      <div id="state-region" aria-live="polite">
        <section class="state state--form" data-state="form">
          <form id="register-form" class="form-stack" novalidate>
            <label class="form-field" for="email">
              邮箱
              <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
            </label>

            <label class="form-field" for="password">
              密码
              <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="至少 8 位，含大小写字母与数字">
              <span class="form-hint">至少 8 位，需包含大写字母、小写字母和数字。</span>
            </label>

            <label class="form-field" for="grade">
              年级
              <select id="grade" name="grade" required>
                <option value="">请选择年级</option>
                <optgroup label="学段">
                  <option value="小学">小学</option>
                  <option value="初中">初中</option>
                  <option value="高中">高中</option>
                </optgroup>
                <optgroup label="小学">
                  <option value="小一">小一</option>
                  <option value="小二">小二</option>
                  <option value="小三">小三</option>
                  <option value="小四">小四</option>
                  <option value="小五">小五</option>
                  <option value="小六">小六</option>
                </optgroup>
                <optgroup label="初中">
                  <option value="初一">初一</option>
                  <option value="初二">初二</option>
                  <option value="初三">初三</option>
                </optgroup>
                <optgroup label="高中">
                  <option value="高一">高一</option>
                  <option value="高二">高二</option>
                  <option value="高三">高三</option>
                </optgroup>
              </select>
            </label>

            <p class="form-error" id="form-error" hidden></p>

            <button class="btn btn-block" id="submit-btn" type="submit">注册并开始</button>
          </form>
        </section>

        <section class="state state--loading" data-state="loading">
          <div class="state-card">
            <h2>正在创建账号…</h2>
            <p class="skeleton skeleton--w70"></p>
            <p class="skeleton skeleton--w50"></p>
          </div>
        </section>

        <section class="state state--success" data-state="success">
          <div class="state-card">
            <h2>注册成功</h2>
            <p id="success-copy">正在进入引导…</p>
          </div>
        </section>

        <section class="state state--error" data-state="error">
          <div class="state-card">
            <h2>注册失败</h2>
            <p id="error-copy">请检查填写的信息。</p>
            <p><button class="btn btn-ghost" id="retry-btn" type="button">返回修改</button></p>
          </div>
        </section>

        <section class="state state--offline" data-state="offline">
          <div class="state-card">
            <h2>当前处于离线状态</h2>
            <p>注册需要联网，恢复网络后重试。</p>
            <p><button class="btn btn-ghost" id="offline-retry-btn" type="button">重新连接</button></p>
          </div>
        </section>
      </div>

      <p class="form-alt">已有账号？<a href="login.html">去登录</a></p>
    </div>
  </div>

  <script src="/assets/v2/js/ui.js"></script>
  <script src="/assets/v2/js/api.js"></script>
  <script src="/assets/v2/js/register.js"></script>
</body>
</html>
