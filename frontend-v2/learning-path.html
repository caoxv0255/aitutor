<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d71920" media="(prefers-color-scheme: light)">
  <meta name="description" content="学习路径 — 四阶段进度时间轴、今日任务与推荐理由">
  <title>学习路径 · 智启AI导师</title>
  <link rel="stylesheet" href="/assets/v2/css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a href="/dashboard.html">← 仪表盘</a>
      <span class="eyebrow">Learning path</span>
    </header>

    <h1>学习路径</h1>
    <p class="lede" id="lede">按阶段推进的学习计划，每天只给你该做的那一件事。</p>

    <form class="toolbar" id="filter-form">
      <label class="field" for="subject-filter">
        学科
        <select id="subject-filter">
          <option value="math">数学</option>
          <option value="physics">物理</option>
          <option value="chemistry">化学</option>
          <option value="chinese">语文</option>
          <option value="english">英语</option>
          <option value="politics">政治</option>
        </select>
      </label>
      <button class="btn btn-ghost" type="submit">切换</button>
    </form>

    <!-- 六态：成功 / 加载 / 空 / 错误 / 未登录 / 离线
         空态由后端的 empty_state 驱动（无数据 / 本周已 100%）—— 文案与动作都来自后端，
         前端只做 URL 映射（后端给的路径实测有 404，见 SPEC-DATA G8）。 -->
    <div id="state-region" aria-live="polite">
      <section class="state state--empty" data-state="empty">
        <div class="state-card">
          <h2 id="empty-title">学习路径还没准备好</h2>
          <p id="empty-copy">先做几道诊断题。</p>
          <p id="empty-actions"></p>
        </div>
      </section>

      <section class="state state--loading" data-state="loading">
        <div class="state-card">
          <h2>正在生成学习路径…</h2>
          <p class="skeleton skeleton--w90"></p>
          <p class="skeleton skeleton--w70"></p>
          <p class="skeleton skeleton--w50"></p>
        </div>
      </section>

      <section class="state state--success" data-state="success">
        <div class="card">
          <div class="overall">
            <div>
              <span class="overall-value" id="progress-value">0</span><span class="overall-unit">%</span>
            </div>
            <div class="overall-meta" id="progress-meta"></div>
          </div>
          <div class="chip-row" id="cited-stats"></div>
          <p class="form-hint" id="reason"></p>
        </div>

        <h2 class="section-title">四阶段</h2>
        <div class="card">
          <ul class="timeline" id="stage-list"></ul>
        </div>

        <div id="task-block" hidden>
          <h2 class="section-title">今日任务</h2>
          <div class="card">
            <div class="task-row">
              <span class="task-name" id="task-title"></span>
              <span class="task-status" id="task-topic"></span>
            </div>
            <p class="topic-sub" id="task-reason"></p>
            <p id="task-action"></p>
          </div>
        </div>
      </section>

      <section class="state state--error" data-state="error">
        <div class="state-card">
          <h2>加载失败</h2>
          <p id="error-copy">服务暂时不可用。</p>
          <p><button class="btn btn-ghost" id="retry-btn" type="button">重试</button></p>
        </div>
      </section>

      <section class="state state--auth" data-state="auth">
        <div class="state-card">
          <h2>需要登录</h2>
          <p>学习路径基于你的练习记录，请先登录。</p>
          <p><a class="btn" href="/login.html?next=learning-path.html">去登录</a></p>
        </div>
      </section>

      <section class="state state--offline" data-state="offline">
        <div class="state-card">
          <h2>当前处于离线状态</h2>
          <p>学习路径需要联网生成，恢复网络后重试。</p>
          <p><button class="btn btn-ghost" id="offline-retry-btn" type="button">重新连接</button></p>
        </div>
      </section>
    </div>
  </div>

  <script src="/assets/v2/js/ui.js"></script>
  <script src="/assets/v2/js/api.js"></script>
  <script src="/assets/v2/js/learning-path.js"></script>
</body>
</html>
