<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d71920" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0b10" media="(prefers-color-scheme: dark)">
  <meta name="description" content="作文批改报告 — 左图右文的逐句对照阅读">
  <title>批改报告 · 智启AI导师</title>
  <link rel="stylesheet" href="/assets/v2/css/fonts.css">
  <link rel="stylesheet" href="/assets/v2/css/system.css">
  <link rel="stylesheet" href="/assets/v2/css/app.css">
  <!-- Marked 17.0.4（MIT）与 DOMPurify 3.4.8（Apache-2.0 / MPL-2.0）自托管在
       assets/vendor/ —— 与 katex 同一做法（见 photo-solve.html）。审计 R2 要求
       零境外请求，二者都不得改回 CDN；许可证随源码一并入库（同目录 LICENSE*）。
       顺序要求：marked 必须在 DOMPurify 之前（页面脚本按此顺序调用）。
       ⚠️ 本批只引入库与页面骨架；连线/气泡/CSS 属批次 4。 -->
</head>
<body>
  <nav class="nav">
    <div class="container nav__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true"></span>
        智启AI导师
      </a>
      <div class="nav__links">
        <a class="nav__link" href="/dashboard.html">仪表盘</a>
        <a class="nav__link" href="/practice-hub.html">练习</a>
        <a class="nav__link" href="/review-session.html">复习</a>
        <a class="nav__link" href="/wrong-book.html">错题本</a>
        <a class="nav__cta" href="/essay.html">作文批改</a>
      </div>
    </div>
  </nav>

  <!-- 六态：成功（阅读器）/ 加载 / 空 / 错误 / 未登录 / 离线。
       报告在服务端只对本人可见，"空"表示缺 id 或该报告不存在/非本人。 -->
  <div id="state-region" aria-live="polite">
    <section class="state state--empty" data-state="empty">
      <div class="section section--tight">
        <div class="container">
          <div class="state-card">
            <h2>找不到这份批改报告</h2>
            <p id="empty-copy">请从批改记录的列表里打开报告，或先批改一篇作文。</p>
            <p><a class="cta-primary" href="/essay.html">去作文批改</a></p>
          </div>
        </div>
      </div>
    </section>

    <section class="state state--loading" data-state="loading">
      <div class="section section--tight">
        <div class="container">
          <div class="section__eyebrow">REPORT</div>
          <h2 class="section__title" id="loading-title">正在加载报告…</h2>
          <div class="state-card">
            <p class="skeleton skeleton--w90"></p>
            <p class="skeleton skeleton--w70"></p>
            <p class="skeleton skeleton--w50"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="state state--success" data-state="success">
      <!-- 顶部工具栏：返回 / 标题 / 总分徽章 / 学科切换 -->
      <header class="reader-bar">
        <div class="container reader-bar__inner">
          <a class="reader-bar__back" id="back-link" href="/essay.html">返回</a>
          <h1 class="reader-bar__title" id="essay-title">作文批改报告</h1>
          <!-- 总分：后端各路径落库位置不一（scores.total / meta.scores.total / score），
               取不到就不显示徽章，绝不显示占位假分数。 -->
          <span class="score-badge" id="score-badge" hidden></span>
          <label class="reader-bar__subject" for="subject-select">
            学科
            <select id="subject-select">
              <option value="chinese">语文</option>
              <option value="english">英语</option>
            </select>
          </label>
        </div>
        <!-- 学科只影响批注类型标签的显示名，不改动报告内容本身（报告是一次批改的产物）。
             无后端接口支持"换学科重批"，故此控件不触发任何请求。 -->
        <p class="container reader-bar__hint" id="subject-caption"></p>
      </header>

      <div class="container">
        <p class="report-meta" id="report-meta"></p>

        <div class="reader-grid" id="reader-grid">
          <!-- 左栏：作文原图（滚轮缩放 + 拖拽平移，纯 JS）+ 可折叠总体评语 -->
          <section class="reader-col reader-col--image">
            <details class="summary-card" open>
              <summary class="summary-card__summary">总体评语</summary>
              <div class="summary-body" id="summary-left"></div>
            </details>

            <figure class="essay-figure">
              <div class="essay-canvas" id="essay-canvas" tabindex="0" role="group" aria-label="作文原图，可用滚轮缩放、拖拽平移">
                <img id="essay-image" alt="作文原图" hidden>
                <p class="canvas-placeholder" id="image-placeholder">本次报告未包含作文原图。</p>
              </div>
              <figcaption class="essay-caption">
                <span class="essay-caption__hint">滚轮缩放 · 拖拽平移</span>
                <button class="cta-secondary" id="zoom-reset" type="button">重置缩放</button>
              </figcaption>
            </figure>
          </section>

          <!-- 右栏：AI 修改后的文本（按段落，句子以 .sent 包裹，按 change_type 着色）+ 可折叠总体评语 -->
          <section class="reader-col reader-col--text">
            <details class="summary-card" open>
              <summary class="summary-card__summary">总体评语</summary>
              <div class="summary-body" id="summary-right"></div>
            </details>

            <div class="revised-text" id="revised-text"></div>
            <p class="form-hint" id="text-empty" hidden>本次报告未包含作文文本。</p>
          </section>

          <!-- 批次 4 的连线层：本批**不画线**，只预留容器（0 尺寸，不占布局）。
               batch 4 用 CSS 把它绝对定位到 .reader-grid 上并绘制端点连线。 -->
          <svg id="connector-layer" class="connector-layer" width="0" height="0" aria-hidden="true"></svg>
        </div>
      </div>
    </section>

    <section class="state state--error" data-state="error">
      <div class="section section--tight">
        <div class="container">
          <div class="state-card">
            <h2>报告加载失败</h2>
            <p id="error-copy">服务暂时不可用。</p>
            <p><button class="cta-secondary" id="retry-btn" type="button">重试</button></p>
          </div>
        </div>
      </div>
    </section>

    <section class="state state--auth" data-state="auth">
      <div class="section section--tight">
        <div class="container">
          <div class="state-card">
            <h2>需要登录</h2>
            <p>批改报告只对本人开放，请先登录后查看。</p>
            <div class="hero__ctas">
              <a class="cta-primary" id="login-link" href="/login.html?next=essay.html">去登录</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="state state--offline" data-state="offline">
      <div class="section section--tight">
        <div class="container">
          <div class="state-card">
            <h2>当前处于离线状态</h2>
            <p>报告需要联网获取，恢复网络后可重试。</p>
            <p><button class="cta-secondary" id="offline-retry-btn" type="button">重新连接</button></p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer class="footer">
    <div class="container">智启AI导师 · 数据仅用于你的个人学习记录</div>
  </footer>

  <nav class="tabbar" aria-label="底部导航">
    <a class="tabbar__item" href="/dashboard.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg></span>首页</a>
    <a class="tabbar__item" href="/wrong-book.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span>错题</a>
    <a class="tabbar__item tabbar__item--raise" href="/photo-solve.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg></span>拍照</a>
    <a class="tabbar__item" href="/review-session.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/></svg></span>复习</a>
    <a class="tabbar__item" href="/essay.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>作文</a>
  </nav>

  <script src="/assets/v2/vendor/marked/marked.umd.js"></script>
  <script src="/assets/v2/vendor/dompurify/purify.min.js"></script>
  <script src="/assets/v2/js/ui.js"></script>
  <script src="/assets/v2/js/api.js"></script>
  <script src="/assets/v2/js/essay-review.js"></script>
</body>
</html>
