<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d71920" media="(prefers-color-scheme: light)">
  <meta name="description" content="知识掌握度 — 按知识点看掌握程度与薄弱项，给出复习建议">
  <title>知识掌握度 · 智启AI导师</title>
  <link rel="stylesheet" href="/assets/v2/css/fonts.css">
  <link rel="stylesheet" href="/assets/v2/css/system.css">
  <link rel="stylesheet" href="/assets/v2/css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a href="review-session.html">← 今日复习</a>
      <span class="eyebrow">Mastery</span>
    </header>

    <h1>知识掌握度</h1>
    <p class="lede">按知识点统计的掌握程度与练习正确率，薄弱项会给出复习建议。</p>

    <form class="toolbar" id="filter-form">
      <label class="field" for="subject-filter">
        学科
        <select id="subject-filter">
          <option value="">全部</option>
          <option value="math">数学</option>
          <option value="physics">物理</option>
          <option value="chemistry">化学</option>
          <option value="chinese">语文</option>
          <option value="english">英语</option>
          <option value="politics">政治</option>
        </select>
      </label>
      <button class="btn btn-ghost" type="submit">应用筛选</button>
    </form>

    <!-- 六态：成功 / 加载 / 空 / 错误 / 未登录 / 离线 -->
    <div id="state-region" aria-live="polite">
      <section class="state state--empty" data-state="empty">
        <div class="state-card">
          <h2>还没有练习记录</h2>
          <p id="empty-copy">做完一组题或复习一次，掌握度就会出现在这里。</p>
          <p>
            <a class="btn btn-ghost" href="photo-solve.html">去拍照解题</a>
            <a class="btn btn-ghost" href="review-session.html">去今日复习</a>
          </p>
        </div>
      </section>

      <section class="state state--loading" data-state="loading">
        <div class="state-card">
          <h2>正在统计掌握度…</h2>
          <p class="skeleton skeleton--w90"></p>
          <p class="skeleton skeleton--w70"></p>
          <p class="skeleton skeleton--w50"></p>
        </div>
      </section>

      <section class="state state--success" data-state="success">
        <div class="card">
          <div class="overall">
            <div>
              <span class="overall-value" id="overall-value">0</span><span class="overall-unit">%</span>
            </div>
            <div class="overall-meta" id="overall-meta"></div>
          </div>
        </div>

        <h2 class="section-title">分知识点</h2>
        <div class="card" id="topic-list"></div>

        <div id="advice-block" hidden>
          <h2 class="section-title">复习建议</h2>
          <div class="card">
            <ul class="advice" id="advice-list"></ul>
          </div>
        </div>
      </section>

      <section class="state state--error" data-state="error">
        <div class="state-card">
          <h2>统计失败</h2>
          <p id="error-copy">服务暂时不可用。</p>
          <p><button class="btn btn-ghost" id="retry-btn" type="button">重试</button></p>
        </div>
      </section>

      <section class="state state--auth" data-state="auth">
        <div class="state-card">
          <h2>需要登录</h2>
          <p>掌握度属于个人数据，请先登录后查看。</p>
          <p><a class="btn" href="login.html?next=mastery.html">去登录</a></p>
        </div>
      </section>

      <section class="state state--offline" data-state="offline">
        <div class="state-card">
          <h2>当前处于离线状态</h2>
          <p>掌握度需要联网统计，恢复网络后重试。</p>
          <p><button class="btn btn-ghost" id="offline-retry-btn" type="button">重新连接</button></p>
        </div>
      </section>
    </div>
  </div>

  <script src="/assets/v2/js/ui.js"></script>
  <script src="/assets/v2/js/api.js"></script>
  <script src="/assets/v2/js/mastery.js"></script>
