<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d71920" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0b10" media="(prefers-color-scheme: dark)">
  <meta name="description" content="练习中心 — 选学科组卷、逐题作答、交卷看分数与错题">
  <title>练习中心 · 智启AI导师</title>
  <link rel="stylesheet" href="/assets/v2/css/fonts.css">
  <link rel="stylesheet" href="/assets/v2/css/system.css">
  <link rel="stylesheet" href="/assets/v2/css/app.css">
</head>
<body>
  <nav class="nav">
    <div class="container nav__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true"></span>
        智启AI导师
      </a>
      <div class="nav__links">
        <a class="nav__link" href="/dashboard.html">仪表盘</a>
        <a class="nav__link" href="/practice-hub.html" aria-current="page">练习</a>
        <a class="nav__link" href="/review-session.html">复习</a>
        <a class="nav__link" href="/wrong-book.html">错题本</a>
        <a class="nav__cta" href="/photo-solve.html">拍照解题</a>
      </div>
    </div>
  </nav>

  <header class="hero hero--app">
    <div class="hero-blobs" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="container">
      <div class="hero__copy">
        <div class="eyebrow"><span class="eyebrow__dot" aria-hidden="true"></span>Practice</div>
        <h1 class="hero__title">练习中心</h1>
        <p class="hero__sub">按学科组一份练习，逐题作答后交卷，错题会自动进入错题本。</p>
      </div>
    </div>
  </header>

  <!-- 六态：成功 / 加载 / 空 / 错误 / 未登录 / 离线
       success 内含三个子视图（组卷 / 答题 / 结果），用 hidden 切换 ——
       它们共享同一套状态语义，不必各占一个面板。
       每个状态自带 section + container（标准骨架），保证六态观感一致。 -->
  <div id="state-region" aria-live="polite">
    <section class="state state--empty" data-state="empty">
      <div class="section section--tight">
        <div class="container">
          <div class="state-card">
            <h2>没有可练习的题目</h2>
            <p id="empty-copy">该学科下暂时没有匹配的题目，换个学科试试。</p>
            <p><button class="cta-secondary" id="empty-back-btn" type="button">重新组卷</button></p>
          </div>
        </div>
      </div>
    </section>

    <section class="state state--loading" data-state="loading">
      <div class="section section--tight">
        <div class="container">
          <div class="section__eyebrow">LOADING</div>
          <h2 class="section__title" id="loading-title">正在组卷…</h2>
          <div class="state-card" style="margin-top: 20px">
            <p class="skeleton skeleton--w90"></p>
            <p class="skeleton skeleton--w70"></p>
            <p class="skeleton skeleton--w50"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="state state--success" data-state="success">
      <!-- 子视图 1：组卷 -->
      <div id="view-setup">
        <div class="section section--tight">
          <div class="container">
            <div class="card">
              <div class="form-stack">
                <label class="form-field" for="subject-select">
                  学科
                  <!-- 9 科由 assets/js/subjects.js 的 fillSelect() 统一填充（PM-BRIEF §F.8） -->
                  <select id="subject-select"></select>
                </label>
                <label class="form-field" for="count-select">
                  题量
                  <select id="count-select">
                    <option value="10">10 题</option>
                    <option value="20" selected>20 题</option>
                    <option value="30">30 题</option>
                  </select>
                </label>
                <button class="btn btn-block" id="start-btn" type="button">开始练习</button>
              </div>
            </div>

            <h2 class="section-title">最近练习</h2>
            <div class="card" id="history-list"></div>
          </div>
        </div>
      </div>

      <!-- 子视图 2：答题 -->
      <div id="view-quiz" hidden>
        <div class="section section--tight">
          <div class="container">
            <div class="progress-line">
              <span id="quiz-progress">第 1 / 1 题</span>
              <span id="quiz-meta"></span>
            </div>

            <article class="q-card">
              <p class="stem" id="quiz-stem"></p>
              <div id="quiz-options"></div>
              <label class="form-field" for="quiz-text" id="quiz-text-wrap" hidden>
                你的答案
                <input id="quiz-text" type="text" autocomplete="off" placeholder="写出答案">
              </label>
            </article>

            <div class="field-row">
              <button class="btn btn-ghost" id="prev-btn" type="button">上一题</button>
              <button class="btn btn-ghost" id="next-btn" type="button">下一题</button>
              <button class="btn" id="submit-paper-btn" type="button">交卷</button>
            </div>
            <p class="form-hint" id="answer-hint"></p>
          </div>
        </div>
      </div>

      <!-- 子视图 3：结果 -->
      <div id="view-result" hidden>
        <div class="section section--tight">
          <div class="container">
            <div class="card">
              <div class="overall">
                <div>
                  <span class="overall-value" id="result-score">0</span><span class="overall-unit">%</span>
                </div>
                <div class="overall-meta" id="result-meta"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="section section--cream section--tight">
          <div class="container">
            <div class="section__eyebrow">DETAIL</div>
            <h2 class="section__title">逐题结果</h2>
            <div class="card" id="result-list"></div>
          </div>
        </div>

        <div class="section section--tight">
          <div class="container">
            <div class="field-row">
              <a class="btn btn-ghost" href="/wrong-book.html">去错题本</a>
              <button class="btn btn-ghost" id="again-btn" type="button">再练一组</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="state state--error" data-state="error">
      <div class="section section--tight">
        <div class="container">
          <div class="state-card">
            <h2>练习出错</h2>
            <p id="error-copy">服务暂时不可用。</p>
            <p><button class="cta-secondary" id="retry-btn" type="button">重试</button></p>
          </div>
        </div>
      </div>
    </section>

    <section class="state state--auth" data-state="auth">
      <div class="section section--tight">
        <div class="container">
          <div class="state-card">
            <h2>需要登录</h2>
            <p>练习记录要记到你的账号下，请先登录。</p>
            <div class="hero__ctas">
              <a class="cta-primary" href="/login.html?next=practice-hub.html">去登录</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="state state--offline" data-state="offline">
      <div class="section section--tight">
        <div class="container">
          <div class="state-card">
            <h2>当前处于离线状态</h2>
            <p>组卷与交卷都需要联网，恢复网络后重试。</p>
            <p><button class="cta-secondary" id="offline-retry-btn" type="button">重新连接</button></p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer class="footer">
    <div class="container">智启AI导师 · 数据仅用于你的个人学习记录</div>
  </footer>

  <nav class="tabbar" aria-label="底部导航">
    <a class="tabbar__item" href="/dashboard.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg></span>首页</a>
    <a class="tabbar__item" href="/wrong-book.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span>错题</a>
    <a class="tabbar__item tabbar__item--raise" href="/photo-solve.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg></span>拍照</a>
    <a class="tabbar__item" href="/review-session.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/></svg></span>复习</a>
    <a class="tabbar__item" href="/v2/settings.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>我的</a>
  </nav>

  <script src="/assets/v2/js/ui.js"></script>
  <script src="/assets/v2/js/api.js"></script>
  <script src="/assets/v2/js/subjects.js"></script>
  <script src="/assets/v2/js/practice-hub.js"></script>
</body>
</html>
