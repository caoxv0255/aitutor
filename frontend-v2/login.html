<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d71920" media="(prefers-color-scheme: light)">
  <meta name="description" content="登录智启AI导师 — 继续你的错题本、拍照解题与学习计划">
  <title>登录 · 智启AI导师</title>
  <link rel="stylesheet" href="/assets/v2/css/fonts.css">
  <link rel="stylesheet" href="/assets/v2/css/system.css">
  <link rel="stylesheet" href="/assets/v2/css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a href="/">← 返回首页</a>
      <span class="eyebrow">Sign in</span>
    </header>

    <div class="form-card">
      <h1>登录</h1>
      <p class="lede">登录后可继续拍照解题、错题本与学习计划。</p>

      <!-- 状态：表单 / 加载 / 成功 / 错误 / 离线
           认证页没有"未登录"这一状态 —— 表单态本身即未登录态（见 SPEC-ROUTES §3 例外）。 -->
      <div id="state-region" aria-live="polite">
        <section class="state state--form" data-state="form">
          <form id="login-form" class="form-stack" novalidate>
            <label class="form-field" for="email">
              邮箱
              <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
            </label>

            <label class="form-field" for="password">
              密码
              <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="至少 6 位">
            </label>

            <p class="form-error" id="form-error" hidden></p>

            <button class="btn btn-block" id="submit-btn" type="submit">登录</button>
            <button class="btn btn-ghost btn-block" id="guest-btn" type="button">以游客身份继续</button>
          </form>

          <p class="form-alt">还没有账号？<a href="register.html">注册</a></p>
        </section>

        <section class="state state--loading" data-state="loading">
          <div class="state-card">
            <h2>正在登录…</h2>
            <p class="skeleton skeleton--w70"></p>
            <p class="skeleton skeleton--w50"></p>
          </div>
        </section>

        <section class="state state--success" data-state="success">
          <div class="state-card">
            <h2>登录成功</h2>
            <p id="success-copy">正在跳转…</p>
          </div>
        </section>

        <section class="state state--error" data-state="error">
          <div class="state-card">
            <h2>登录失败</h2>
            <p id="error-copy">邮箱或密码不正确。</p>
            <p><button class="btn btn-ghost" id="retry-btn" type="button">重新输入</button></p>
          </div>
        </section>

        <section class="state state--offline" data-state="offline">
          <div class="state-card">
            <h2>当前处于离线状态</h2>
            <p>登录需要联网，恢复网络后重试。</p>
            <p><button class="btn btn-ghost" id="offline-retry-btn" type="button">重新连接</button></p>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="/assets/v2/js/ui.js"></script>
  <script src="/assets/v2/js/api.js"></script>
  <script src="/assets/v2/js/login.js"></script>
</body>
</html>
