<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d71920" media="(prefers-color-scheme: light)">
  <meta name="description" content="作文批改 — 拍下作文照片，AI 逐段批注与分项评分">
  <title>作文批改 · 智启AI导师</title>
  <link rel="stylesheet" href="/assets/v2/css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a href="/dashboard.html">← 仪表盘</a>
      <span class="eyebrow">Essay</span>
    </header>

    <h1>作文批改</h1>
    <p class="lede">拍下作文照片，AI 会给出分项评分、逐段批注与总评。批改需要几十秒，请耐心等待。</p>

    <!-- 六态：成功 / 加载 / 空 / 错误 / 未登录 / 离线
         success 内含两个子视图（上传表单 / 批改结果）。
         空态语义：未选择照片就提交（没有可批改的内容）。 -->
    <div id="state-region" aria-live="polite">
      <section class="state state--empty" data-state="empty">
        <div class="state-card">
          <h2>还没有选择作文照片</h2>
          <p id="empty-copy">先拍一张或多张作文照片，再点开始批改。</p>
          <p><button class="btn btn-ghost" id="empty-back-btn" type="button">返回选择</button></p>
        </div>
      </section>

      <section class="state state--loading" data-state="loading">
        <div class="state-card">
          <h2 id="loading-title">正在处理…</h2>
          <p class="skeleton skeleton--w90"></p>
          <p class="skeleton skeleton--w70"></p>
          <p class="skeleton skeleton--w50"></p>
          <p class="form-hint">批改是一次完整的模型调用，通常需要 30–60 秒。</p>
        </div>
      </section>

      <section class="state state--success" data-state="success">
        <div id="view-setup">
          <div class="card">
            <label class="dropzone" for="essay-input">
              <span class="dropzone-title">点击拍摄或选择作文照片</span>
              <span class="dropzone-hint">可多选，按作文页顺序排列；单张 ≤ 10MB</span>
              <input id="essay-input" type="file" accept="image/*" multiple capture="environment">
            </label>

            <ul class="thumbs" id="thumbs"></ul>

            <div class="form-stack">
              <label class="form-field" for="essay-title">
                作文标题（可留空）
                <input id="essay-title" type="text" autocomplete="off" placeholder="如：我的母亲">
              </label>

              <label class="form-field" for="exam-level">
                考试类型
                <select id="exam-level">
                  <option value="gaokao">高考</option>
                  <option value="zhongkao">中考</option>
                </select>
              </label>

              <label class="form-field" for="grade-select">
                年级
                <select id="grade-select">
                  <option value="初一">初一</option>
                  <option value="初二">初二</option>
                  <option value="初三">初三</option>
                  <option value="高一">高一</option>
                  <option value="高二">高二</option>
                  <option value="高三">高三</option>
                </select>
              </label>

              <button class="btn btn-block" id="grade-btn" type="button">开始批改</button>
            </div>
          </div>

          <h2 class="section-title">最近批改</h2>
          <div class="card" id="history-list"></div>
        </div>

        <div id="view-result" hidden>
          <div class="card">
            <h2 id="result-title">批改结果</h2>
            <p class="form-hint" id="result-sub"></p>
            <div class="score-grid" id="score-grid"></div>
          </div>

          <h2 class="section-title">总评</h2>
          <div class="card" id="summary"></div>

          <h2 class="section-title">逐段批注</h2>
          <div class="card" id="note-list"></div>

          <div class="field-row">
            <button class="btn btn-ghost" id="again-btn" type="button">再批一篇</button>
          </div>
        </div>
      </section>

      <section class="state state--error" data-state="error">
        <div class="state-card">
          <h2>批改失败</h2>
          <p id="error-copy">服务暂时不可用。</p>
          <p><button class="btn btn-ghost" id="retry-btn" type="button">重试</button></p>
        </div>
      </section>

      <section class="state state--auth" data-state="auth">
        <div class="state-card">
          <h2>需要登录</h2>
          <p>批改结果要保存到你的账号下，请先登录。</p>
          <p><a class="btn" href="/login.html?next=essay.html">去登录</a></p>
        </div>
      </section>

      <section class="state state--offline" data-state="offline">
        <div class="state-card">
          <h2>当前处于离线状态</h2>
          <p>批改需要联网，恢复网络后重试；已选照片会保留在本页。</p>
          <p><button class="btn btn-ghost" id="offline-retry-btn" type="button">重新连接</button></p>
        </div>
      </section>
    </div>
  </div>

  <script src="/assets/v2/js/ui.js"></script>
  <script src="/assets/v2/js/api.js"></script>
  <script src="/assets/v2/js/essay.js"></script>
</body>
</html>
