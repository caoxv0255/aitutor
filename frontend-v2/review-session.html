<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d71920" media="(prefers-color-scheme: light)">
  <meta name="description" content="今日复习 — 按遗忘曲线排期的错题重做，一组一题加相似题">
  <title>今日复习 · 智启AI导师</title>
  <link rel="stylesheet" href="/assets/v2/css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a href="wrong-book.html">← 错题本</a>
      <span class="eyebrow">Review</span>
    </header>

    <h1>今日复习</h1>
    <p class="lede">按遗忘曲线排期，只推送该复习的错题。自评后系统会调整下次间隔。</p>

    <div id="stat-region" aria-live="polite" class="stat-row"></div>

    <!-- 六态：成功 / 加载 / 空 / 错误 / 未登录 / 离线
         空态承担两种语义：今日无排期（reason=none）与本次已复习完（reason=done） -->
    <div id="state-region" aria-live="polite">
      <section class="state state--empty" data-state="empty">
        <div class="state-card">
          <h2 id="empty-title">今日没有待复习的错题</h2>
          <p id="empty-copy">去错题本看看，或先拍照解析一张卷子。</p>
          <p><a class="btn btn-ghost" href="wrong-book.html">去错题本</a></p>
        </div>
      </section>

      <section class="state state--loading" data-state="loading">
        <div class="state-card">
          <h2>正在取今日队列…</h2>
          <p class="skeleton skeleton--w90"></p>
          <p class="skeleton skeleton--w70"></p>
          <p class="skeleton skeleton--w50"></p>
        </div>
      </section>

      <section class="state state--success" data-state="success">
        <div class="progress-line">
          <span id="progress">第 1 / 1 组</span>
          <span id="kp-label"></span>
        </div>

        <article class="q-card">
          <div class="q-head">
            <span class="tag" id="subject-tag">数学</span>
            <span class="tag" id="mastery-tag">掌握度 0%</span>
            <span class="tag" id="weak-tag" hidden>薄弱</span>
          </div>

          <p class="stem" id="stem"></p>

          <div class="answer-block" id="answer-block" hidden>
            <div id="user-answer"></div>
            <div id="correct-answer"></div>
          </div>

          <div class="feedback" id="feedback" hidden></div>

          <div class="quality">
            <span class="quality-label" id="quality-label">做完后自评：这题你掌握得怎么样？</span>
            <div class="quality-grid" id="quality-grid">
              <button class="quality-btn" type="button" data-quality="0">忘了</button>
              <button class="quality-btn" type="button" data-quality="1">很难</button>
              <button class="quality-btn" type="button" data-quality="2">困难</button>
              <button class="quality-btn" type="button" data-quality="3">一般</button>
              <button class="quality-btn" type="button" data-quality="4">容易</button>
              <button class="quality-btn quality-btn--best" type="button" data-quality="5">秒答</button>
            </div>
          </div>
        </article>
      </section>

      <section class="state state--error" data-state="error">
        <div class="state-card">
          <h2>取队列失败</h2>
          <p id="error-copy">服务暂时不可用。</p>
          <p><button class="btn btn-ghost" id="retry-btn" type="button">重试</button></p>
        </div>
      </section>

      <section class="state state--auth" data-state="auth">
        <div class="state-card">
          <h2>需要登录</h2>
          <p>复习记录要记到你的账号下，请先登录。</p>
          <p><a class="btn" href="login.html?next=review-session.html">去登录</a></p>
        </div>
      </section>

      <section class="state state--offline" data-state="offline">
        <div class="state-card">
          <h2>当前处于离线状态</h2>
          <p>复习需要联网读取队列与回写记录，恢复网络后重试。</p>
          <p><button class="btn btn-ghost" id="offline-retry-btn" type="button">重新连接</button></p>
        </div>
      </section>
    </div>
  </div>

  <script src="/assets/v2/js/ui.js"></script>
  <script src="/assets/v2/js/api.js"></script>
  <script src="/assets/v2/js/review-session.js"></script>
<nav class="tabbar" aria-label="底部导航">
  <a class="tabbar__item" href="/dashboard.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg></span>首页</a>
  <a class="tabbar__item" href="/wrong-book.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span>错题</a>
  <a class="tabbar__item tabbar__item--raise" href="/photo-solve.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg></span>拍照</a>
  <a class="tabbar__item" href="/review-session.html" aria-current="page"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/></svg></span>复习</a>
  <a class="tabbar__item" href="/v2/settings.html"><span class="tabbar__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>我的</a>
  </nav>
</body>
</html>
