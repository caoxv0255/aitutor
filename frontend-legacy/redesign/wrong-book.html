<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题本 — AI Tutor</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

:root {
  --aitutor-primary-50: #fff1f1;
  --aitutor-primary-100: #ffe0e0;
  --aitutor-primary-200: #ffc5c5;
  --aitutor-primary-300: #ffa0a0;
  --aitutor-primary-400: #f36b6b;
  --aitutor-primary-500: #d71920;
  --aitutor-primary-600: #b8151b;
  --aitutor-primary-700: #941218;
  --aitutor-primary-800: #7a1014;
  --aitutor-primary-900: #660f13;
  --aitutor-blue-50: #eff6ff;
  --aitutor-blue-100: #dbeafe;
  --aitutor-blue-200: #bfdbfe;
  --aitutor-blue-300: #93c5fd;
  --aitutor-blue-400: #60a5fa;
  --aitutor-blue-500: #2563eb;
  --aitutor-blue-600: #1d4ed8;
  --aitutor-blue-700: #1e40af;
  --aitutor-blue-800: #1e3a8a;
  --aitutor-blue-900: #172554;
  --aitutor-success-50: #ecfdf5;
  --aitutor-success-100: #d1fae5;
  --aitutor-success-200: #a7f3d0;
  --aitutor-success-300: #6ee7b7;
  --aitutor-success-400: #34d399;
  --aitutor-success-500: #059669;
  --aitutor-success-600: #047857;
  --aitutor-warning-50: #fffbeb;
  --aitutor-warning-100: #fef3c7;
  --aitutor-warning-200: #fde68a;
  --aitutor-warning-300: #fcd34d;
  --aitutor-warning-400: #fbbf24;
  --aitutor-warning-500: #f59e0b;
  --aitutor-error-50: #fef2f2;
  --aitutor-error-100: #fee2e2;
  --aitutor-error-200: #fecaca;
  --aitutor-error-300: #fca5a5;
  --aitutor-error-400: #f87171;
  --aitutor-error-500: #ef4444;
  --aitutor-error-600: #dc2626;

  --primary: var(--aitutor-primary-500); --primary-hover: var(--aitutor-primary-600); --primary-foreground: #ffffff;
  --secondary: var(--aitutor-blue-500); --secondary-hover: var(--aitutor-blue-600); --secondary-foreground: #ffffff;
  --accent: var(--aitutor-primary-500); --accent-hover: var(--aitutor-primary-600); --accent-foreground: #ffffff;
  --background: #f8f9fa; --foreground: #1a1a2e; --muted: #94a3b8; --muted-foreground: #64748b;
  --border: #e2e8f0; --ring: var(--aitutor-primary-500);
  --error: var(--aitutor-error-600); --error-foreground: #ffffff; --success: var(--aitutor-success-600); --warning: var(--aitutor-warning-600);
  --surface: #ffffff; --surface-dim: #f1f5f9; --surface-container-lowest: #f8f9fa;
  --surface-container-low: #f1f5f9; --surface-container: #e8ecf1; --surface-container-high: #dfe4ea; --surface-container-highest: #d5dae1;
  --inverse-surface: #1a1a2e; --inverse-on-surface: #f1f5f9;
  --bg: var(--background); --fg: var(--foreground); --rule: var(--border); --link: var(--aitutor-blue-600); --card-bg: var(--surface);

  --font-display: 'DM Sans', 'Noto Sans SC', sans-serif; --font-heading: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', 'DM Sans', sans-serif; --font-mono: 'DM Sans', monospace;
  --font-size-display: 56px; --font-size-h1: 40px; --font-size-h2: 32px; --font-size-h3: 24px;
  --font-size-h4: 20px; --font-size-body: 16px; --font-size-lead: 18px; --font-size-caption: 12px;
  --font-size-eyebrow: 11px; --font-size-mono: 14px;
  --font-weight-display: 700; --font-weight-h1: 700; --font-weight-h2: 600; --font-weight-h3: 600;
  --font-weight-h4: 600; --font-weight-body: 400; --font-weight-lead: 400; --font-weight-caption: 400;
  --font-weight-eyebrow: 600; --font-weight-mono: 400;
  --line-height-display: 1.1; --line-height-h1: 1.2; --line-height-h2: 1.25; --line-height-h3: 1.3;
  --line-height-h4: 1.4; --line-height-body: 1.6; --line-height-lead: 1.7; --line-height-caption: 1.5;
  --line-height-eyebrow: 1.4; --line-height-mono: 1.6;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;

  --size-button-sm: 32px; --size-button-md: 40px; --size-button-lg: 48px;
  --size-input-height: 40px; --size-icon-sm: 16px; --size-icon-md: 24px; --size-icon-lg: 32px;

  --radius-sm: 8px; --radius-md: 14px; --radius-lg: 16px; --radius-pill: 9999px;

  --shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 1px 1px rgba(0,0,0,.04);
  --shadow-2: 0 4px 8px -2px rgba(0,0,0,.10);
  --shadow-3: 0 8px 24px -8px rgba(0,0,0,.18);
  --shadow-4: 0 16px 40px -12px rgba(0,0,0,.24);
  --shadow-5: 0 24px 60px -20px rgba(0,0,0,.30);

  --color-background: var(--bg); --color-foreground: var(--fg);
  --color-surface: var(--surface); --color-surface-dim: var(--surface-dim);
  --color-surface-variant: var(--surface-container-high);
  --color-surface-container: var(--surface-container);
  --color-surface-container-low: var(--surface-container-low);
  --color-surface-container-high: var(--surface-container-high);
  --color-surface-container-highest: var(--surface-container-highest);
  --color-card: var(--surface); --color-on-surface: var(--fg); --color-on-surface-variant: var(--muted);
  --color-muted-foreground: var(--muted); --color-primary: var(--accent); --color-primary-hover: var(--accent-hover);
  --color-on-primary: #ffffff; --color-primary-container: var(--aitutor-primary-50);
  --color-on-primary-container: var(--aitutor-primary-900);
  --color-secondary: var(--aitutor-blue-100); --color-secondary-container: var(--aitutor-blue-50);
  --color-on-secondary-container: var(--aitutor-blue-900);
  --color-outline: var(--rule); --color-outline-variant: var(--aitutor-blue-100); --color-border: var(--rule);
  --color-success: var(--aitutor-success-600); --color-warning: var(--aitutor-warning-600);
  --color-error: var(--aitutor-error-600); --color-info: var(--aitutor-info-600);
  --radius-full: 9999px; --type-display-sm: 40px; --type-heading-sm: 24px;
  --type-body-md: 16px; --type-body-sm: 14px; --font-family-base: var(--font-body);
}

.dark {
  --background: #0f1117; --foreground: #e8ecf1; --surface: #1a1d27; --surface-dim: #12141c;
  --surface-container-lowest: #0f1117; --surface-container-low: #1a1d27;
  --surface-container: #22252f; --surface-container-high: #2a2d38; --surface-container-highest: #33374a;
  --inverse-surface: #f1f5f9; --inverse-on-surface: #1a1a2e;
  --muted: #64748b; --muted-foreground: #94a3b8; --border: #2a2d38;
  --bg: var(--background); --fg: var(--foreground); --rule: var(--border); --card-bg: var(--surface);
  --color-background: var(--bg); --color-foreground: var(--fg); --color-surface: var(--surface);
  --color-surface-dim: var(--surface-dim); --color-surface-variant: var(--surface-container-high);
  --color-surface-container: var(--surface-container); --color-surface-container-low: var(--surface-container-low);
  --color-surface-container-high: var(--surface-container-high); --color-surface-container-highest: var(--surface-container-highest);
  --color-card: var(--surface); --color-on-surface: var(--fg); --color-on-surface-variant: var(--muted);
  --color-muted-foreground: var(--muted); --color-outline: var(--rule); --color-outline-variant: #2a2d38;
  --color-border: var(--rule);
}

.aitutor-display { font-family: var(--font-display); font-size: 3.5rem; font-weight: var(--font-weight-display); line-height: var(--line-height-display); letter-spacing: -0.02em; }
.aitutor-h1 { font-family: var(--font-heading); font-size: 2.5rem; font-weight: var(--font-weight-h1); line-height: var(--line-height-h1); }
.aitutor-h2 { font-family: var(--font-heading); font-size: 2rem; font-weight: var(--font-weight-h2); line-height: var(--line-height-h2); }
.aitutor-h3 { font-family: var(--font-heading); font-size: 1.5rem; font-weight: var(--font-weight-h3); line-height: var(--line-height-h3); }
.aitutor-h4 { font-family: var(--font-heading); font-size: 1.25rem; font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); }
.aitutor-body { font-family: var(--font-body); font-size: 1rem; font-weight: var(--font-weight-body); line-height: var(--line-height-body); }
.aitutor-lead { font-family: var(--font-body); font-size: 1.125rem; font-weight: var(--font-weight-lead); line-height: var(--line-height-lead); }
.aitutor-caption { font-family: var(--font-body); font-size: 0.75rem; font-weight: var(--font-weight-caption); line-height: var(--line-height-caption); }
.aitutor-eyebrow { font-family: var(--font-body); font-size: 0.6875rem; font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .navbar { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 var(--space-5); background: var(--color-surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--color-border); width: 100%; box-sizing: border-box; }
      .navbar-logo { font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h2); color: var(--color-on-surface); white-space: nowrap; text-decoration: none; }
      .navbar-links { display: flex; align-items: center; gap: var(--space-5); list-style: none; margin: 0; padding: 0; }
      .navbar-link { font-size: var(--font-size-body); font-weight: var(--font-weight-body); color: var(--color-on-surface-variant); text-decoration: none; white-space: nowrap; transition: filter .15s; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); }
      .navbar-link:hover { filter: brightness(1.2); }
      .navbar-link.active { color: var(--color-on-surface); font-weight: var(--font-weight-h4); }
      .navbar-hamburger { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: none; border: none; color: var(--color-on-surface-variant); cursor: pointer; border-radius: var(--radius-sm); transition: filter .15s; flex-shrink: 0; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); font-family: var(--font-body); font-weight: var(--font-weight-body); white-space: nowrap; cursor: pointer; border: none; border-radius: var(--radius-pill); transition: background .15s, border-color .15s, opacity .15s; flex-shrink: 0; }
      .btn.primary { background: var(--accent); color: var(--primary-foreground); }
      .btn.primary:hover { background: var(--accent-hover); }
      .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
      .btn.ghost:hover { background: var(--color-surface-container-low); }
      .btn.sm { height: var(--size-button-sm); padding: 0 var(--space-4); font-size: var(--font-size-caption); min-width: var(--size-button-sm); }
      .btn.md { height: var(--size-button-md); padding: 0 var(--space-5); font-size: var(--font-size-body); min-width: var(--size-button-md); }
      .card { background: var(--color-card); border: 1px solid var(--color-outline); border-radius: var(--radius-md); padding: var(--space-5); box-shadow: var(--shadow-1); }
      .tag { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--space-3); border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1; min-width: 24px; flex-shrink: 0; }
      .tag--default { background: var(--color-surface); border: 1px solid var(--color-outline); color: var(--color-on-surface); }
      .tag--primary { background: var(--aitutor-primary-50); color: var(--aitutor-primary-700); border: 1px solid var(--aitutor-primary-200); }
      .tag--success { background: var(--aitutor-success-50); color: var(--aitutor-success-700); border: 1px solid var(--aitutor-success-200); }
      .tag--warning { background: var(--aitutor-warning-50); color: var(--aitutor-warning-700); border: 1px solid var(--aitutor-warning-200); }
      .tag--error { background: var(--aitutor-error-50); color: var(--aitutor-error-700); border: 1px solid var(--aitutor-error-200); }
      .chart-container { width: 100%; height: 200px; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <nav class="navbar" style="position:sticky;top:0;z-index:50;">
      <div style="max-width:1280px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;">
        <a class="navbar-logo" href="home.html">AI Tutor</a>
        <ul class="navbar-links hidden md:flex">
          <li><a class="navbar-link" href="dashboard.html">学习驾驶舱</a></li>
          <li><a class="navbar-link" href="trends-analysis.html">考试趋势</a></li>
          <li><a class="navbar-link active" href="wrong-book.html">错题本</a></li>
          <li><a class="navbar-link" href="photo-search.html">拍照搜题</a></li>
        </ul>
        <div class="navbar-actions">
          <button class="navbar-hamburger" id="themeToggle" aria-label="切换主题">
            <i data-lucide="moon" style="width:20px;height:20px;"></i>
          </button>
        </div>
      </div>
    </nav>

    <main style="max-width:1280px;margin:0 auto;width:100%;padding:var(--space-6) var(--space-4);">
      <div style="margin-bottom:var(--space-6);">
        <h1 class="aitutor-h2" style="color:var(--color-on-surface);margin:0 0 var(--space-2);">错题本</h1>
        <p class="aitutor-body" style="color:var(--color-on-surface-variant);margin:0;">记录错题，分析错误原因，针对性复习</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-6);">
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);">总错题数</div>
              <div class="aitutor-h2" style="color:var(--color-on-surface);" id="totalCount">0</div>
            </div>
            <div style="width:48px;height:48px;border-radius:50%;background:var(--aitutor-primary-50);display:flex;align-items:center;justify-content:center;">
              <i data-lucide="book-x" style="width:24px;height:24px;color:var(--color-primary);"></i>
            </div>
          </div>
        </div>
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);">已复习</div>
              <div class="aitutor-h2" style="color:var(--color-success);" id="reviewedCount">0</div>
            </div>
            <div style="width:48px;height:48px;border-radius:50%;background:var(--aitutor-success-50);display:flex;align-items:center;justify-content:center;">
              <i data-lucide="check-circle" style="width:24px;height:24px;color:var(--color-success);"></i>
            </div>
          </div>
        </div>
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);">待复习</div>
              <div class="aitutor-h2" style="color:var(--color-warning);" id="unreviewedCount">0</div>
            </div>
            <div style="width:48px;height:48px;border-radius:50%;background:var(--aitutor-warning-50);display:flex;align-items:center;justify-content:center;">
              <i data-lucide="clock" style="width:24px;height:24px;color:var(--color-warning);"></i>
            </div>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:280px 1fr;gap:var(--space-6);">
        <div>
          <div class="card" style="position:sticky;top:80px;">
            <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0 0 var(--space-4);">筛选条件</h3>
            
            <div style="margin-bottom:var(--space-4);">
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-2);">学科</div>
              <select id="subjectFilter" class="input-field">
                <option value="">全部学科</option>
                <option value="math">数学</option>
                <option value="physics">物理</option>
                <option value="chemistry">化学</option>
                <option value="biology">生物</option>
                <option value="chinese">语文</option>
                <option value="english">英语</option>
                <option value="history">历史</option>
                <option value="geography">地理</option>
                <option value="politics">政治</option>
              </select>
            </div>

            <div style="margin-bottom:var(--space-4);">
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-2);">错误类型</div>
              <select id="categoryFilter" class="input-field">
                <option value="">全部类型</option>
                <option value="concept">概念不清</option>
                <option value="calculation">计算失误</option>
                <option value="comprehension">审题偏差</option>
                <option value="method">方法不当</option>
                <option value="careless">粗心大意</option>
              </select>
            </div>

            <div style="margin-bottom:var(--space-4);">
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-2);">复习状态</div>
              <select id="reviewedFilter" class="input-field">
                <option value="">全部状态</option>
                <option value="false">待复习</option>
                <option value="true">已复习</option>
              </select>
            </div>

            <div style="margin-bottom:var(--space-4);">
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-2);">学科错题分布</div>
              <div id="subjectChart" class="chart-container"></div>
            </div>

            <button class="btn ghost sm" id="exportBtn" style="width:100%;">
              <i data-lucide="download" style="width:16px;height:16px;"></i> 导出错题
            </button>
          </div>
        </div>

        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);">
            <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0;">错题列表</h3>
            <div style="display:flex;gap:var(--space-2);">
              <button class="btn ghost sm" id="clearReviewedBtn">
                <i data-lucide="trash-2" style="width:16px;height:16px;"></i> 清空已复习
              </button>
            </div>
          </div>

          <div id="questionList"></div>

          <div id="pagination" style="display:flex;align-items:center;justify-content:center;gap:var(--space-2);margin-top:var(--space-6);"></div>
        </div>
      </div>
    </main>

    <script>
    (function() {
      'use strict';

      var currentPage = 1;
      var pageSize = 10;
      var subjectChart;

      function initCharts() {
        subjectChart = echarts.init(document.getElementById('subjectChart'));
        window.addEventListener('resize', function() {
          subjectChart && subjectChart.resize();
        });
      }

      async function loadStats() {
        try {
          var response = await fetch('/api/user/wrong-questions/stats');
          var result = await response.json();

          if (result.success && result.data) {
            var stats = result.data.overall;
            document.getElementById('totalCount').textContent = stats.total_count || 0;
            document.getElementById('reviewedCount').textContent = stats.reviewed_count || 0;
            document.getElementById('unreviewedCount').textContent = stats.unreviewed_count || 0;

            renderSubjectChart(result.data.by_subject);
          }
        } catch (error) {
          console.error('Load stats error:', error);
        }
      }

      function renderSubjectChart(data) {
        if (!subjectChart) return;

        var names = data.map(function(d) {
          var map = { math: '数学', physics: '物理', chemistry: '化学', biology: '生物',
                      chinese: '语文', english: '英语', history: '历史', geography: '地理', politics: '政治' };
          return map[d.subject_code] || d.subject_code;
        });
        var counts = data.map(function(d) { return d.count; });

        subjectChart.setOption({
          tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
          grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
          xAxis: { type: 'value' },
          yAxis: { type: 'category', data: names },
          series: [{
            type: 'bar',
            data: counts,
            itemStyle: { borderRadius: [0, 4, 4, 0] }
          }]
        });
      }

      async function loadQuestions() {
        var subject = document.getElementById('subjectFilter').value;
        var category = document.getElementById('categoryFilter').value;
        var reviewed = document.getElementById('reviewedFilter').value;

        try {
          var url = `/api/user/wrong-questions?page=${currentPage}&page_size=${pageSize}`;
          if (subject) url += `&subject=${subject}`;
          if (category) url += `&error_category=${category}`;
          if (reviewed !== '') url += `&reviewed=${reviewed}`;

          var response = await fetch(url);
          var result = await response.json();

          if (result.success && result.data) {
            renderQuestionList(result.data.questions);
            renderPagination(result.data);
          }
        } catch (error) {
          console.error('Load questions error:', error);
        }
      }

      function renderQuestionList(questions) {
        var container = document.getElementById('questionList');

        if (questions.length === 0) {
          container.innerHTML = '<div class="card" style="text-align:center;padding:var(--space-8);"><i data-lucide="check-circle" style="width:64px;height:64px;color:var(--color-success);margin:0 auto var(--space-4);"></i><div style="font-size:var(--font-size-h4);font-weight:var(--font-weight-h4);color:var(--color-on-surface);">暂无错题</div><div style="font-size:var(--font-size-body);color:var(--color-on-surface-variant);">继续学习，错题会自动记录到这里</div></div>';
          lucide.createIcons();
          return;
        }

        container.innerHTML = questions.map(function(q) {
          var subjectMap = { math: '数学', physics: '物理', chemistry: '化学', biology: '生物',
                            chinese: '语文', english: '英语', history: '历史', geography: '地理', politics: '政治' };
          var categoryMap = { concept: '概念不清', calculation: '计算失误', comprehension: '审题偏差',
                            method: '方法不当', careless: '粗心大意', unknown: '其他' };
          var difficultyMap = { 1: '简单', 2: '较易', 3: '中等', 4: '较难', 5: '困难' };

          var errorTypes = q.error_types ? JSON.parse(q.error_types) : [];
          var typeTags = errorTypes.map(function(t) {
            return '<span class="tag tag--warning">' + t + '</span>';
          }).join('');

          return '<div class="card" style="margin-bottom:var(--space-4);"><div style="display:flex;align-items:start;gap:var(--space-4);"><div style="flex:1;"><div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2);"><span class="tag tag--primary">' + (subjectMap[q.subject_code] || q.subject_code) + '</span><span class="tag tag--default">' + difficultyMap[q.difficulty] + '</span><span class="tag tag--error">' + (categoryMap[q.error_category] || q.error_category) + '</span>' + (q.reviewed ? '<span class="tag tag--success">已复习</span>' : '<span class="tag tag--warning">待复习</span>') + '</div><div style="font-size:var(--font-size-body);color:var(--color-on-surface);line-height:var(--line-height-body);margin-bottom:var(--space-3);">' + q.content.substring(0, 200) + (q.content.length > 200 ? '...' : '') + '</div><div style="margin-bottom:var(--space-3);">' + typeTags + '</div><div style="font-size:var(--font-size-body);color:var(--color-on-surface);margin-bottom:var(--space-2);"><strong>正确答案：</strong><span style="color:var(--color-success);">' + (q.correct_answer || '暂无') + '</span></div><div style="font-size:var(--font-size-body);color:var(--color-on-surface-variant);line-height:var(--line-height-body);">' + (q.error_analysis || '暂无解析').substring(0, 150) + (q.error_analysis && q.error_analysis.length > 150 ? '...' : '') + '</div></div><div style="display:flex;flex-direction:column;gap:var(--space-2);"><button class="btn ghost sm" onclick="markReviewed(' + q.id + ')" title="标记已复习"><i data-lucide="check" style="width:16px;height:16px;"></i></button><button class="btn ghost sm" onclick="deleteQuestion(' + q.id + ')" title="删除"><i data-lucide="trash-2" style="width:16px;height:16px;"></i></button></div></div></div>';
        }).join('');

        lucide.createIcons();
      }

      function renderPagination(data) {
        var container = document.getElementById('pagination');
        var totalPages = Math.ceil(data.total / data.page_size);

        if (totalPages <= 1) {
          container.innerHTML = '';
          return;
        }

        var html = '';
        if (currentPage > 1) {
          html += '<button class="btn ghost sm" onclick="goToPage(' + (currentPage - 1) + ')">上一页</button>';
        }

        for (var i = 1; i <= totalPages; i++) {
          if (i === currentPage) {
            html += '<button class="btn primary sm" disabled>' + i + '</button>';
          } else {
            html += '<button class="btn ghost sm" onclick="goToPage(' + i + ')">' + i + '</button>';
          }
        }

        if (currentPage < totalPages) {
          html += '<button class="btn ghost sm" onclick="goToPage(' + (currentPage + 1) + ')">下一页</button>';
        }

        container.innerHTML = html;
      }

      window.markReviewed = async function(id) {
        try {
          var response = await fetch('/api/user/wrong-questions/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reviewed: true })
          });
          var result = await response.json();
          if (result.success) {
            loadQuestions();
            loadStats();
          }
        } catch (error) {
          console.error('Mark reviewed error:', error);
        }
      };

      window.deleteQuestion = async function(id) {
        if (!confirm('确定要删除这道错题吗？')) return;
        try {
          var response = await fetch('/api/user/wrong-questions/' + id, { method: 'DELETE' });
          var result = await response.json();
          if (result.success) {
            loadQuestions();
            loadStats();
          }
        } catch (error) {
          console.error('Delete question error:', error);
        }
      };

      window.goToPage = function(page) {
        currentPage = page;
        loadQuestions();
      };

      document.getElementById('subjectFilter').addEventListener('change', function() {
        currentPage = 1;
        loadQuestions();
      });

      document.getElementById('categoryFilter').addEventListener('change', function() {
        currentPage = 1;
        loadQuestions();
      });

      document.getElementById('reviewedFilter').addEventListener('change', function() {
        currentPage = 1;
        loadQuestions();
      });

      document.getElementById('exportBtn').addEventListener('click', async function() {
        var subject = document.getElementById('subjectFilter').value;
        var category = document.getElementById('categoryFilter').value;

        var url = '/api/user/wrong-questions/export';
        if (subject) url += `&subject=${subject}`;
        if (category) url += `&error_category=${category}`;

        try {
          var response = await fetch(url);
          var result = await response.json();

          if (result.success && result.data) {
            var blob = new Blob([JSON.stringify(result.data.questions, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'wrong_questions.json';
            a.click();
            URL.revokeObjectURL(url);
          }
        } catch (error) {
          console.error('Export error:', error);
        }
      });

      document.getElementById('clearReviewedBtn').addEventListener('click', async function() {
        if (!confirm('确定要清空所有已复习的错题吗？')) return;
        try {
          var response = await fetch('/api/user/wrong-questions?reviewed=true');
          var result = await response.json();

          if (result.success && result.data) {
            for (var q of result.data.questions) {
              await fetch('/api/user/wrong-questions/' + q.id, { method: 'DELETE' });
            }
            loadQuestions();
            loadStats();
          }
        } catch (error) {
          console.error('Clear reviewed error:', error);
        }
      });

      initCharts();
      loadStats();
      loadQuestions();

      var themeToggle = document.getElementById('themeToggle');
      function updateThemeIcon() {
        var isDark = document.documentElement.classList.contains('dark');
        var icon = themeToggle.querySelector('i');
        if (icon) {
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        }
      }
      themeToggle.addEventListener('click', function() {
        var html = document.documentElement;
        if (html.classList.contains('dark')) {
          html.classList.remove('dark');
          html.classList.add('light');
          localStorage.setItem('aitutor-theme', 'light');
        } else {
          html.classList.remove('light');
          html.classList.add('dark');
          localStorage.setItem('aitutor-theme', 'dark');
        }
        updateThemeIcon();
        setTimeout(function() { subjectChart && subjectChart.resize(); }, 100);
      });
      (function() {
        var saved = localStorage.getItem('aitutor-theme');
        if (saved) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(saved);
        }
        updateThemeIcon();
      })();

    })();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
