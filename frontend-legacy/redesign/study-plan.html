  --aitutor-blue-500: #2563eb;
  --aitutor-blue-600: #1d4ed8;
  --aitutor-blue-700: #1e40af;

  --aitutor-success-600: #047857;
  --aitutor-warning-50: #fffbeb;
  --aitutor-warning-100: #fef3c7;
  --aitutor-warning-200: #fde68a;
  --aitutor-warning-300: #fcd34d;
  --aitutor-warning-400: #fbbf24;
  --aitutor-warning-500: #f59e0b;
  --aitutor-error-50: #fef2f2;
  --aitutor-error-100: #fee2e2;
  --aitutor-error-200: #fecaca;
  --aitutor-error-300: #fca5a5;
  --aitutor-error-400: #f87171;
  --aitutor-error-500: #ef4444;
  --aitutor-error-600: #dc2626;

  --primary: var(--aitutor-primary-500); --primary-hover: var(--aitutor-primary-600); --primary-foreground: #ffffff;
  --secondary: var(--aitutor-blue-500); --secondary-hover: var(--aitutor-blue-600); --secondary-foreground: #ffffff;
  --accent: var(--aitutor-primary-500); --accent-hover: var(--aitutor-primary-600); --accent-foreground: #ffffff;
  --background: #f8f9fa; --foreground: #1a1a2e; --muted: #94a3b8; --muted-foreground: #64748b;
  --border: #e2e8f0; --ring: var(--aitutor-primary-500);
  --error: var(--aitutor-error-600); --error-foreground: #ffffff; --success: var(--aitutor-success-600); --warning: var(--aitutor-warning-600);
  --surface: #ffffff; --surface-dim: #f1f5f9; --surface-container-lowest: #f8f9fa;
  --surface-container-low: #f1f5f9; --surface-container: #e8ecf1; --surface-container-high: #dfe4ea; --surface-container-highest: #d5dae1;
  --inverse-surface: #1a1a2e; --inverse-on-surface: #f1f5f9;
  --bg: var(--background); --fg: var(--foreground); --rule: var(--border); --link: var(--aitutor-blue-600); --card-bg: var(--surface);

  --font-display: 'DM Sans', 'Noto Sans SC', sans-serif; --font-heading: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', 'DM Sans', sans-serif; --font-mono: 'DM Sans', monospace;
  --font-size-display: 56px; --font-size-h1: 40px; --font-size-h2: 32px; --font-size-h3: 24px;
  --font-size-h4: 20px; --font-size-body: 16px; --font-size-lead: 18px; --font-size-caption: 12px;

  --font-weight-h4: 600; --font-weight-body: 400; --font-weight-lead: 400; --font-weight-caption: 400;
  --font-weight-eyebrow: 600; --font-weight-mono: 400;

  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;

  --size-button-sm: 32px; --size-button-md: 40px; --size-button-lg: 48px;
  --size-input-height: 40px; --size-icon-sm: 16px; --size-icon-md: 24px; --size-icon-lg: 32px;

  --radius-sm: 8px; --radius-md: 14px; --radius-lg: 16px; --radius-pill: 9999px;

  --color-surface-container-low: var(--surface-container-low);
  --color-surface-container-high: var(--surface-container-high);
  --color-surface-container-highest: var(--surface-container-highest);
  --color-card: var(--surface); --color-on-surface: var(--fg); --color-on-surface-variant: var(--muted);
  --color-muted-foreground: var(--muted); --color-primary: var(--accent); --color-primary-hover: var(--accent-hover);
  --color-on-primary: #ffffff; --color-primary-container: var(--aitutor-primary-50);
  --color-on-primary-container: var(--aitutor-primary-900);
  --color-secondary: var(--aitutor-blue-100); --color-secondary-container: var(--aitutor-blue-50);
  --color-on-secondary-container: var(--aitutor-blue-900);
  --color-outline: var(--rule); --color-outline-variant: var(--aitutor-blue-100); --color-border: var(--rule);
  --color-success: var(--aitutor-success-600); --color-warning: var(--aitutor-warning-600);
  --color-error: var(--aitutor-error-600); --color-info: var(--aitutor-info-600);
  --radius-full: 9999px; --type-display-sm: 40px; --type-heading-sm: 24px;

.dark {

  --surface-container-lowest: #0f1117; --surface-container-low: #1a1d27;
  --surface-container: #22252f; --surface-container-high: #2a2d38; --surface-container-highest: #33374a;
  --inverse-surface: #f1f5f9; --inverse-on-surface: #1a1a2e;
  --muted: #64748b; --muted-foreground: #94a3b8; --border: #2a2d38;
  --bg: var(--background); --fg: var(--foreground); --rule: var(--border); --card-bg: var(--surface);
  --color-background: var(--bg); --color-foreground: var(--fg); --color-surface: var(--surface);
  --color-surface-dim: var(--surface-dim); --color-surface-variant: var(--surface-container-high);
  --color-surface-container: var(--surface-container); --color-surface-container-low: var(--surface-container-low);
  --color-surface-container-high: var(--surface-container-high); --color-surface-container-highest: var(--surface-container-highest);
  --color-card: var(--surface); --color-on-surface: var(--fg); --color-on-surface-variant: var(--muted);
  --color-muted-foreground: var(--muted); --color-outline: var(--rule); --color-outline-variant: #2a2d38;

}

.aitutor-display { font-family: var(--font-display); font-size: 3.5rem; font-weight: var(--font-weight-display); line-height: var(--line-height-display); letter-spacing: -0.02em; }

.aitutor-h2 { font-family: var(--font-heading); font-size: 2rem; font-weight: var(--font-weight-h2); line-height: var(--line-height-h2); }
.aitutor-h3 { font-family: var(--font-heading); font-size: 1.5rem; font-weight: var(--font-weight-h3); line-height: var(--line-height-h3); }
.aitutor-h4 { font-family: var(--font-heading); font-size: 1.25rem; font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); }
.aitutor-body { font-family: var(--font-body); font-size: 1rem; font-weight: var(--font-weight-body); line-height: var(--line-height-body); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }

      .navbar-logo { font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h2); color: var(--color-on-surface); white-space: nowrap; text-decoration: none; }
      .navbar-links { display: flex; align-items: center; gap: var(--space-5); list-style: none; margin: 0; padding: 0; }
      .navbar-link { font-size: var(--font-size-body); font-weight: var(--font-weight-body); color: var(--color-on-surface-variant); text-decoration: none; white-space: nowrap; transition: filter .15s; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); }
      .navbar-link:hover { filter: brightness(1.2); }
      .navbar-link.active { color: var(--color-on-surface); font-weight: var(--font-weight-h4); }

      .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); font-family: var(--font-body); font-weight: var(--font-weight-body); white-space: nowrap; cursor: pointer; border: none; border-radius: var(--radius-pill); transition: background .15s, border-color .15s, opacity .15s; flex-shrink: 0; }
      .btn.primary { background: var(--accent); color: var(--primary-foreground); }

      .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
      .btn.ghost:hover { background: var(--color-surface-container-low); }
      .btn.sm { height: var(--size-button-sm); padding: 0 var(--space-4); font-size: var(--font-size-caption); min-width: var(--size-button-sm); }
      .btn.md { height: var(--size-button-md); padding: 0 var(--space-5); font-size: var(--font-size-body); min-width: var(--size-button-md); }
      .btn.lg { height: var(--size-button-lg); padding: 0 var(--space-6); font-size: var(--font-size-body); min-width: var(--size-button-lg); }
      .card { background: var(--color-card); border: 1px solid var(--color-outline); border-radius: var(--radius-md); padding: var(--space-5); box-shadow: var(--shadow-1); }
      .tag { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--space-3); border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1; min-width: 24px; flex-shrink: 0; }
      .tag--default { background: var(--color-surface); border: 1px solid var(--color-outline); color: var(--color-on-surface); }
      .tag--primary { background: var(--aitutor-primary-50); color: var(--aitutor-primary-700); border: 1px solid var(--aitutor-primary-200); }
      .tag--success { background: var(--aitutor-success-50); color: var(--aitutor-success-700); border: 1px solid var(--aitutor-success-200); }
      .tag--warning { background: var(--aitutor-warning-50); color: var(--aitutor-warning-700); border: 1px solid var(--aitutor-warning-200); }
      .tag--info { background: var(--aitutor-info-50); color: var(--aitutor-info-700); border: 1px solid var(--aitutor-info-200); }
      .chart-container { width: 100%; height: 200px; }
      .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
      .loading-spinner { width: 64px; height: 64px; border: 4px solid var(--color-border); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

    <main style="max-width:1280px;margin:0 auto;width:100%;padding:var(--space-6) var(--space-4);">
      <div style="margin-bottom:var(--space-6);">
        <h1 class="aitutor-h2" style="color:var(--color-on-surface);margin:0 0 var(--space-2);">学习计划</h1>
        <p class="aitutor-body" style="color:var(--color-on-surface-variant);margin:0;">根据知识掌握情况，智能生成个性化学习计划和模拟试卷</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);margin-bottom:var(--space-6);">
        <div class="card">
          <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0 0 var(--space-4);">生成学习计划</h3>
          <div style="display:flex;flex-wrap:wrap;gap:var(--space-4);">
            <div style="flex:1;min-width:200px;">
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-1);">学科</div>
              <select id="planSubject" class="input-field">
                <option value="math">数学</option>
                <option value="physics">物理</option>
                <option value="chemistry">化学</option>
                <option value="biology">生物</option>
                <option value="chinese">语文</option>
                <option value="english">英语</option>
                <option value="history">历史</option>
                <option value="geography">地理</option>
                <option value="politics">政治</option>
              </select>
            </div>
            <div style="flex:1;min-width:200px;">
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-1);">目标分数</div>
              <input type="number" id="targetScore" placeholder="如：90" class="input-field" value="90">
            </div>
          </div>
          <div style="margin-top:var(--space-4);">
            <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-1);">每日学习时间（小时）</div>
            <input type="number" id="studyHours" placeholder="如：2" class="input-field" value="2">
          </div>
          <button class="btn primary lg" style="width:100%;margin-top:var(--space-5);" id="generatePlanBtn">
            <i data-lucide="calendar-plus" style="width:20px;height:20px;"></i> 生成学习计划
          </button>
        </div>

        <div class="card">
          <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0 0 var(--space-4);">生成模拟试卷</h3>
          <div style="display:flex;flex-wrap:wrap;gap:var(--space-4);">
            <div style="flex:1;min-width:200px;">
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-1);">学科</div>
              <select id="examSubject" class="input-field">
                <option value="math">数学</option>
                <option value="physics">物理</option>
                <option value="chemistry">化学</option>
                <option value="biology">生物</option>
                <option value="chinese">语文</option>
                <option value="english">英语</option>
                <option value="history">历史</option>
                <option value="geography">地理</option>
                <option value="politics">政治</option>
              </select>
            </div>
            <div style="flex:1;min-width:200px;">
              <div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-1);">题目数量</div>
              <input type="number" id="questionCount" placeholder="如：10" class="input-field" value="10">
            </div>
          </div>
          <button class="btn primary lg" style="width:100%;margin-top:var(--space-5);" id="generateExamBtn">
            <i data-lucide="file-text" style="width:20px;height:20px;"></i> 生成模拟试卷
          </button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);margin-bottom:var(--space-6);">
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);">
            <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0;">今日任务</h3>
            <button class="btn ghost sm" id="refreshTasksBtn">
              <i data-lucide="refresh-cw" style="width:16px;height:16px;"></i> 刷新
            </button>
          </div>
          <div id="dailyTasksList"></div>
        </div>

        <div class="card">
          <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0 0 var(--space-4);">学习计划列表</h3>
          <div id="plansList"></div>
        </div>
      </div>

      <div class="card" id="planDetailCard" style="display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);">
          <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0;" id="planDetailTitle">学习计划详情</h3>
          <button class="btn ghost sm" id="closePlanDetailBtn">
            <i data-lucide="x" style="width:16px;height:16px;"></i>
          </button>
        </div>
        <div id="planDetailContent"></div>
      </div>

      <div class="card" id="examResultCard" style="display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);">
          <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0;" id="examResultTitle">模拟试卷</h3>
          <button class="btn ghost sm" id="closeExamResultBtn">
            <i data-lucide="x" style="width:16px;height:16px;"></i>
          </button>
        </div>
        <div id="examResultContent"></div>
      </div>

    <div class="loading-overlay" id="loadingOverlay" style="display:none;">
      <div style="text-align:center;">
        <div class="loading-spinner"></div>
        <div style="margin-top:var(--space-4);font-size:var(--font-size-body);color:#ffffff;" id="loadingText">正在生成...</div>
      </div>
    </div>

    <script>
    (function() {
      'use strict';

      var currentPlanDetail = null;
      var currentExamResult = null;

      var subjectMap = {
        math: '数学', physics: '物理', chemistry: '化学', biology: '生物',
        chinese: '语文', english: '英语', history: '历史', geography: '地理', politics: '政治'
      };

      async function loadDailyTasks() {
        try {
          var response = await fetch('/api/user/study-plan/daily-tasks');
          var result = await response.json();

          if (result.success && result.data) {
            renderDailyTasks(result.data.tasks);
          }
        } catch (error) {
          console.error('Load daily tasks error:', error);
        }
      }

      async function loadPlans() {
        try {
          var response = await fetch('/api/user/study-plan/plans');
          var result = await response.json();

          if (result.success && result.data) {
            renderPlans(result.data.plans);
          }
        } catch (error) {
          console.error('Load plans error:', error);
        }
      }

      function renderDailyTasks(tasks) {
        var container = document.getElementById('dailyTasksList');

        if (!tasks || tasks.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:var(--space-4);"><i data-lucide="coffee" style="width:48px;height:48px;color:var(--color-on-surface-variant);margin:0 auto var(--space-2);"></i><div style="font-size:var(--font-size-body);color:var(--color-on-surface-variant);">今日暂无任务</div></div>';
          lucide.createIcons();
          return;
        }

        container.innerHTML = tasks.map(function(t) {
          var typeColor = t.type === 'review' ? '#2563eb' : t.type === 'practice' ? '#059669' : '#f59e0b';
          var typeLabel = t.type === 'review' ? '复习' : t.type === 'practice' ? '练习' : '总结';
          var priorityColor = t.priority === 'high' ? '#ef4444' : t.priority === 'medium' ? '#f59e0b' : '#059669';

          return '<div style="display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3);background:var(--color-surface-container-low);border-radius:var(--radius-md);margin-bottom:var(--space-2);"><div style="width:24px;height:24px;border-radius:50%;border:2px solid ' + priorityColor + ';display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="toggleTask(' + t.id + ',' + !t.completed + ')">' + (t.completed ? '<i data-lucide="check" style="width:16px;height:16px;color:' + priorityColor + ';"></i>' : '') + '</div><div style="flex:1;"><div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-1);"><span class="tag" style="background:' + typeColor + '20;color:' + typeColor + ';border-color:' + typeColor + '40;">' + typeLabel + '</span><span class="tag tag--default">' + (subjectMap[t.subject_code] || t.subject_code) + '</span></div><div style="font-size:var(--font-size-body);color:' + (t.completed ? 'var(--color-on-surface-variant)' : 'var(--color-on-surface)') + ';text-decoration:' + (t.completed ? 'line-through' : 'none') + ';">' + t.content + '</div></div><div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);">' + t.duration + '分钟</div></div>';
        }).join('');

        lucide.createIcons();
      }

      function renderPlans(plans) {
        var container = document.getElementById('plansList');

        if (!plans || plans.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:var(--space-4);"><i data-lucide="calendar" style="width:48px;height:48px;color:var(--color-on-surface-variant);margin:0 auto var(--space-2);"></i><div style="font-size:var(--font-size-body);color:var(--color-on-surface-variant);">暂无学习计划</div></div>';
          lucide.createIcons();
          return;
        }

        container.innerHTML = plans.map(function(p) {
          var progress = p.total_tasks > 0 ? Math.round((p.completed_tasks / p.total_tasks) * 100) : 0;
          var statusColor = p.status === 'active' ? '#2563eb' : p.status === 'completed' ? '#059669' : '#6b7280';
          var statusLabel = p.status === 'active' ? '进行中' : p.status === 'completed' ? '已完成' : '已暂停';

          return '<div style="padding:var(--space-3);background:var(--color-surface-container-low);border-radius:var(--radius-md);margin-bottom:var(--space-2);cursor:pointer;transition:background .15s;" onclick="showPlanDetail(' + p.id + ')"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2);"><div><div style="font-size:var(--font-size-body);font-weight:600;color:var(--color-on-surface);">' + p.plan_title + '</div><div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);">' + (subjectMap[p.subject_code] || p.subject_code) + ' · ' + p.duration + '</div></div><span class="tag" style="background:' + statusColor + '20;color:' + statusColor + ';border-color:' + statusColor + '40;">' + statusLabel + '</span></div><div style="width:100%;height:6px;border-radius:var(--radius-pill);overflow:hidden;background:var(--color-surface-container);"><div style="width:' + progress + '%;height:100%;border-radius:var(--radius-pill);background:var(--color-primary);"></div></div><div style="display:flex;justify-content:space-between;margin-top:var(--space-2);"><span style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);">进度 ' + p.completed_tasks + '/' + p.total_tasks + '</span><span style="font-size:var(--font-size-caption);color:var(--color-primary);">' + progress + '%</span></div></div>';
        }).join('');

        lucide.createIcons();
      }

      window.toggleTask = async function(id, completed) {
        try {
          var response = await fetch('/api/user/study-plan/tasks/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ completed: completed })
          });
          var result = await response.json();
          if (result.success) {
            loadDailyTasks();
          }
        } catch (error) {
          console.error('Toggle task error:', error);
        }
      };

      window.showPlanDetail = async function(id) {
        try {
          var response = await fetch('/api/user/study-plan/plans');
          var result = await response.json();

          if (result.success && result.data) {
            var plan = result.data.plans.find(function(p) { return p.id === id; });
            if (plan) {
              currentPlanDetail = plan;
              renderPlanDetail(plan);
              document.getElementById('planDetailCard').style.display = 'block';
            }
          }
        } catch (error) {
          console.error('Show plan detail error:', error);
        }
      };

      function renderPlanDetail(plan) {
        document.getElementById('planDetailTitle').textContent = plan.plan_title;
        var container = document.getElementById('planDetailContent');

        var planData = plan.plan_data || {};
        var dailyTasks = planData.daily_tasks || [];

        var html = '<div style="display:flex;flex-wrap:wrap;gap:var(--space-4);margin-bottom:var(--space-5);">';
        html += '<span class="tag tag--primary">' + (subjectMap[plan.subject_code] || plan.subject_code) + '</span>';
        html += '<span class="tag tag--default">' + plan.duration + '</span>';
        html += '<span class="tag tag--success">' + (planData.total_hours || '未知') + '小时</span>';
        html += '</div>';

        if (planData.expected_outcome) {
          html += '<div style="margin-bottom:var(--space-5);padding:var(--space-4);background:var(--color-primary-container);border-radius:var(--radius-md);"><div style="font-size:var(--font-size-body);color:var(--color-on-primary-container);"><strong>预期效果：</strong>' + planData.expected_outcome + '</div></div>';
        }

        if (planData.key_concepts && planData.key_concepts.length > 0) {
          html += '<div style="margin-bottom:var(--space-5);"><div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-2);">核心概念</div><div style="display:flex;flex-wrap:wrap;gap:var(--space-2);">';
          planData.key_concepts.forEach(function(c) {
            html += '<span class="tag tag--info">' + c + '</span>';
          });
          html += '</div></div>';
        }

        if (dailyTasks.length > 0) {
          html += '<div><div style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);margin-bottom:var(--space-2);">每日任务安排</div>';
          dailyTasks.forEach(function(day) {
            html += '<div style="margin-bottom:var(--space-4);"><div style="font-size:var(--font-size-h4);font-weight:600;color:var(--color-on-surface);margin-bottom:var(--space-3);">第' + day.day + '天 · ' + day.focus_knowledge_point + '</div>';
            if (day.tasks && day.tasks.length > 0) {
              html += '<ul style="margin:0;padding-left:var(--space-5);">';
              day.tasks.forEach(function(task) {
                var typeColor = task.type === 'review' ? '#2563eb' : task.type === 'practice' ? '#059669' : '#f59e0b';
                var typeLabel = task.type === 'review' ? '复习' : task.type === 'practice' ? '练习' : '总结';
                html += '<li style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2);"><span class="tag" style="background:' + typeColor + '20;color:' + typeColor + ';border-color:' + typeColor + '40;">' + typeLabel + '</span><span style="font-size:var(--font-size-body);color:var(--color-on-surface);">' + task.content + '</span><span style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);">' + task.duration + '分钟</span></li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        }

        container.innerHTML = html;
        lucide.createIcons();
      }

      document.getElementById('generatePlanBtn').addEventListener('click', async function() {
        var subject = document.getElementById('planSubject').value;
        var targetScore = document.getElementById('targetScore').value;
        var studyHours = document.getElementById('studyHours').value;

        document.getElementById('loadingText').textContent = '正在生成学习计划...';
        document.getElementById('loadingOverlay').style.display = 'flex';

        try {
          var response = await fetch('/api/user/study-plan/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              subject_code: subject,
              target_score: parseInt(targetScore),
              study_hours_per_day: parseInt(studyHours)
            })
          });

          var result = await response.json();

          if (result.success && result.data) {
            alert('学习计划生成成功！');
            loadPlans();
          } else {
            alert(result.message || '生成失败');
          }
        } catch (error) {
          console.error('Generate plan error:', error);
          alert('生成失败，请重试');
        } finally {
          document.getElementById('loadingOverlay').style.display = 'none';
        }
      });

      document.getElementById('generateExamBtn').addEventListener('click', async function() {
        var subject = document.getElementById('examSubject').value;
        var questionCount = document.getElementById('questionCount').value;

        document.getElementById('loadingText').textContent = '正在生成模拟试卷...';
        document.getElementById('loadingOverlay').style.display = 'flex';

        try {
          var response = await fetch('/api/user/study-plan/mock-exam', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              subject_code: subject,
              question_count: parseInt(questionCount)
            })
          });

          var result = await response.json();

          if (result.success && result.data) {
            currentExamResult = result.data;
            renderExamResult(result.data);
            document.getElementById('examResultCard').style.display = 'block';
          } else {
            alert(result.message || '生成失败');
          }
        } catch (error) {
          console.error('Generate exam error:', error);
          alert('生成失败，请重试');
        } finally {
          document.getElementById('loadingOverlay').style.display = 'none';
        }
      });

      function renderExamResult(exam) {
        document.getElementById('examResultTitle').textContent = exam.exam_title;
        var container = document.getElementById('examResultContent');

        var html = '<div style="display:flex;flex-wrap:wrap;gap:var(--space-4);margin-bottom:var(--space-5);">';
        html += '<span class="tag tag--primary">' + exam.subject + '</span>';
        html += '<span class="tag tag--default">' + exam.total_questions + '道题</span>';
        html += '<span class="tag tag--success">满分' + exam.total_score + '分</span>';
        html += '</div>';

        if (exam.questions && exam.questions.length > 0) {
          html += '<div style="border-top:1px solid var(--color-border);padding-top:var(--space-5);">';
          exam.questions.forEach(function(q, index) {
            html += '<div style="margin-bottom:var(--space-5);padding:var(--space-4);background:var(--color-surface-container-low);border-radius:var(--radius-md);"><div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3);"><span style="font-size:var(--font-size-h4);font-weight:600;color:var(--color-primary);">' + (index + 1) + '</span><span class="tag tag--default">' + q.type + '</span><span class="tag tag--info">' + q.knowledge_point + '</span><span class="tag tag--warning">难度' + q.difficulty + '</span><span class="tag tag--success">' + q.score + '分</span></div><div style="font-size:var(--font-size-body);color:var(--color-on-surface);line-height:var(--line-height-body);margin-bottom:var(--space-3);">' + q.content + '</div>';
            if (q.options && q.options.length > 0) {
              html += '<div style="margin-bottom:var(--space-3);">';
              q.options.forEach(function(opt, optIndex) {
                html += '<div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-1);"><span style="width:24px;height:24px;border-radius:50%;background:var(--color-surface);border:1px solid var(--color-border);display:flex;align-items:center;justify-content:center;font-size:var(--font-size-caption);color:var(--color-on-surface-variant);">' + ['A', 'B', 'C', 'D'][optIndex] + '</span><span style="font-size:var(--font-size-body);color:var(--color-on-surface);">' + opt + '</span></div>';
              });
              html += '</div>';
            }
            html += '<div style="border-top:1px dashed var(--color-border);padding-top:var(--space-3);"><div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2);"><span style="font-size:var(--font-size-caption);color:var(--color-on-surface-variant);">答案：</span><span style="font-size:var(--font-size-body);font-weight:600;color:var(--color-success);">' + q.answer + '</span></div><div style="font-size:var(--font-size-body);color:var(--color-on-surface-variant);line-height:var(--line-height-body);"><strong>解析：</strong>' + q.analysis + '</div></div></div>';
          });
          html += '</div>';
        }

        container.innerHTML = html;
        lucide.createIcons();
      }

      document.getElementById('closePlanDetailBtn').addEventListener('click', function() {
        document.getElementById('planDetailCard').style.display = 'none';
      });

      document.getElementById('closeExamResultBtn').addEventListener('click', function() {
        document.getElementById('examResultCard').style.display = 'none';
      });

      document.getElementById('refreshTasksBtn').addEventListener('click', function() {
        loadDailyTasks();
      });

      loadDailyTasks();
      loadPlans();

      var themeToggle = document.getElementById('themeToggle');
      function updateThemeIcon() {
        var isDark = document.documentElement.classList.contains('dark');
        var icon = themeToggle.querySelector('i');
        if (icon) {
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        }
      }
      themeToggle.addEventListener('click', function() {
        var html = document.documentElement;
        if (html.classList.contains('dark')) {
          html.classList.remove('dark');
          html.classList.add('light');
          localStorage.setItem('aitutor-theme', 'light');
        } else {
          html.classList.remove('light');
          html.classList.add('dark');
          localStorage.setItem('aitutor-theme', 'dark');
        }
        updateThemeIcon();
      });
      (function() {
        var saved = localStorage.getItem('aitutor-theme');
        if (saved) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(saved);
        }
        updateThemeIcon();
      })();

    })();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
