    <main style="max-width:1280px;margin:0 auto;width:100%;padding:var(--space-6) var(--space-4);">

        <p class="aitutor-body" style="color:var(--color-on-surface-variant);margin:0;">分析近3-5年考试命题趋势，掌握考试方向</p>
      </div>

      <div class="card" style="margin-bottom:var(--space-6);">
        <div style="display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center;">
          <div style="flex:1;min-width:200px;">

          </div>

              <option value="jiangsu">江苏</option>

              <option value="henan">河南</option>

          </div>

              <option value="math">数学</option>
              <option value="chinese">语文</option>
              <option value="english">英语</option>
              <option value="physics">物理</option>
              <option value="chemistry">化学</option>
              <option value="biology">生物</option>
              <option value="history">历史</option>

              <option value="politics">政治</option>

            <button class="btn primary md" id="searchBtn">查询</button>
          </div>
        </div>

      <div id="summary-card" class="card" style="margin-bottom:var(--space-6);display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);">
          <h2 class="aitutor-h3" style="color:var(--color-on-surface);margin:0;" id="summary-title">趋势分析</h2>
          <div style="display:flex;gap:var(--space-2);" id="summary-tags"></div>
        </div>

          <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0 0 var(--space-4);">题型占比</h3>

      <div class="card">
        <h3 class="aitutor-h4" style="color:var(--color-on-surface);margin:0 0 var(--space-4);">专家点评</h3>

    <script>
    (function() {
      'use strict';

      var typeTrendChart, difficultyChart, knowledgeChart, typePieChart;

      function initCharts() {
        typeTrendChart = echarts.init(document.getElementById('typeTrendChart'));
        difficultyChart = echarts.init(document.getElementById('difficultyChart'));
        knowledgeChart = echarts.init(document.getElementById('knowledgeChart'));
        typePieChart = echarts.init(document.getElementById('typePieChart'));

        window.addEventListener('resize', function() {
          typeTrendChart.resize();
          difficultyChart.resize();
          knowledgeChart.resize();
          typePieChart.resize();
        });
      }

      async function fetchTrends() {
        var examLevel = document.getElementById('examLevel').value;
        var province = document.getElementById('province').value;
        var subject = document.getElementById('subject').value;

        var btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.textContent = '查询中...';

        try {
          var response = await fetch(`/api/trends/province/${province}?subject=${subject}&exam_level=${examLevel}&years=5`);
          var result = await response.json();

          if (result.success && result.data) {
            renderSummary(result.data);
            renderCharts(result.data);
            await fetchExpertSummary(province, subject, examLevel);
          }
        } catch (error) {
          console.error('Fetch trends error:', error);
        } finally {
          btn.disabled = false;
          btn.textContent = '查询';
        }
      }

      function renderSummary(data) {
        var card = document.getElementById('summary-card');
        card.style.display = 'block';

        document.getElementById('summary-title').textContent = data.summary?.title || '趋势分析';
        document.getElementById('summary-overview').textContent = data.summary?.overview || '';

        var tagsContainer = document.getElementById('summary-tags');
        tagsContainer.innerHTML = '';
        (data.summary?.tags || []).forEach(function(tag) {
          var span = document.createElement('span');
          span.className = 'tag tag--default';
          span.textContent = tag;
          tagsContainer.appendChild(span);
        });

        var findingsContainer = document.getElementById('summary-findings');
        findingsContainer.innerHTML = '';
        (data.summary?.highlights || []).forEach(function(finding) {
          var div = document.createElement('div');
          div.style.padding = 'var(--space-3)';
          div.style.background = 'var(--color-surface-container-low)';
          div.style.borderRadius = 'var(--radius-sm)';
          div.style.fontSize = 'var(--font-size-body)';
          div.style.color = 'var(--color-on-surface)';
          div.innerHTML = '<i data-lucide="check-circle" style="width:16px;height:16px;margin-right:var(--space-2);color:var(--color-success);"></i>' + finding;
          findingsContainer.appendChild(div);
        });

        lucide.createIcons();
      }

      function renderCharts(data) {
        renderTypeTrendChart(data.question_types_by_year);
        renderDifficultyChart(data.difficulty_distribution_by_year);
        renderKnowledgeChart(data.top_knowledge_points);
        renderTypePieChart(data.question_types);
      }

      function renderTypeTrendChart(typeByYear) {
        var years = Object.keys(typeByYear).sort();
        var types = [...new Set(Object.values(typeByYear).flat().map(t => t.question_type))];

        var series = types.map(function(type) {
          return {
            name: type,
            type: 'line',
            smooth: true,
            data: years.map(function(year) {
              var yearData = typeByYear[year];
              var found = yearData && yearData.find(function(t) { return t.question_type === type; });
              return found ? found.count : 0;
            })
          };
        });

        typeTrendChart.setOption({
          tooltip: { trigger: 'axis' },
          legend: { data: types, bottom: 0 },
          grid: { left: '3%', right: '4%', bottom: '15%', top: '10%', containLabel: true },
          xAxis: { type: 'category', data: years },
          yAxis: { type: 'value' },
          series: series
        });
      }

      function renderDifficultyChart(diffByYear) {
        var years = Object.keys(diffByYear).sort();
        var diffLevels = [1, 2, 3, 4, 5];

        var series = diffLevels.map(function(level) {
          return {
            name: '难度' + level,
            type: 'line',
            smooth: true,
            data: years.map(function(year) {
              var yearData = diffByYear[year];
              var found = yearData && yearData.find(function(d) { return d.difficulty === level; });
              return found ? found.count : 0;
            })
          };
        });

        difficultyChart.setOption({
          tooltip: { trigger: 'axis' },
          legend: { data: diffLevels.map(function(l) { return '难度' + l; }), bottom: 0 },
          grid: { left: '3%', right: '4%', bottom: '15%', top: '10%', containLabel: true },
          xAxis: { type: 'category', data: years },
          yAxis: { type: 'value' },
          series: series
        });
      }

      function renderKnowledgeChart(points) {
        var names = points.slice(0, 10).map(function(p) { return p.knowledge_point_name || '未知'; });
        var frequencies = points.slice(0, 10).map(function(p) { return p.total_frequency || p.frequency || 0; });

        knowledgeChart.setOption({
          tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
          grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
          xAxis: { type: 'category', data: names, axisLabel: { rotate: 30 } },
          yAxis: { type: 'value' },
          series: [{
            type: 'bar',
            data: frequencies,
            itemStyle: { borderRadius: [4, 4, 0, 0] }
          }]
        });
      }

      function renderTypePieChart(types) {
        var data = types.slice(0, 8).map(function(t) {
          return {
            value: t.count,
            name: t.question_type
          };
        });

        typePieChart.setOption({
          tooltip: { trigger: 'item' },
          legend: { bottom: 0, orient: 'horizontal' },
          series: [{
            type: 'pie',
            radius: ['40%', '70%'],
            avoidLabelOverlap: false,
            itemStyle: { borderRadius: 8, borderColor: 'var(--color-surface)', borderWidth: 2 },
            label: { show: false },
            emphasis: { label: { show: true, fontSize: 14, fontWeight: 'bold' } },
            labelLine: { show: false },
            data: data
          }]
        });
      }

      async function fetchExpertSummary(province, subject, examLevel) {
        try {
          var response = await fetch(`/api/trends/expert-summary?province=${province}&subject=${subject}&exam_level=${examLevel}`);
          var result = await response.json();

          if (result.success && result.data) {
            renderExpertComments(result.data);
          }
        } catch (error) {
          console.error('Fetch expert summary error:', error);
        }
      }

      function renderExpertComments(data) {
        var container = document.getElementById('expert-comments');
        container.innerHTML = '';

        (data.expert_comments || []).forEach(function(comment) {
          var card = document.createElement('div');
          card.style.display = 'flex';
          card.style.gap = 'var(--space-4)';
          card.style.padding = 'var(--space-4)';
          card.style.background = 'var(--color-surface-container-low)';
          card.style.borderRadius = 'var(--radius-md)';
          card.style.marginBottom = 'var(--space-3)';

          var avatar = document.createElement('div');
          avatar.style.width = '48px';
          avatar.style.height = '48px';
          avatar.style.borderRadius = '50%';
          avatar.style.background = 'var(--color-primary-container)';
          avatar.style.display = 'flex';
          avatar.style.alignItems = 'center';
          avatar.style.justifyContent = 'center';
          avatar.style.flexShrink = '0';
          avatar.innerHTML = '<i data-lucide="user" style="width:24px;height:24px;color:var(--color-primary);"></i>';

          var content = document.createElement('div');
          content.style.flex = '1';

          var header = document.createElement('div');
          header.style.display = 'flex';
          header.style.alignItems = 'center';
          header.style.justifyContent = 'space-between';
          header.style.marginBottom = 'var(--space-2)';

          var expertName = document.createElement('div');
          expertName.style.fontSize = 'var(--font-size-body)';
          expertName.style.fontWeight = '600';
          expertName.style.color = 'var(--color-on-surface)';
          expertName.textContent = comment.expert;

          var rating = document.createElement('div');
          rating.style.display = 'flex';
          for (var i = 0; i < comment.rating; i++) {
            rating.innerHTML += '<i data-lucide="star" style="width:14px;height:14px;color:var(--aitutor-warning-500);fill:var(--aitutor-warning-500);"></i>';
          }

          header.appendChild(expertName);
          header.appendChild(rating);

          var text = document.createElement('div');
          text.style.fontSize = 'var(--font-size-body)';
          text.style.color = 'var(--color-on-surface-variant)';
          text.style.lineHeight = 'var(--line-height-body)';
          text.textContent = comment.content;

          content.appendChild(header);
          content.appendChild(text);

          card.appendChild(avatar);
          card.appendChild(content);

          container.appendChild(card);
        });

        lucide.createIcons();
      }

      document.getElementById('searchBtn').addEventListener('click', fetchTrends);

      initCharts();
      fetchTrends();

      var themeToggle = document.getElementById('themeToggle');
      function updateThemeIcon() {
        var isDark = document.documentElement.classList.contains('dark');
        var icon = themeToggle.querySelector('i');
        if (icon) {
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        }
      }
      themeToggle.addEventListener('click', function() {
        var html = document.documentElement;
        if (html.classList.contains('dark')) {
          html.classList.remove('dark');
          html.classList.add('light');
          localStorage.setItem('aitutor-theme', 'light');
        } else {
          html.classList.remove('light');
          html.classList.add('dark');
          localStorage.setItem('aitutor-theme', 'dark');
        }
        updateThemeIcon();
        setTimeout(function() {
          typeTrendChart && typeTrendChart.resize();
          difficultyChart && difficultyChart.resize();
          knowledgeChart && knowledgeChart.resize();
          typePieChart && typePieChart.resize();
        }, 100);
      });
      (function() {
        var saved = localStorage.getItem('aitutor-theme');
        if (saved) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(saved);
        }
        updateThemeIcon();
      })();

    })();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
