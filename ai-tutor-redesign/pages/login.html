<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - 登录</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/tokens.css">
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--sp-4);
            background: linear-gradient(135deg, var(--bg2) 0%, var(--bg) 100%);
        }
        
        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg);
            border-radius: var(--radius-lg);
            padding: var(--sp-8);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--rule);
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: var(--sp-6);
        }
        
        .login-logo__icon {
            width: 72px;
            height: 72px;
            margin: 0 auto var(--sp-3);
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        
        .login-logo__title {
            font-size: var(--fs-2xl);
            font-weight: 700;
            color: var(--ink);
            margin-bottom: var(--sp-1);
        }
        
        .login-logo__subtitle {
            font-size: var(--fs-sm);
            color: var(--muted);
        }
        
        .step-container {
            display: none;
            animation: slideIn 0.3s ease-out;
        }
        
        .step-container.active {
            display: block;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .step-title {
            font-size: var(--fs-lg);
            font-weight: 600;
            color: var(--ink);
            text-align: center;
            margin-bottom: var(--sp-6);
        }
        
        .step-desc {
            font-size: var(--fs-base);
            color: var(--muted);
            text-align: center;
            margin-bottom: var(--sp-6);
        }
        
        .role-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--sp-4);
            background-color: var(--bg2);
            border-radius: var(--radius-md);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-bottom: var(--sp-3);
        }
        
        .role-card:hover {
            border-color: var(--accent);
            background-color: var(--bg3);
        }
        
        .role-card.selected {
            border-color: var(--accent);
            background-color: rgba(45, 106, 79, 0.08);
        }
        
        .role-card__icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            flex-shrink: 0;
        }
        
        .role-card__info {
            flex: 1;
            margin-left: var(--sp-3);
        }
        
        .role-card__title {
            font-size: var(--fs-base);
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 2px;
        }
        
        .role-card__desc {
            font-size: var(--fs-sm);
            color: var(--muted);
        }
        
        .role-card__check {
            color: var(--accent);
            display: none;
        }
        
        .role-card.selected .role-card__check {
            display: block;
        }
        
        .input-group {
            margin-bottom: var(--sp-4);
        }
        
        .input-group label {
            display: block;
            font-size: var(--fs-sm);
            font-weight: 500;
            color: var(--ink);
            margin-bottom: var(--sp-2);
        }
        
        .input-group input {
            width: 100%;
            padding: var(--sp-3) var(--sp-4);
            background-color: var(--bg2);
            border: 1px solid var(--rule);
            border-radius: var(--radius-md);
            font-size: var(--fs-base);
            color: var(--ink);
            transition: border-color var(--transition-fast);
        }
        
        .input-group input:focus {
            border-color: var(--accent);
            outline: none;
        }
        
        .input-group input::placeholder {
            color: var(--muted);
        }
        
        .form-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--sp-6);
        }
        
        .form-footer label {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            font-size: var(--fs-sm);
            color: var(--muted);
            cursor: pointer;
        }
        
        .form-footer input[type="checkbox"] {
            accent-color: var(--accent);
        }
        
        .form-footer a {
            font-size: var(--fs-sm);
            color: var(--accent);
            text-decoration: none;
        }
        
        .form-footer a:hover {
            text-decoration: underline;
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: var(--sp-3);
        }
        
        .guest-hint {
            text-align: center;
            font-size: var(--fs-sm);
            color: var(--muted);
            margin-top: var(--sp-4);
        }
        
        .login-footer {
            text-align: center;
            margin-top: var(--sp-6);
            padding-top: var(--sp-6);
            border-top: 1px solid var(--rule);
        }
        
        .login-footer p {
            font-size: var(--fs-xs);
            color: var(--muted);
        }
        
        .login-footer a {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo__icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a10 10 0 0 0-10 10c0 5 3.5 9.5 8.5 9.95V17h-2v-2h2V9.5c0-1.5.5-2.5 2.5-2.5h2.5v2H15v2h-2v6.95c5-.45 8.5-4.95 8.5-9.95a10 10 0 0 0-10-10z"/>
                    </svg>
                </div>
                <div class="login-logo__title">AI Tutor</div>
                <div class="login-logo__subtitle">AI驱动的个性化学习诊断</div>
            </div>

            <div id="step1" class="step-container active">
                <h2 class="step-title">选择登录方式</h2>
                
                <div class="btn-group">
                    <button class="btn btn--primary btn--lg w-full" onclick="enterGuestMode()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2a10 10 0 0 0-10 10c0 5 3.5 9.5 8.5 9.95V17h-2v-2h2V9.5c0-1.5.5-2.5 2.5-2.5h2.5v2H15v2h-2v6.95c5-.45 8.5-4.95 8.5-9.95a10 10 0 0 0-10-10z"/>
                        </svg>
                        <span>游客模式</span>
                    </button>
                    
                    <button class="btn btn--ghost btn--lg w-full" onclick="showLoginForm()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <line x1="20" y1="8" x2="20" y2="14"/>
                            <line x1="23" y1="11" x2="17" y2="11"/>
                        </svg>
                        <span>登录账号</span>
                    </button>
                </div>

                <p class="guest-hint">游客模式可体验基础功能，登录账号解锁完整学习体验</p>
            </div>

            <div id="step2" class="step-container">
                <h2 class="step-title">账号登录</h2>
                
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名">
                </div>
                
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码">
                </div>

                <div class="form-footer">
                    <label>
                        <input type="checkbox" id="rememberMe">
                        <span>记住密码</span>
                    </label>
                    <a href="#" onclick="alert('忘记密码功能开发中')">忘记密码?</a>
                </div>

                <div class="btn-group">
                    <button class="btn btn--primary btn--lg w-full" onclick="handleLogin()">
                        <span>登 录</span>
                    </button>
                    <button class="btn btn--ghost btn--md w-full" onclick="showStep1()">
                        <span>返回</span>
                    </button>
                </div>
            </div>

            <div id="step3" class="step-container">
                <h2 class="step-title">选择身份角色</h2>
                <p class="step-desc">根据您的身份选择相应的使用模式</p>
                
                <div>
                    <div class="role-card selected" onclick="selectRole('student')">
                        <div class="role-card__icon" style="background-color: var(--accent4);">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="8.5" cy="7" r="4"/>
                                <line x1="20" y1="8" x2="20" y2="14"/>
                                <line x1="23" y1="11" x2="17" y2="11"/>
                            </svg>
                        </div>
                        <div class="role-card__info">
                            <div class="role-card__title">学生</div>
                            <div class="role-card__desc">在线做题、AI讲题、错题本</div>
                        </div>
                        <svg class="role-card__check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>

                    <div class="role-card" onclick="selectRole('teacher')">
                        <div class="role-card__icon" style="background-color: var(--accent);">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2a10 10 0 0 0-10 10c0 5 3.5 9.5 8.5 9.95V17h-2v-2h2V9.5c0-1.5.5-2.5 2.5-2.5h2.5v2H15v2h-2v6.95c5-.45 8.5-4.95 8.5-9.95a10 10 0 0 0-10-10z"/>
                            </svg>
                        </div>
                        <div class="role-card__info">
                            <div class="role-card__title">教师</div>
                            <div class="role-card__desc">班级管理、试卷分析、教学统计</div>
                        </div>
                        <svg class="role-card__check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>

                    <div class="role-card" onclick="selectRole('admin')">
                        <div class="role-card__icon" style="background-color: var(--accent3);">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            </svg>
                        </div>
                        <div class="role-card__info">
                            <div class="role-card__title">管理员</div>
                            <div class="role-card__desc">系统管理、用户管理、数据统计</div>
                        </div>
                        <svg class="role-card__check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                </div>

                <button class="btn btn--primary btn--lg w-full mt-6" onclick="confirmRole()">
                    <span>确认选择</span>
                </button>
            </div>

            <div class="login-footer">
                <p>登录即表示您同意我们的 <a href="#">用户协议</a> 和 <a href="#">隐私政策</a></p>
            </div>
        </div>
    </div>

    <script>
        var selectedRole = 'student';

        function showStep1() {
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
            document.getElementById('step1').classList.add('active');
        }

        function showLoginForm() {
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
            document.getElementById('step2').classList.add('active');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function showRoleSelection() {
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
            document.getElementById('step3').classList.add('active');
        }

        function enterGuestMode() {
            var user = {
                id: 'guest_' + Date.now(),
                username: 'guest',
                name: '游客用户',
                role: 'student',
                avatar: '',
                isGuest: true,
                issuedAt: Date.now(),
                expiresAt: Date.now() + 24 * 60 * 60 * 1000
            };
            localStorage.setItem('aitutor_login', JSON.stringify(user));
            window.location.href = 'home.html';
        }

        function handleLogin() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();
            var rememberMe = document.getElementById('rememberMe').checked;

            if (!username) {
                alert('请输入用户名');
                return;
            }
            if (!password) {
                alert('请输入密码');
                return;
            }

            if (rememberMe) {
                localStorage.setItem('aitutor_remember', JSON.stringify({
                    username: username,
                    password: password
                }));
            } else {
                localStorage.removeItem('aitutor_remember');
            }

            showRoleSelection();
        }

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-card').forEach(function(card) {
                card.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
        }

        function confirmRole() {
            var username = document.getElementById('username') ? document.getElementById('username').value.trim() : 'guest';
            var names = { 'student': '学生用户', 'teacher': '教师用户', 'admin': '管理员' };
            
            var user = {
                id: 'user_' + Date.now(),
                username: username || 'user',
                name: names[selectedRole] || '用户',
                role: selectedRole,
                avatar: '',
                isGuest: false,
                issuedAt: Date.now(),
                expiresAt: Date.now() + 7 * 24 * 60 * 60 * 1000
            };
            localStorage.setItem('aitutor_login', JSON.stringify(user));
            window.location.href = 'home.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            var remember = localStorage.getItem('aitutor_remember');
            if (remember) {
                try {
                    var data = JSON.parse(remember);
                    document.getElementById('username').value = data.username || '';
                    document.getElementById('password').value = data.password || '';
                    document.getElementById('rememberMe').checked = true;
                } catch(e) {}
            }
            lucide.createIcons();
        });
    </script>
</body>
</html>
