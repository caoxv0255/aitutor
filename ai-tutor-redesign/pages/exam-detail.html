  --aitutor-info-300: #7dd3fc;
  --aitutor-info-400: #38bdf8;

  --border: #e2e8f0;

  --surface-dim: #f1f5f9;
  --surface-container: #e8ecf1;

  --space-2: 8px;

  --space-4: 16px;

  --size-icon-md: 24px;
  --size-icon-lg: 32px;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 16px;
  --radius-pill: 9999px;
  --shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 1px 1px rgba(0,0,0,.04);

.dark {
  --background: #0f1117;
  --foreground: #e8ecf1;
  --surface: #1a1d27;
  --surface-dim: #12141c;
  --surface-container: #22252f;
  --surface-container-high: #2a2d38;
  --muted: #64748b;
  --muted-foreground: #94a3b8;
  --border: #2a2d38;
}

.aitutor-h1 { font-family: var(--font-heading); font-size: var(--font-size-h1); font-weight: var(--font-weight-h1); line-height: 1.2; }
.aitutor-h2 { font-family: var(--font-heading); font-size: var(--font-size-h2); font-weight: var(--font-weight-h2); line-height: 1.25; }
.aitutor-h3 { font-family: var(--font-heading); font-size: var(--font-size-h3); font-weight: var(--font-weight-h3); line-height: 1.3; }
.aitutor-h4 { font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); line-height: 1.4; }
.aitutor-body { font-family: var(--font-body); font-size: var(--font-size-body); font-weight: var(--font-weight-body); line-height: 1.6; }
.aitutor-caption { font-family: var(--font-body); font-size: var(--font-size-caption); font-weight: var(--font-weight-body); line-height: 1.5; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); font-family: var(--font-body); font-weight: var(--font-weight-body); white-space: nowrap; cursor: pointer; border: none; border-radius: var(--radius-pill); transition: background .15s, border-color .15s; flex-shrink: 0; }
.btn.primary { background: var(--accent); color: var(--primary-foreground); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn.ghost:hover { background: var(--surface-container); }
.btn.sm { height: var(--size-button-sm); padding: 0 var(--space-4); font-size: var(--font-size-caption); }
.btn.md { height: var(--size-button-md); padding: 0 var(--space-5); font-size: var(--font-size-body); }
.btn.lg { height: var(--size-button-lg); padding: 0 28px; font-size: var(--font-size-lead); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-6); box-shadow: var(--shadow-1); }
.card-heading { font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); color: var(--foreground); }

.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--space-3); border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; white-space: nowrap; }
.tag--primary { background: var(--aitutor-primary-50); color: var(--aitutor-primary-700); border: 1px solid var(--aitutor-primary-200); }
.tag--blue { background: var(--aitutor-blue-50); color: var(--aitutor-blue-700); border: 1px solid var(--aitutor-blue-200); }
.tag--success { background: var(--aitutor-success-50); color: var(--aitutor-success-700); border: 1px solid var(--aitutor-success-200); }
.tag--warning { background: var(--aitutor-warning-50); color: var(--aitutor-warning-700); border: 1px solid var(--aitutor-warning-200); }
.tag--error { background: var(--aitutor-error-50); color: var(--aitutor-error-700); border: 1px solid var(--aitutor-error-200); }

.navbar { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 var(--space-5); background: var(--surface); border-bottom: 1px solid var(--border); width: 100%; box-sizing: border-box; position: sticky; top: 0; z-index: 50; }
.navbar-logo { font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h2); color: var(--foreground); text-decoration: none; }
.navbar-links { display: flex; align-items: center; gap: var(--space-5); list-style: none; margin: 0; padding: 0; }
.navbar-link { font-size: var(--font-size-body); color: var(--muted); text-decoration: none; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); }
.navbar-link:hover { color: var(--foreground); }
.navbar-link.active { color: var(--foreground); font-weight: var(--font-weight-h4); }
.navbar-actions { display: flex; align-items: center; gap: var(--space-3); }

.pdf-toolbar { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); background: var(--surface); border-bottom: 1px solid var(--border); gap: var(--space-3); flex-wrap: wrap; }
.pdf-controls { display: flex; align-items: center; gap: var(--space-2); }
.pdf-control-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--surface-container); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; color: var(--foreground); }
.pdf-control-btn:hover { background: var(--surface-container-high); }
.pdf-control-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.pdf-zoom-select { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-1) var(--space-3); font-family: var(--font-body); font-size: var(--font-size-body); outline: none; }

.pdf-viewer { background: #fff; height: calc(100vh - 240px); overflow: auto; }
.pdf-page { max-width: 800px; margin: var(--space-4) auto; padding: var(--space-6); border: 1px solid var(--border); border-radius: var(--radius-md); background: #fff; color: #000; }
.pdf-page.dark-mode { background: #222; color: #fff; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: var(--space-2) 0; background: var(--surface); border-top: 1px solid var(--border); z-index: 50; }
.bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: 12px; }
.bottom-nav-item.active { color: var(--primary); }
.bottom-nav-spacer { height: 60px; }

@media (max-width: 768px) {
  .navbar-links { display: none; }
  .pdf-viewer { height: calc(100vh - 280px); }
}

function renderPage() {
    var content = document.getElementById('pdf-content');
    var pageNum = document.getElementById('page-num');
    var prevBtn = document.getElementById('prev-page');
    var nextBtn = document.getElementById('next-page');
    
    content.innerHTML = '<div class="pdf-page" style="transform:scale(' + (zoomLevel / 100) + ');transform-origin:top center;">' + pages[currentPage - 1] + '</div>';
    pageNum.textContent = currentPage + ' / ' + totalPages;
    prevBtn.disabled = currentPage === 1;
    nextBtn.disabled = currentPage === totalPages;
}

function prevPage() {
    if (currentPage > 1) {
        currentPage--;
        renderPage();
    }
}

function nextPage() {
    if (currentPage < totalPages) {
        currentPage++;
        renderPage();
    }
}

function zoomIn() {
    if (zoomLevel < 200) {
        zoomLevel += 25;
        document.getElementById('zoom-select').value = zoomLevel;
        renderPage();
    }
}

function zoomOut() {
    if (zoomLevel > 50) {
        zoomLevel -= 25;
        document.getElementById('zoom-select').value = zoomLevel;
        renderPage();
    }
}

function setZoom(value) {
    zoomLevel = parseInt(value);
    renderPage();
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

function downloadPDF() {
    var content = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>2026年全国高考数学预测卷 #3</title><style>body{font-family:SimSun,serif;margin:40px;}h2{text-align:center;margin-bottom:20px;}h3{margin-top:20px;margin-bottom:15px;}p{margin-bottom:10px;}</style></head><body>';
    pages.forEach(function(page) {
        content += page;
    });
    content += '</body></html>';
    
    var blob = new Blob([content], {type: 'application/pdf'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '2026年全国高考数学预测卷#3.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function toggleTheme() {
    document.documentElement.classList.toggle('dark');
    var pdfPages = document.querySelectorAll('.pdf-page');
    pdfPages.forEach(function(page) {
        page.classList.toggle('dark-mode');
    });
}

renderPage();
