                    <svg id="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>

        <main class="layout__main">
            <div class="layout__content">
                <div class="page-header">
                    <div class="page-header__info">

                        <p class="page-header__subtitle">智能规划学习路径，高效备考冲刺</p>
                    </div>
                    <div class="page-header__actions">
                        <button class="btn btn--primary" onclick="generatePlan()">

                            AI生成计划
                        </button>
                        <button class="btn btn--ghost" onclick="exportPlan()">
                            <i data-lucide="download"></i>
                            导出计划

                    </div>
                </div>

                <div class="grid grid-1 lg:grid-3 gap-6" style="margin-bottom: var(--sp-6);">
                    <div class="card stat-card">
                        <div class="stat-card__icon" style="background: var(--accent-bg); color: var(--accent);">
                            <i data-lucide="calendar-days"></i>
                        </div>
                        <div class="stat-card__content">
                            <span class="stat-card__number">14</span>
                            <span class="stat-card__label">计划天数</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-card__icon" style="background: var(--accent3-bg); color: var(--accent3);">
                            <i data-lucide="check-circle"></i>
                        </div>
                        <div class="stat-card__content">
                            <span class="stat-card__number" id="completed-tasks">8</span>
                            <span class="stat-card__label">已完成任务</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-card__icon" style="background: var(--accent-bg); color: var(--accent);">
                            <i data-lucide="target"></i>
                        </div>
                        <div class="stat-card__content">
                            <span class="stat-card__number" id="plan-progress">57%</span>
                            <span class="stat-card__label">计划进度</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-1 lg:grid-2 gap-6" style="margin-bottom: var(--sp-6);">
                    <div class="card" style="padding: var(--sp-5);">
                        <h3 class="fs-lg fw-semibold" style="color: var(--ink); margin-bottom: var(--sp-4);">任务完成趋势</h3>
                        <div id="progress-chart" style="height: 250px; width: 100%;"></div>
                    </div>
                    <div class="card" style="padding: var(--sp-5);">
                        <h3 class="fs-lg fw-semibold" style="color: var(--ink); margin-bottom: var(--sp-4);">学科时间分配</h3>
                        <div id="time-distribution-chart" style="height: 250px; width: 100%;"></div>
                    </div>
                </div>

                <div class="card" style="padding: var(--sp-5); margin-bottom: var(--sp-6);">
                    <div class="flex items-center justify-between" style="margin-bottom: var(--sp-4);">
                        <h3 class="fs-lg fw-semibold" style="color: var(--ink);">今日任务</h3>
                        <span class="tag tag--success" id="today-date">2025-02-20</span>
                    </div>
                    <div class="task-list" id="today-tasks">
                    </div>
                </div>

                <div class="card" style="padding: var(--sp-5);">
                    <div class="flex items-center justify-between" style="margin-bottom: var(--sp-4);">
                        <h3 class="fs-lg fw-semibold" style="color: var(--ink);">周计划概览</h3>
                        <div class="flex gap-2">
                            <button class="btn btn--ghost btn--sm" onclick="prevWeek()">上一周</button>
                            <button class="btn btn--ghost btn--sm" onclick="nextWeek()">下一周</button>
                        </div>
                    </div>
                    <div class="week-calendar">
                        <div class="week-calendar__header">
                            <div class="week-calendar__day">周一</div>
                            <div class="week-calendar__day">周二</div>
                            <div class="week-calendar__day">周三</div>
                            <div class="week-calendar__day">周四</div>
                            <div class="week-calendar__day">周五</div>
                            <div class="week-calendar__day">周六</div>
                            <div class="week-calendar__day">周日</div>
                        </div>
                        <div class="week-calendar__body" id="week-calendar-body">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <style>
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--sp-6);
            flex-wrap: wrap;
            gap: var(--sp-4);
        }

        .page-header__title {
            font-size: var(--fs-xl);
            font-weight: 700;
            color: var(--ink);
            margin: 0 0 var(--sp-1);
        }

        .page-header__subtitle {
            font-size: var(--fs-base);
            color: var(--muted);
            margin: 0;
        }

        .page-header__actions {
            display: flex;
            gap: var(--sp-3);
            flex-wrap: wrap;
        }

        .stat-card {
            display: flex;
            align-items: center;
            gap: var(--sp-4);
            padding: var(--sp-5);
        }

        .stat-card__icon {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .stat-card__number {
            font-size: var(--fs-2xl);
            font-weight: 700;
            color: var(--ink);
            font-family: var(--font-mono);
            display: block;
        }

        .stat-card__label {
            font-size: var(--fs-sm);
            color: var(--muted);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: var(--sp-3);
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: var(--sp-3);
            padding: var(--sp-3);
            background-color: var(--bg2);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
        }

        .task-item:hover {
            background-color: var(--bg3);
        }

        .task-item--completed {
            opacity: 0.6;
        }

        .task-item__checkbox {
            width: 20px;
            height: 20px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--rule);
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }

        .task-item--completed .task-item__checkbox {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .task-item__checkbox svg {
            display: none;
            width: 12px;
            height: 12px;
            color: white;
        }

        .task-item--completed .task-item__checkbox svg {
            display: block;
        }

        .task-item__content {
            flex: 1;
            min-width: 0;
        }

        .task-item__title {
            font-size: var(--fs-sm);
            font-weight: 600;
            color: var(--ink);
            display: block;
            margin-bottom: 2px;
        }

        .task-item--completed .task-item__title {
            text-decoration: line-through;
            color: var(--muted);
        }

        .task-item__meta {
            font-size: var(--fs-xs);
            color: var(--muted);
        }

        .task-item__time {
            font-size: var(--fs-xs);
            color: var(--accent);
            font-weight: 600;
            flex-shrink: 0;
        }

        .week-calendar {
            border: 1px solid var(--rule);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .week-calendar__header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background-color: var(--bg2);
            padding: var(--sp-3);
        }

        .week-calendar__day {
            text-align: center;
            font-size: var(--fs-xs);
            font-weight: 600;
            color: var(--muted);
        }

        .week-calendar__body {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .week-calendar__cell {
            padding: var(--sp-3);
            border-right: 1px solid var(--rule);
            border-bottom: 1px solid var(--rule);
            min-height: 80px;
            position: relative;
            cursor: pointer;
            transition: background-color var(--transition-fast);
        }

        .week-calendar__cell:hover {
            background-color: var(--bg2);
        }

        .week-calendar__cell:last-child {
            border-right: none;
        }

        .week-calendar__cell:last-child {
            border-bottom: none;
        }

        .week-calendar__date {
            font-size: var(--fs-xs);
            color: var(--muted);
            margin-bottom: var(--sp-1);
        }

        .week-calendar__cell--today .week-calendar__date {
            background-color: var(--accent);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--sp-1);
        }

        .week-calendar__tasks {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .week-calendar__task {
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .week-calendar__task--math {
            background-color: rgba(61, 90, 128, 0.2);
            color: var(--accent);
        }

        .week-calendar__task--physics {
            background-color: rgba(30, 136, 229, 0.2);
            color: var(--accent4);
        }

        .week-calendar__task--chemistry {
            background-color: rgba(46, 108, 79, 0.2);
            color: var(--accent);
        }

        .week-calendar__task--english {
            background-color: rgba(233, 196, 106, 0.2);
            color: var(--accent3);
        }

        .week-calendar__task--chinese {
            background-color: rgba(230, 57, 70, 0.2);
            color: var(--accent2);
        }

        .week-calendar__cell--empty {
            background-color: var(--bg2);
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .week-calendar__cell {
                min-height: 60px;
                padding: var(--sp-2);
            }

            .week-calendar__task {
                font-size: 9px;
            }
        }
    </style>

    <script type="module">
    import { ChartWrapper } from '../assets/modules/charts/chart-wrapper.js';

    const today = new Date();
    document.getElementById('today-date').textContent = today.toISOString().split('T')[0];

    const weekDays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const subjectColors = {
        '数学': 'week-calendar__task--math',
        '物理': 'week-calendar__task--physics',
        '化学': 'week-calendar__task--chemistry',
        '英语': 'week-calendar__task--english',
        '语文': 'week-calendar__task--chinese'
    };

    let currentWeekStart = getWeekStart(today);

    function getWeekStart(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    function prevWeek() {
        currentWeekStart = new Date(currentWeekStart.getTime() - 7 * 24 * 60 * 60 * 1000);
        renderWeekCalendar();
    }

    function nextWeek() {
        currentWeekStart = new Date(currentWeekStart.getTime() + 7 * 24 * 60 * 60 * 1000);
        renderWeekCalendar();
    }

    const planData = {
        today: [
            { id: 1, title: '导数与切线复习', subject: '数学', time: '08:00', duration: '60分钟', completed: false },
            { id: 2, title: '电磁感应专题练习', subject: '物理', time: '09:30', duration: '45分钟', completed: true },
            { id: 3, title: '氧化还原反应巩固', subject: '化学', time: '14:00', duration: '40分钟', completed: false },
            { id: 4, title: '英语阅读理解', subject: '英语', time: '15:30', duration: '30分钟', completed: false },
            { id: 5, title: '错题回顾 - 三角函数', subject: '数学', time: '19:00', duration: '30分钟', completed: true },
        ],
        week: [
            { date: '2025-02-17', tasks: [{ subject: '数学', title: '导数' }, { subject: '物理', title: '电磁' }] },
            { date: '2025-02-18', tasks: [{ subject: '化学', title: '氧化' }, { subject: '英语', title: '阅读' }] },
            { date: '2025-02-19', tasks: [{ subject: '数学', title: '三角' }, { subject: '语文', title: '作文' }] },
            { date: '2025-02-20', tasks: [{ subject: '数学', title: '导数' }, { subject: '物理', title: '电磁' }, { subject: '化学', title: '氧化' }] },
            { date: '2025-02-21', tasks: [{ subject: '英语', title: '语法' }, { subject: '数学', title: '概率' }] },
            { date: '2025-02-22', tasks: [{ subject: '物理', title: '力学' }, { subject: '化学', title: '有机' }] },
            { date: '2025-02-23', tasks: [{ subject: '语文', title: '阅读' }, { subject: '英语', title: '写作' }] },
        ]
    };

    function renderTodayTasks() {
        const container = document.getElementById('today-tasks');
        container.innerHTML = planData.today.map(task => `
            <div class="task-item ${task.completed ? 'task-item--completed' : ''}" onclick="toggleTask(${task.id})">
                <div class="task-item__checkbox">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <div class="task-item__content">
                    <span class="task-item__title">${task.title}</span>
                    <span class="task-item__meta"><span class="tag tag--primary">${task.subject}</span> · ${task.duration}</span>
                </div>
                <span class="task-item__time">${task.time}</span>
            </div>
        `).join('');
        
        updateStats();
    }

    function toggleTask(id) {
        const task = planData.today.find(t => t.id === id);
        if (task) {
            task.completed = !task.completed;
            renderTodayTasks();
        }
    }

    function updateStats() {
        const completed = planData.today.filter(t => t.completed).length;
        const total = planData.today.length;
        const progress = Math.round((completed / total) * 100);
        
        document.getElementById('completed-tasks').textContent = completed;
        document.getElementById('plan-progress').textContent = progress + '%';
    }

    function renderWeekCalendar() {
        const container = document.getElementById('week-calendar-body');
        let html = '';
        
        for (let i = 0; i < 7; i++) {
            const date = new Date(currentWeekStart.getTime() + i * 24 * 60 * 60 * 1000);
            const dateStr = date.toISOString().split('T')[0];
            const dayOfMonth = date.getDate();
            
            const weekData = planData.week.find(d => d.date === dateStr);
            const tasks = weekData ? weekData.tasks : [];
            
            const isToday = dateStr === today.toISOString().split('T')[0];
            const isPast = date < today && !isToday;
            
            html += `
                <div class="week-calendar__cell ${isToday ? 'week-calendar__cell--today' : ''} ${isPast ? 'week-calendar__cell--empty' : ''}">
                    <div class="week-calendar__date">${dayOfMonth}</div>
                    <div class="week-calendar__tasks">
                        ${tasks.map(t => `<div class="week-calendar__task ${subjectColors[t.subject] || ''}">${t.title}</div>`).join('')}
                    </div>
                </div>
            `;
        }
        
        container.innerHTML = html;
    }

    function renderCharts() {
        new ChartWrapper('progress-chart').render({
            chartType: 'line',
            title: '近7天任务完成趋势',
            xAxisData: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
            yAxisName: '完成任务数',
            series: [{
                name: '完成任务',
                data: [5, 6, 4, 7, 5, 8, 6],
                smooth: true,
                areaStyle: { color: 'rgba(61, 90, 128, 0.1)' }
            }]
        });

        new ChartWrapper('time-distribution-chart').render({
            chartType: 'pie',
            title: '学科时间分配',
            data: [
                { name: '数学', value: 35 },
                { name: '物理', value: 20 },
                { name: '化学', value: 15 },
                { name: '英语', value: 20 },
                { name: '语文', value: 10 }
            ]
        });
    }

    function generatePlan() {
        showToast('正在生成智能学习计划...');
        setTimeout(() => {
            showToast('计划生成成功！');
        }, 1500);
    }

    function exportPlan() {
        const planText = `学习计划 - ${today.toLocaleDateString('zh-CN')}\n\n今日任务：\n${planData.today.map((t, i) => `${i + 1}. ${t.title} - ${t.subject} (${t.time}, ${t.duration}) ${t.completed ? '[已完成]' : '[未完成]'}`).join('\n')}`;
        
        const blob = new Blob([planText], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `学习计划_${today.toISOString().split('T')[0]}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        showToast('计划导出成功！');
    }

    document.addEventListener('DOMContentLoaded', function() {
        lucide.createIcons();
        renderTodayTasks();
        renderWeekCalendar();
        renderCharts();
    });
    </script>
</body>
