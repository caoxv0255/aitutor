<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input — AI Tutor</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-body); color: var(--color-on-surface); }
  .row { display: flex; gap: var(--space-3); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); color: var(--color-on-surface-variant); text-transform: uppercase; letter-spacing: 0.08em; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

  /* @component-css-start */
  .form-group { display: flex; flex-direction: column; gap: var(--space-1); min-width: 240px; }
  .form-group > label { font-size: var(--font-size-body); font-weight: 500; color: var(--color-on-surface); }
  .input-field { display: flex; align-items: center; height: var(--size-input-height); background: var(--color-background); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 0 var(--space-3); font-family: var(--font-body); font-size: var(--font-size-body); color: var(--color-on-surface); outline: none; transition: border-color .15s; width: 100%; min-width: 120px; }
  .input-field::placeholder { color: var(--muted); }
  .input-field:focus { border-color: var(--color-primary); }
  .input-field:disabled { opacity: .5; cursor: not-allowed; }
  .input-wrap { display: flex; align-items: center; height: var(--size-input-height); background: var(--color-background); border: 1px solid var(--color-border); border-radius: var(--radius-pill); padding: 0 var(--space-3); width: 100%; min-width: 240px; transition: border-color .15s; }
  .input-wrap:focus-within { border-color: var(--color-primary); }
  .input-wrap .icon { width: var(--size-icon-md); height: var(--size-icon-md); flex-shrink: 0; color: var(--muted); }
  .input-wrap input { border: none; outline: none; background: transparent; font: inherit; color: inherit; flex: 1; min-width: 0; }
  .input-wrap input::placeholder { color: var(--muted); }
  /* @component-css-end */
</style>
</head>
<body>

<div class="row">
  <span class="label">默认</span>
  <div class="form-group" data-evidence-sample="Default">
    <label>题目内容</label>
    <input class="input-field" type="text" placeholder="请输入题目内容">
  </div>
</div>

<div class="row">
  <span class="label">禁用</span>
  <div class="form-group">
    <label>用户名</label>
    <input class="input-field" type="text" placeholder="请输入用户名" disabled>
  </div>
</div>

<hr class="divider">

<div class="row">
  <span class="label">搜索</span>
  <div class="form-group" data-evidence-sample="Search">
    <label>搜索知识点</label>
    <div class="input-wrap">
      <i data-lucide="search" class="icon"></i>
      <input type="text" placeholder="输入知识点关键词">
    </div>
  </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
