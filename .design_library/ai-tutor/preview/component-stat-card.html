<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StatCard — AI Tutor</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 12px; background: var(--color-surface-dim); font-family: var(--font-body); color: var(--color-on-surface); }
  .stage { display: flex; flex-direction: column; gap: var(--space-4); }
  .story { display: flex; flex-direction: column; gap: var(--space-3); }
  .rail { display: flex; gap: var(--space-4); flex-wrap: wrap; align-items: stretch; }
  .story-label { font-size: var(--font-size-caption); font-weight: var(--font-weight-eyebrow); color: var(--color-on-surface-variant); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .stat-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-5); text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--space-1); flex-shrink: 0; min-width: 140px; }
  .stat-card:hover { box-shadow: var(--shadow-2); transition: box-shadow .15s; }
  .stat-card__number { font-family: var(--font-display); font-size: var(--font-size-h2); font-weight: var(--font-weight-h1); line-height: var(--line-height-h2); color: var(--color-on-surface); }
  .stat-card__label { font-size: var(--font-size-body); font-weight: var(--font-weight-body); line-height: var(--line-height-body); color: var(--color-on-surface-variant); white-space: nowrap; }
  .stat-card__change { font-size: var(--font-size-caption); font-weight: var(--font-weight-caption); line-height: var(--line-height-caption); color: var(--color-success); white-space: nowrap; }
  .stat-card--accent { background: var(--color-primary-container); border: 2px solid var(--color-primary); }
  .stat-card--accent .stat-card__number { color: var(--color-primary); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="stage">
  <!-- Group 1: Default variants -->
  <div class="story">
    <span class="story-label">Default</span>
    <div class="rail">
      <div class="stat-card" data-evidence-sample="Default">
        <span class="stat-card__number">78</span>
        <span class="stat-card__label">综合得分</span>
      </div>
      <div class="stat-card" data-evidence-sample="Default">
        <span class="stat-card__number">12</span>
        <span class="stat-card__label">薄弱知识点</span>
      </div>
      <div class="stat-card" data-evidence-sample="Default">
        <span class="stat-card__number">92%</span>
        <span class="stat-card__label">考点覆盖</span>
      </div>
    </div>
    <div class="rail">
      <div class="stat-card" data-evidence-sample="Default">
        <span class="stat-card__number">+5</span>
        <span class="stat-card__label">本周提升</span>
        <span class="stat-card__change">较上周</span>
      </div>
    </div>
  </div>

  <hr class="divider">

  <!-- Group 2: Accent variant -->
  <div class="story">
    <span class="story-label">Accent</span>
    <div class="rail">
      <div class="stat-card stat-card--accent" data-evidence-sample="Accent">
        <span class="stat-card__number">78</span>
        <span class="stat-card__label">综合得分</span>
      </div>
      <div class="stat-card stat-card--accent" data-evidence-sample="Accent">
        <span class="stat-card__number">+5</span>
        <span class="stat-card__label">本周提升</span>
        <span class="stat-card__change">较上周</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
