<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tag — AI Tutor</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-surface); font-family: var(--font-body); color: var(--color-on-surface); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-on-surface-variant); min-width: 92px; }
.divider { border: none; border-top: 1px solid var(--color-outline); margin: 12px 0; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--space-3); border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1; min-width: 24px; flex-shrink: 0; transition: background .15s, border-color .15s, filter .15s; }
.tag--default { background: var(--color-surface); border: 1px solid var(--color-outline); color: var(--color-on-surface); }
.tag--default:hover { background: var(--color-surface-container-low); }
.tag--primary { background: var(--aitutor-primary-50); color: var(--aitutor-primary-700); border: 1px solid var(--aitutor-primary-200); }
.tag--primary:hover { filter: brightness(1.05); }
.tag--blue { background: var(--aitutor-blue-50); color: var(--aitutor-blue-700); border: 1px solid var(--aitutor-blue-200); }
.tag--blue:hover { filter: brightness(1.05); }
.tag--success { background: var(--aitutor-success-50); color: var(--aitutor-success-700); border: 1px solid var(--aitutor-success-200); }
.tag--success:hover { filter: brightness(1.05); }
.tag--info { background: var(--aitutor-info-50); color: var(--aitutor-info-700); border: 1px solid var(--aitutor-info-200); }
.tag--info:hover { filter: brightness(1.05); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">Default</span><span class="tag tag--default">数学</span><span class="tag tag--default">物理</span><span class="tag tag--default">化学</span><span class="tag tag--default">英语</span></div>
<div class="row"><span class="label">Default</span><span class="tag tag--default">导数与切线</span><span class="tag tag--default">三角函数</span></div>
<hr class="divider">
<div class="row"><span class="label">Subject</span><span class="tag tag--primary">数学</span><span class="tag tag--blue">物理</span><span class="tag tag--success">化学</span><span class="tag tag--info">英语</span></div>
<div class="row"><span class="label">Topic</span><span class="tag tag--primary">导数与切线</span><span class="tag tag--blue">三角函数</span></div>
</body>
</html>
