version: '3.8'

services:
  app:
    image: aitutor:v1.0.0
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - SERVE_F3=true
      - JWT_SECRET=${JWT_SECRET}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - PORT=3000
      # 2026-09-22 (凭据轮换报告 B4): 口令不再用字面量默认值, 改读 .env 的
      # POSTGRES_PASSWORD, 两处必须一致; 缺失即启动失败 (compose 自动加载 .env)。
      - DATABASE_URL=postgresql://aitutor:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@db:5432/aitutor_db
      - REDIS_URL=redis://redis:6379
      # D068 (2026-08-17): Override .env — use Windows host IP, not host.docker.internal
      - OLLAMA_URL=http://172.21.144.1:11434
      - EMBEDDING_BASE_URL=http://172.21.144.1:11434
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=bge-m3
      - EMBEDDING_DIMS=1024
    volumes:
      - app-data:/app/database
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aitutor-network

  db:
    build:
      context: .
      network: host
      dockerfile: Dockerfile.db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=aitutor_db
      - POSTGRES_USER=aitutor
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitutor -d aitutor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - aitutor-network
    command: >
      postgres
      -c shared_preload_libraries='age,vector'
      -c max_locks_per_transaction=64
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c effective_cache_size=4GB
      -c synchronous_commit=off
      -c log_min_duration_statement=5000

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aitutor-network

volumes:
  app-data:
  pgdata:
  redisdata:

networks:
  aitutor-network:
    driver: bridge
