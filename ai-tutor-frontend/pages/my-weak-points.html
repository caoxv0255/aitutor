<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base" content="">
    <title>薄弱点分析 - AI Tutor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/aitutor.css">
    <link rel="stylesheet" href="../assets/css/brand.css">
    <link rel="stylesheet" href="../assets/css/router.css">
    <style type="text/tailwindcss">
@theme inline {
  --color-primary-500: #d71920;
  --color-primary-600: #b8151b;
  --color-success-500: #059669;
  --color-warning-500: #f59e0b;
  --color-error-500: #ef4444;
  --color-info-500: #0284c7;
  --color-foreground: #0b1220;
  --color-muted-foreground: #6b7280;
  --color-surface: #ffffff;
  --color-surface-container-low: #f6f8fa;
  --color-border: #e5e7eb;
  --color-border-light: #f1f3f5;
}
    </style>
<script>
      // D-Bug-D v3 (2026-08-24): F3 用 'aitutor.token', frontend 旧页用 'token'. 同步.
      (function() {
        const newTok = localStorage.getItem('aitutor.token');
        if (newTok && !localStorage.getItem('token')) {
          localStorage.setItem('token', newTok);
        }
        const newUser = localStorage.getItem('aitutor.user');
        if (newUser && !localStorage.getItem('currentUser')) {
          localStorage.setItem('currentUser', newUser);
        }
      })();
    </script>
</head>
<body class="min-h-screen p-4" style="background:var(--color-surface);color:var(--color-foreground)">
    <div class="lg:ml-60 md:ml-[72px] min-h-screen" style="background:var(--color-surface);color:var(--color-foreground)">

<div class="weak-wrap">
  <div class="weak-header">
    <h1>我的薄弱点分析</h1>
    <p>基于错题记录，分析各知识点的薄弱程度，精准定位提升方向</p>
  </div>

  <div id="loadingState" class="loading-state">正在分析您的错题数据...</div>
  <div id="errorState" class="error-state" style="display:none"></div>
  <div id="mainContent" style="display:none">
    <div class="weak-summary" id="summaryCards"></div>

    <div class="weak-list" id="weakList"></div>

    <div class="generate-bar">
      <p style="margin-bottom:16px;color:var(--text-muted);font-size:.9rem">选择学科，基于薄弱点生成个性化预测卷</p>
      <div class="subject-select" id="subjectSelect">
        <button class="subject-btn active" data-subject="math">数学</button>
        <button class="subject-btn" data-subject="chinese">语文</button>
        <button class="subject-btn" data-subject="english">英语</button>
        <button class="subject-btn" data-subject="physics">物理</button>
        <button class="subject-btn" data-subject="chemistry">化学</button>
        <button class="subject-btn" data-subject="politics">政治</button>
      </div>
      <button class="generate-btn" id="generateBtn">🧬 生成个性化预测卷</button>
    </div>
  </div>
</div>

<script>
(function() {
  const token = localStorage.getItem('token');
  if (!token) { location.href = 'login.html'; return; }

  const mainContent = document.getElementById('mainContent');
  const loadingState = document.getElementById('loadingState');
  const errorState = document.getElementById('errorState');
  let selectedSubject = 'math';

  const subjectNames = {
    math: '数学', chinese: '语文', english: '英语',
    physics: '物理', chemistry: '化学', politics: '政治'
  };

  // Subject buttons
  document.getElementById('subjectSelect').addEventListener('click', function(e) {
    if (e.target.classList.contains('subject-btn')) {
      document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      selectedSubject = e.target.dataset.subject;
      renderWeakPoints(allWeakPoints);
    }
  });

  let allWeakPoints = [];

  async function fetchWeakPoints() {
    try {
      const res = await fetch('/api/weak-points', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        location.href = 'login.html';
        return;
      }
      if (!res.ok) throw new Error('获取薄弱点数据失败');
      const data = await res.json();
      allWeakPoints = data.weak_points || [];
      loadingState.style.display = 'none';
      mainContent.style.display = 'block';
      renderWeakPoints(allWeakPoints);
    } catch (err) {
      loadingState.style.display = 'none';
      errorState.style.display = 'block';
      errorState.textContent = err.message;
    }
  }

  function renderWeakPoints(points) {
    const filtered = points.filter(p => p.subject === selectedSubject);
    const totalWrong = filtered.reduce((sum, p) => sum + p.error_count, 0);
    const topKP = filtered.length > 0 ? filtered[0] : null;

    // Summary cards
    document.getElementById('summaryCards').innerHTML = `
      <div class="summary-card">
        <div class="num">${filtered.length}</div>
        <div class="label">薄弱知识点数</div>
      </div>
      <div class="summary-card">
        <div class="num">${totalWrong}</div>
        <div class="label">关联错题数</div>
      </div>
      <div class="summary-card">
        <div class="num">${topKP ? topKP.name : '无'}</div>
        <div class="label">最薄弱知识点</div>
      </div>
    `;

    const list = document.getElementById('weakList');
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div><p>该学科暂无薄弱点记录<br>做更多练习后将自动分析</p></div>';
      return;
    }

    list.innerHTML = filtered.map(function(wp) {
      const subtopics = (wp.subtopics || []).map(s => {
        const cls = wp.difficulty >= 5 ? 'diff-5' : (wp.difficulty >= 4 ? 'diff-4' : 'diff-3');
        return '<span class="' + cls + '">' + s + '</span>';
      }).join('');

      const samples = (wp.sample_questions || []).map(sq =>
        '<div class="sample-item">📝 ' + (sq.content || '').substring(0, 60) + '...</div>'
      ).join('');

      return '<div class="weak-card">' +
        '<div class="weak-card-header">' +
          '<div class="weak-card-name">' + wp.name + '</div>' +
          '<div class="weak-card-count">错 ' + wp.error_count + ' 次</div>' +
        '</div>' +
        '<div class="weak-card-meta">' +
          '<span>难度等级: ' + wp.difficulty + '/5</span>' +
          '<span>考试频率: ' + (wp.frequency || 'medium') + '</span>' +
        '</div>' +
        (wp.description ? '<div style="font-size:.85rem;color:var(--text-muted);margin-bottom:10px">' + wp.description + '</div>' : '') +
        '<div class="weak-card-subtopics">' + subtopics + '</div>' +
        (samples ? '<div class="weak-card-samples"><h4>关联错题</h4>' + samples + '</div>' : '') +
      '</div>';
    }).join('');
  }

  // Generate paper button — P0-fix (2026-08-24)
  // 原调 /api/generate-paper (compat 给 410). 改用 tutor.ask() service 走
  // /api/tutor/ask 调 LLM 生成预测卷, 响应作为 paper content 写入 sessionStorage.
  // 走 service 统一 envelope + 401 处理 + mock toggle, 避免与 service 层形态分裂.
  document.getElementById('generateBtn').addEventListener('click', async function() {
    const btn = this;
    btn.disabled = true;
    btn.textContent = '⏳ 正在生成...';

    try {
      // 收集当前学科的薄弱知识点 (限 5 个, 避免 prompt 过长)
      const subjectWeakPoints = allWeakPoints
        .filter(p => p.subject === selectedSubject)
        .slice(0, 5)
        .map(p => p.name);
      const weakText = subjectWeakPoints.length
        ? `薄弱知识点: ${subjectWeakPoints.join('、')}`
        : '无明确薄弱知识点';

      const prompt = `请为${selectedSubjectName}学科设计一份 3 题个性化预测卷, 主题: ${weakText}. ` +
        `每题包含: 题干(2-3 句), 选项(选择题 4 个), 答案, 解析. ` +
        `格式: Markdown 标题 + 每题 ## 题目N, ### 题干, ### 选项, ### 答案, ### 解析.`;

      // P0-fix (2026-08-24): 走 service 层 (统一 envelope / mock toggle / 401 handling)
      const { tutor } = await import('../assets/js/api/services/tutor.js');
      const env = await tutor.ask({ question: prompt, subject: selectedSubject });
      // service 统一返回 envelope {success, message, data}, 直接读 data.response
      const paperContent = env?.data?.response || '生成失败, 无内容';
      // 写入 sessionStorage, 让 personalized-paper.html 读
      sessionStorage.setItem('generatedPaper', JSON.stringify({
        subject: selectedSubject,
        subject_name: subjectNames[selectedSubject] || selectedSubject,
        content: paperContent,
        weak_points: subjectWeakPoints,
        created_at: new Date().toISOString()
      }));
      location.href = 'personalized-paper.html?from=generate';
    } catch (err) {
      alert('生成失败: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '🧬 生成个性化预测卷';
    }
  });

  fetchWeakPoints();
})();
</script>


<script type="module">
      import { mount } from '../assets/js/navator.js';
      mount({ active: 'home' });
    </script>
    </div>
</body>
</html>
