<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI tutor - 拍照搜题</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {

    --color-success-900: #022c22;
    --color-warning-50: #fffbeb;
    --color-warning-100: #fef3c7;
    --color-warning-200: #fde68a;
    --color-warning-300: #fcd34d;
    --color-warning-400: #fbbf24;

    --color-warning-600: #d97706;
    --color-warning-700: #b45309;
    --color-warning-800: #92400e;
    --color-warning-900: #78350f;
    --color-error-50: #fef2f2;
    --color-error-100: #fee2e2;
    --color-error-200: #fecaca;
    --color-error-300: #fca5a5;
    --color-error-400: #f87171;
    --color-error-500: #ef4444;
    --color-error-600: #dc2626;
    --color-error-700: #b91c1c;
    --color-error-800: #991b1b;
    --color-error-900: #7f1d1d;
    --color-info-50: #f0f9ff;
    --color-info-100: #e0f2fe;
    --color-info-200: #bae6fd;
    --color-info-300: #7dd3fc;
    --color-info-400: #38bdf8;
    --color-info-500: #0284c7;
    --color-info-600: #0369a1;
    --color-info-700: #075985;
    --color-info-800: #0c4a6e;
    --color-info-900: #082f49;
    --color-orange-50: #fff7ed;
    --color-orange-100: #ffedd5;
    --color-orange-200: #fed7aa;
    --color-orange-300: #fdba74;
    --color-orange-400: #fb923c;
    --color-orange-500: #f97316;
    --color-orange-600: #ea580c;
    --color-orange-700: #c2410c;
    --color-yellow-50: #fefce8;
    --color-yellow-100: #fef9c3;
    --color-yellow-400: #facc15;
    --color-yellow-500: #eab308;
    --color-yellow-600: #ca8a04;
    --color-green-50: #f0fdf4;
    --color-green-100: #dcfce7;
    --color-green-200: #bbf7d0;
    --color-green-400: #4ade80;
    --color-green-500: #22c55e;
    --color-green-600: #16a34a;
    --color-green-700: #15803d;
    --color-purple-50: #f5f3ff;
    --color-purple-100: #ede9fe;
    --color-purple-200: #ddd6fe;
    --color-purple-300: #c4b5fd;
    --color-purple-400: #a78bfa;
    --color-purple-500: #8b5cf6;
    --color-purple-600: #7c3aed;
    --color-surface: #ffffff;
    --color-surface-secondary: #f8f9fb;
    --color-surface-tertiary: #f1f5f9;
    --color-surface-dark: #1a1d27;
    --color-surface-darker: #12141c;
    --color-surface-code: #1e293b;
    --color-surface-container-high: #2a2d38;
    --color-overlay: #000000;
    --color-foreground: #0f172a;
    --color-foreground-secondary: #475569;
    --color-foreground-muted: #94a3b8;
    --color-border: #e2e8f0;
    --color-border-light: #f1f5f9;
    --font-display: 'DM Sans', 'Noto Sans SC', sans-serif;
    --font-sans: 'Noto Sans SC', 'DM Sans', sans-serif;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 16px;
    --radius-pill: 9999px;
    --shadow-card: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-hover: 0 4px 8px -2px rgb(0 0 0 / 0.10);
    --color-on-dark: #f8fafc;
    --color-subject-chinese: #d71920;
    --color-subject-math: #2563eb;
    --color-subject-english: #7c3aed;
    --color-subject-physics: #0284c7;

    --shadow-float: 0 8px 24px -8px rgb(0 0 0 / 0.18);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

</head>
<body class="min-h-screen font-sans antialiased">
  <main class="min-h-screen bg-surface-secondary" style="font-family:DM Sans,Noto Sans SC,sans-serif;">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
      <section class="mb-6">
        <span class="ait-badge ait-badge-primary">F4 Vision · 真后端</span>
        <h1 class="mt-2 text-2xl font-bold text-foreground">拍照搜题</h1>
        <p class="mt-1 text-[13px] text-foreground-secondary">提交题目照片，自动 OCR + 智能解析 + 拍照即入库</p>
      </section>

      <!-- 上传卡片 -->
      <section class="bg-surface rounded-2xl border border-border shadow-sm p-5 mb-5">
        <div class="flex flex-wrap items-center gap-3 mb-3">
          <label class="inline-flex items-center gap-2 h-10 px-4 rounded-[10px] bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium cursor-pointer transition-colors">
            <i data-lucide="image" class="w-4 h-4"></i>
            <span>从相册选图片</span>
            <input id="vision-file" type="file" accept="image/*" class="hidden" />
          </label>
          <label class="inline-flex items-center gap-2 h-10 px-4 rounded-[10px] bg-surface-tertiary hover:bg-border text-foreground text-sm font-medium cursor-pointer transition-colors">
            <i data-lucide="camera" class="w-4 h-4"></i>
            <span>拍摄</span>
            <input id="vision-camera" type="file" accept="image/*" capture="environment" class="hidden" />
          </label>
          <span class="text-[12px] text-foreground-muted">支持 JPG / PNG / WEBP，单张 ≤ 10MB</span>
        </div>

        <!-- 学科 + 知识点选择 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <label class="block">
            <span class="text-[12px] text-foreground-secondary mb-1 block">学科（可选，默认自动识别）</span>
            <select id="vision-subject" class="w-full h-10 rounded-[10px] border border-border bg-surface px-3 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary-500/30">
            </select>
          </label>
          <label class="block">
            <span class="text-[12px] text-foreground-secondary mb-1 block">知识点（可选，按学科过滤）</span>
            <select id="vision-kp" class="w-full h-10 rounded-[10px] border border-border bg-surface px-3 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary-500/30">
              <option value="">请先选择学科</option>
            </select>
          </label>
        </div>

        <div id="vision-preview" class="rounded-xl border border-dashed border-border bg-surface-secondary/40 min-h-[180px] flex items-center justify-center text-foreground-muted text-sm">
          此处显示已选中的图片预览
        </div>
      </section>

      <!-- Phase-E-fix (2026-08-24): 整卷 OCR 上传卡片 -->
      <section class="bg-surface rounded-2xl border border-border shadow-sm p-5 mb-5">
        <div class="flex items-center gap-2 mb-1">
          <span class="ait-badge ait-badge-primary">Phase E · 整卷 OCR</span>
          <span class="text-[12px] text-foreground-muted">多图 / 多页 PDF / 整份试卷一键上传</span>
        </div>
        <h2 class="text-lg font-semibold text-foreground mb-3 flex items-center gap-2">
          <i data-lucide="layers" class="w-5 h-5 text-primary-500"></i>
          整卷上传
        </h2>

        <!-- Photo mode + File mode toggle -->
        <div class="flex flex-wrap items-center gap-3 mb-3">
          <label class="inline-flex items-center gap-2 h-10 px-4 rounded-[10px] bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium cursor-pointer transition-colors">
            <i data-lucide="image-plus" class="w-4 h-4"></i>
            <span>选择多张图片</span>
            <input id="vision-batch-files" type="file" accept="image/*" multiple class="hidden" />
          </label>
          <label class="inline-flex items-center gap-2 h-10 px-4 rounded-[10px] bg-surface-tertiary hover:bg-border text-foreground text-sm font-medium cursor-pointer transition-colors">
            <i data-lucide="file-text" class="w-4 h-4"></i>
            <span>上传 PDF</span>
            <input id="vision-batch-pdf" type="file" accept="application/pdf" class="hidden" />
          </label>
          <span class="text-[12px] text-foreground-muted">最多 20 张，单张 ≤ 10MB</span>
          <button id="vision-batch-clear" type="button" class="hidden inline-flex items-center gap-1 h-8 px-2.5 rounded-[8px] text-[12px] bg-surface-tertiary hover:bg-border text-foreground-secondary">
            <i data-lucide="x" class="w-3 h-3"></i> 清空
          </button>
        </div>

        <!-- 已选文件预览网格 -->
        <div id="vision-batch-preview" class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-3 min-h-[60px]">
          <div class="col-span-full text-[12px] text-foreground-muted text-center py-4">尚未选择文件</div>
        </div>

        <!-- 进度条 -->
        <div id="vision-batch-progress" class="hidden mb-3">
          <div class="flex items-center justify-between text-[12px] text-foreground-secondary mb-1">
            <span id="vision-batch-progress-text">上传中 (0/0)</span>
            <span id="vision-batch-progress-pct" class="text-foreground-muted">0%</span>
          </div>
          <div class="h-2 w-full bg-surface-tertiary rounded-full overflow-hidden">
            <div id="vision-batch-progress-bar" class="h-full bg-primary-500 transition-all duration-200" style="width:0%"></div>
          </div>
        </div>

        <!-- 操作按钮 -->
        <div class="flex flex-wrap items-center gap-3">
          <button id="vision-batch-submit" type="button" disabled class="inline-flex items-center gap-2 h-10 px-4 rounded-[10px] bg-primary-500 hover:bg-primary-600 disabled:bg-surface-tertiary disabled:text-foreground-muted text-white text-sm font-medium transition-colors">
            <i data-lucide="zap" class="w-4 h-4"></i>
            <span>开始整卷解析</span>
          </button>
          <button id="vision-batch-ingest" type="button" disabled class="hidden inline-flex items-center gap-2 h-10 px-4 rounded-[10px] bg-success-500 hover:bg-success-600 disabled:bg-surface-tertiary disabled:text-foreground-muted text-white text-sm font-medium transition-colors">
            <i data-lucide="bookmark-plus" class="w-4 h-4"></i>
            <span>批量加入错题本 (<span id="vision-batch-ingest-count">0</span>)</span>
          </button>
        </div>
      </section>

      <!-- Phase-E-fix (2026-08-24): 整卷结果卡片 (聚合展示) -->
      <section id="vision-batch-result-card" class="bg-surface rounded-2xl border border-border shadow-sm p-5 mb-5 hidden">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold text-foreground flex items-center gap-2">
            <i data-lucide="check-circle-2" class="w-5 h-5 text-success-500"></i>
            整卷解析结果
          </h2>
          <div id="vision-batch-summary" class="text-[12px] text-foreground-secondary"></div>
        </div>
        <div id="vision-batch-questions" class="space-y-2"></div>
        <div id="vision-batch-failed-wrap" class="hidden mt-4 pt-4 border-t border-border-light">
          <div class="text-[13px] font-medium text-error-600 mb-2 flex items-center gap-1.5">
            <i data-lucide="alert-triangle" class="w-4 h-4"></i>
            解析失败 (<span id="vision-batch-failed-count">0</span>)
          </div>
          <div id="vision-batch-failed" class="space-y-1.5"></div>
        </div>
      </section>

      <!-- 状态卡片 -->
      <section id="vision-status-card" class="bg-surface rounded-2xl border border-border shadow-sm p-5 mb-5 hidden">
        <div class="flex items-center gap-2 text-sm text-foreground-secondary">
          <i data-lucide="loader" class="w-4 h-4 animate-spin text-primary-500"></i>
          <span id="vision-status-text">识别中…</span>
        </div>
      </section>

      <!-- 结果卡片 -->
      <section id="vision-result-card" class="bg-surface rounded-2xl border border-border shadow-sm p-5 mb-5 hidden">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold text-foreground flex items-center gap-2">
            <i data-lucide="file-text" class="w-5 h-5 text-primary-500"></i>
            识别结果
          </h2>
          <button id="vision-add-wrong" type="button" class="inline-flex items-center gap-1.5 h-9 px-3 rounded-[10px] text-[13px] font-medium bg-primary-500 hover:bg-primary-600 text-white transition-colors">
            <i data-lucide="bookmark-plus" class="w-4 h-4"></i>
            一键加入错题本
          </button>
        </div>
        <div id="vision-meta" class="flex flex-wrap gap-2 mb-3"></div>
        <div id="vision-raw-text" class="prose prose-sm max-w-none text-foreground whitespace-pre-wrap leading-relaxed"></div>
        <div id="vision-formulas" class="mt-3 hidden">
          <div class="text-[12px] font-medium text-foreground-secondary mb-1">识别公式</div>
          <pre id="vision-formulas-text" class="bg-surface-tertiary rounded-lg p-3 text-[13px] text-foreground overflow-x-auto"></pre>
        </div>
      </section>

      <!-- 历史记录 -->
      <section id="vision-history-card" class="bg-surface rounded-2xl border border-border shadow-sm p-5 hidden">
        <h2 class="text-sm font-semibold text-foreground mb-3 flex items-center gap-2">
          <i data-lucide="history" class="w-4 h-4 text-foreground-secondary"></i>
          历史记录
        </h2>
        <div id="vision-history-list" class="space-y-2 text-[13px] text-foreground-secondary"></div>
      </section>
    </div>
  </main>

  <script type="module">
    import { vision, wrong } from "../assets/js/api/services/index.js";
    import { mountErrorBoundary } from "../assets/js/components/error-boundary.js";
    import { setUseMock } from "../assets/js/api/USE_MOCK.js";
    import { mount as mountNav } from "../assets/js/navator.js";
    import { useAsyncResource } from "../assets/js/hooks/useAsyncResource.js";
    import { toast } from "../assets/js/toast.js";

    mountErrorBoundary();
    setUseMock(false);  // F4: vision 真后端 (2026-08-15, parse + knowledge-points 已对齐)
    mountNav("vision");

    const SUBJECTS = [
      { code: "", name: "自动识别" },
      { code: "math", name: "数学" },
      { code: "chinese", name: "语文" },
      { code: "english", name: "英语" },
      { code: "physics", name: "物理" },
      { code: "chemistry", name: "化学" },
      { code: "biology", name: "生物" },
      { code: "history", name: "历史" },
      { code: "geography", name: "地理" },
      { code: "politics", name: "政治" },
    ];
    const TYPE_LABELS = {
      choice: "选择题", multi_choice: "多选题", fill: "填空题", short_answer: "简答题",
      calculation: "计算题", proof: "证明题", experiment: "实验题", essay: "作文题",
      reading: "阅读理解", other: "其他",
    };
    const HISTORY_KEY = "aitutor.vision.history";
    const MAX_HISTORY = 10;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const fileEl = $("vision-file");
    const camEl = $("vision-camera");
    const previewEl = $("vision-preview");
    const statusCard = $("vision-status-card");
    const statusText = $("vision-status-text");
    const resultCard = $("vision-result-card");
    const metaEl = $("vision-meta");
    const rawTextEl = $("vision-raw-text");
    const formulasWrap = $("vision-formulas");
    const formulasText = $("vision-formulas-text");
    const addBtn = $("vision-add-wrong");
    const historyCard = $("vision-history-card");
    const historyList = $("vision-history-list");
    const subjectSel = $("vision-subject");
    const kpSel = $("vision-kp");

    const state = { selectedSubject: "", selectedKpId: "", lastParse: null };

    // ---------- history (localStorage, F3 tutor 同款模式) ----------
    function loadHistory() {
      try { const h = JSON.parse(localStorage.getItem(HISTORY_KEY)); return Array.isArray(h) ? h : []; } catch { return []; }
    }
    function saveHistory(h) {
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, MAX_HISTORY))); } catch { /* quota */ }
    }
    function renderHistory() {
      const h = loadHistory();
      if (h.length === 0) { historyCard.classList.add("hidden"); return; }
      historyCard.classList.remove("hidden");
      historyList.innerHTML = h.map((it, idx) => `
        <div class="flex items-center justify-between gap-3 py-2 border-b border-border last:border-0">
          <div class="min-w-0">
            <div class="text-[12px] text-foreground-muted">${new Date(it.ts).toLocaleString("zh-CN")}${it.subject ? " · " + esc(it.subject) : ""}</div>
            <div class="truncate">${esc((it.summary || "(空)").slice(0, 80))}</div>
          </div>
          <span class="shrink-0 text-[11px] text-foreground-muted">#${h.length - idx}</span>
        </div>`).join("");
    }
    function pushHistory(entry) { const h = loadHistory(); h.unshift(entry); saveHistory(h); renderHistory(); }

    // ---------- subject + knowledge point dropdown ----------
    SUBJECTS.forEach((s) => {
      const o = document.createElement("option");
      o.value = s.code;
      o.textContent = s.name;
      subjectSel.appendChild(o);
    });

    const kpRes = useAsyncResource(() => {
      if (!state.selectedSubject) return Promise.resolve({ success: true, data: { items: [], total: 0 } });
      return vision.getKnowledgePoints({ subject: state.selectedSubject });
    });
    kpRes.subscribe(({ data, loading }) => {
      if (loading || !data) return;
      // real: data = {items, total}; mock: data = {success, data: {items}} → 归一化
      const body = (data && data.data) ? data.data : data;
      const items = Array.isArray(body) ? body : ((body && body.items) || []);
      const keep = state.selectedKpId && items.some((k) => String(k.id) === String(state.selectedKpId));
      kpSel.innerHTML = `<option value="">${state.selectedSubject ? "自动识别知识点" : "请先选择学科"}</option>` +
        items.map((k) => `<option value="${esc(k.id)}">${esc(k.name)}</option>`).join("");
      if (keep) kpSel.value = state.selectedKpId;
    });

    subjectSel.addEventListener("change", () => {
      state.selectedSubject = subjectSel.value;
      state.selectedKpId = "";
      kpRes.refetch();
    });
    kpSel.addEventListener("change", () => { state.selectedKpId = kpSel.value; });

    // ---------- upload + parse ----------
    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    function renderResult(parse, ingest) {
      resultCard.classList.remove("hidden");
      rawTextEl.textContent = parse.raw_text || "(未识别到文本)";
      const subjectName = SUBJECTS.find((s) => s.code === parse.subject_code)?.name || parse.subject_code || "未识别";
      const chips = [
        { label: "学科", value: subjectName },
        { label: "难度", value: parse.difficulty ? "★".repeat(Math.max(1, Math.min(5, parse.difficulty))) : "—" },
        { label: "题型", value: TYPE_LABELS[parse.question_type] || parse.question_type || "—" },
        { label: "知识点", value: parse.inferred_kp_id || "自动匹配中" },
        { label: "入库", value: ingest && ingest.success ? "✅ 已入库" : "⚠️ 未入库" },
      ];
      metaEl.innerHTML = chips.map((c) => `
        <span class="inline-flex items-center gap-1 rounded-full bg-surface-tertiary px-2.5 py-1 text-[12px] text-foreground-secondary">
          <span class="text-foreground-muted">${esc(c.label)}</span>${esc(c.value)}
        </span>`).join("");
      const formulas = Array.isArray(parse.latex_formulas) ? parse.latex_formulas : [];
      if (formulas.length > 0) {
        formulasWrap.classList.remove("hidden");
        formulasText.textContent = formulas.join("\n");
      } else {
        formulasWrap.classList.add("hidden");
      }
    }

    async function handleFile(file) {
      if (!file) return;
      if (!file.type.startsWith("image/")) { toast.error("请选择图片文件"); return; }
      const dataUrl = await readFileAsDataURL(file);
      previewEl.innerHTML = `<img src="${dataUrl}" alt="预览" class="max-h-[280px] rounded-xl mx-auto" />`;
      resultCard.classList.add("hidden");
      formulasWrap.classList.add("hidden");
      statusCard.classList.remove("hidden");
      statusText.textContent = "识别中… (多模态解析可能需要 10-30 秒)";
      try {
        const base64 = dataUrl.split(",")[1];
        const res = await vision.parse({
          image: base64,
          subject: state.selectedSubject || undefined,
          knowledgePointId: state.selectedKpId || undefined,
          autoIngest: true,
        });
        // real: res = {parse, ingest}; mock: res = {success, data: {parse, ingest}} → 归一化
        const body = (res && res.data) ? res.data : res;
        const parse = (body && body.parse) || {};
        const ingest = (body && body.ingest) || null;
        state.lastParse = {
          raw_text: parse.raw_text || "",
          formulas: Array.isArray(parse.latex_formulas) ? parse.latex_formulas : [],
          difficulty: parse.difficulty,
          question_type: parse.question_type,
          inferred_kp_id: parse.inferred_kp_id,
          subject_code: parse.subject_code,
          ingest,
        };
        renderResult(parse, ingest);
        pushHistory({
          ts: Date.now(),
          summary: (parse.raw_text || "").slice(0, 60),
          subject: SUBJECTS.find((s) => s.code === parse.subject_code)?.name || "",
        });
        statusCard.classList.add("hidden");
        toast.success("识别完成");
      } catch (err) {
        console.error("[vision] parse error:", err);
        statusText.textContent = "识别失败: " + (err.message || "未知错误");
        toast.error("识别失败: " + (err.message || ""));
      }
    }

    fileEl.addEventListener("change", (e) => handleFile(e.target.files[0]));
    camEl.addEventListener("change", (e) => handleFile(e.target.files[0]));

    // ---------- 一键加入错题本 ----------
    addBtn.addEventListener("click", async () => {
      const p = state.lastParse;
      if (!p || !p.raw_text) { toast.error("请先提交一张图片"); return; }
      addBtn.disabled = true;
      try {
        const subjectName = SUBJECTS.find((s) => s.code === p.subject_code)?.name || "数学";
        const res = await wrong.createQuestion({
          question: p.raw_text.slice(0, 500),
          subject: subjectName,                    // backend 兼容 F3 字段 (subject → subject_code)
          answer: "",
          analysis: p.formulas.join("\n"),         // 公式作为解析
          difficulty: p.difficulty || 3,
          knowledge_point_id: p.inferred_kp_id || undefined,
          question_id: (p.ingest && p.ingest.rag_id) || undefined,
        });
        const body = (res && res.data) ? res.data : res;
        const newId = (body && body.id) || null;
        toast.success("已加入错题本, 正在跳转…");
        setTimeout(() => {
          window.location.href = "./wrong-book.html" + (newId ? "?highlight=" + encodeURIComponent(newId) : "");
        }, 600);
      } catch (err) {
        console.error("[vision] add-wrong error:", err);
        toast.error("加入失败: " + (err.message || ""));
      } finally {
        addBtn.disabled = false;
      }
    });

    renderHistory();

    // ────────────────────────────────────────────────────────────────────────
    // Phase E (2026-08-24): 整卷 OCR 多图上传 + 批量解析 + 批量入库
    //
    // 设计原则:
    //   - 单题失败不影响整批 (核心 UX)
    //   - 进度条 + 实时计数 (上传中 3/5)
    //   - 调用 vision.batchParse (F3 service envelope) + vision.batchIngest
    //   - 结果聚合展示 + 失败项单独高亮
    // ────────────────────────────────────────────────────────────────────────

    const batchFileEl = $("vision-batch-files");
    const batchPdfEl = $("vision-batch-pdf");
    const batchPreview = $("vision-batch-preview");
    const batchProgress = $("vision-batch-progress");
    const batchProgressBar = $("vision-batch-progress-bar");
    const batchProgressText = $("vision-batch-progress-text");
    const batchProgressPct = $("vision-batch-progress-pct");
    const batchSubmitBtn = $("vision-batch-submit");
    const batchIngestBtn = $("vision-batch-ingest");
    const batchIngestCount = $("vision-batch-ingest-count");
    const batchClearBtn = $("vision-batch-clear");
    const batchResultCard = $("vision-batch-result-card");
    const batchQuestions = $("vision-batch-questions");
    const batchSummary = $("vision-batch-summary");
    const batchFailedWrap = $("vision-batch-failed-wrap");
    const batchFailed = $("vision-batch-failed");
    const batchFailedCount = $("vision-batch-failed-count");

    const batchState = {
      files: [],            // [{ file, dataUrl, pageIndex }]
      questions: [],        // 解析成功的题
      failed: [],           // 解析失败的项
      busy: false,          // 是否正在解析中
    };

    function renderBatchPreview() {
      if (batchState.files.length === 0) {
        batchPreview.innerHTML = `<div class="col-span-full text-[12px] text-foreground-muted text-center py-4">尚未选择文件</div>`;
        batchSubmitBtn.disabled = true;
        batchClearBtn.classList.add("hidden");
        return;
      }
      batchPreview.innerHTML = batchState.files.map((f, idx) => `
        <div class="relative group rounded-lg overflow-hidden border border-border bg-surface-secondary aspect-square">
          <img src="${f.dataUrl}" alt="第 ${idx + 1} 张" class="w-full h-full object-cover" />
          <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent text-white text-[10px] px-1.5 py-0.5">#${idx + 1}</div>
        </div>
      `).join("");
      batchSubmitBtn.disabled = batchState.busy;
      batchClearBtn.classList.remove("hidden");
    }

    function setBatchProgress(current, total, label) {
      const pct = total > 0 ? Math.round((current / total) * 100) : 0;
      batchProgress.classList.remove("hidden");
      batchProgressBar.style.width = pct + "%";
      batchProgressText.textContent = label || `上传中 (${current}/${total})`;
      batchProgressPct.textContent = pct + "%";
    }

    function hideBatchProgress() { batchProgress.classList.add("hidden"); }

    async function filesToDataUrls(files) {
      const out = [];
      for (let i = 0; i < files.length; i++) {
        const dataUrl = await readFileAsDataURL(files[i]);
        out.push({ file: files[i], dataUrl, pageIndex: i + 1 });
      }
      return out;
    }

    async function handleBatchFiles(fileList) {
      if (batchState.busy) return;
      const files = Array.from(fileList || []);
      const imageFiles = files.filter((f) => f.type.startsWith("image/"));
      if (imageFiles.length === 0) {
        toast.error("请选择图片文件");
        return;
      }
      const remaining = 20 - batchState.files.length;
      if (imageFiles.length > remaining) {
        toast.warning(`最多 20 张, 已截取前 ${remaining} 张`);
      }
      const toAdd = imageFiles.slice(0, remaining);
      batchState.busy = true;
      try {
        const newOnes = await filesToDataUrls(toAdd);
        batchState.files = batchState.files.concat(newOnes);
        renderBatchPreview();
        toast.success(`已添加 ${toAdd.length} 张图片 (共 ${batchState.files.length} 张)`);
      } catch (err) {
        toast.error("文件读取失败: " + err.message);
      } finally {
        batchState.busy = false;
      }
    }

    async function handleBatchPdf(file) {
      if (!file) return;
      if (file.type !== "application/pdf") {
        toast.error("请选择 PDF 文件");
        return;
      }
      // Phase-E-fix (2026-08-24): PDF → 图片依赖 pdf.js, 当前 MVP 简化处理 —
      // 提示用户"PDF 多页功能开发中", 引导先拆分为图片上传.
      // 真实场景下应使用 pdfjs-dist render → canvas → base64.
      toast.warn("PDF 多页解析需 pdf.js, MVP 当前推荐拆分为图片上传");
      // 清空 input, 避免重复触发
      batchPdfEl.value = "";
    }

    function renderBatchResults() {
      const { questions, failed } = batchState;
      if (questions.length === 0 && failed.length === 0) {
        batchResultCard.classList.add("hidden");
        return;
      }
      batchResultCard.classList.remove("hidden");
      batchSummary.textContent = `成功 ${questions.length} / 失败 ${failed.length} / 总计 ${questions.length + failed.length}`;
      batchIngestCount.textContent = String(questions.length);
      batchIngestBtn.disabled = questions.length === 0;

      if (questions.length === 0) {
        batchQuestions.innerHTML = `<div class="text-[13px] text-foreground-muted text-center py-4">暂无成功解析的题目</div>`;
      } else {
        batchQuestions.innerHTML = questions.map((q) => {
          const subjectName = SUBJECTS.find((s) => s.code === q.subject_code)?.name || q.subject_code || "未识别";
          return `
            <div class="flex items-start gap-3 py-2 px-3 rounded-lg bg-surface-tertiary/50">
              <div class="shrink-0 inline-flex items-center justify-center w-7 h-7 rounded-full bg-primary-500/10 text-primary-600 text-[12px] font-medium">#${esc(q.pageIndex)}</div>
              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2 text-[11px] text-foreground-secondary mb-1">
                  <span class="font-medium text-foreground">${esc(subjectName)}</span>
                  <span>·</span>
                  <span>难度 ${"★".repeat(Math.max(1, Math.min(5, q.difficulty || 1)))}</span>
                  <span>·</span>
                  <span>${esc(TYPE_LABELS[q.question_type] || q.question_type || "其他")}</span>
                  <span>·</span>
                  <span class="text-foreground-muted">${esc(q.inferred_kp_id || "未匹配知识点")}</span>
                </div>
                <div class="text-[13px] text-foreground line-clamp-2">${esc((q.raw_text || "").slice(0, 120))}</div>
              </div>
            </div>
          `;
        }).join("");
      }

      if (failed.length === 0) {
        batchFailedWrap.classList.add("hidden");
      } else {
        batchFailedWrap.classList.remove("hidden");
        batchFailedCount.textContent = String(failed.length);
        batchFailed.innerHTML = failed.map((f) => `
          <div class="flex items-center gap-2 py-1.5 px-3 rounded-md bg-error-50 text-[12px] text-error-700">
            <i data-lucide="x-circle" class="w-3.5 h-3.5"></i>
            <span>第 ${esc(f.pageIndex)} 张:</span>
            <span class="truncate">${esc(f.error || "未知错误")}</span>
          </div>
        `).join("");
      }
      // Re-render lucide icons (for failed items)
      if (window.lucide) window.lucide.createIcons();
    }

    async function submitBatchParse() {
      if (batchState.files.length === 0 || batchState.busy) return;
      batchState.busy = true;
      batchSubmitBtn.disabled = true;
      batchIngestBtn.classList.add("hidden");
      batchResultCard.classList.add("hidden");
      const total = batchState.files.length;
      try {
        // Step 1: 上传图片 (模拟进度)
        for (let i = 0; i < total; i++) {
          await new Promise((r) => setTimeout(r, 30)); // 让 UI 跟上
          setBatchProgress(i + 1, total, `上传中 (${i + 1}/${total})`);
        }

        // Step 2: 调 batchParse
        setBatchProgress(total, total, `整卷解析中 (${total} 张图片)...`);
        const images = batchState.files.map((f, i) => {
          const base64 = (f.dataUrl.split(",")[1] || "").trim();
          return {
            data: base64,
            subject: state.selectedSubject || null,
            pageIndex: f.pageIndex,
          };
        });
        const res = await vision.batchParse({
          images,
          userHint: { default_subject: state.selectedSubject || null },
          options: { concurrency: 3 },
        });
        const body = (res && res.data) ? res.data : res;
        batchState.questions = Array.isArray(body?.questions) ? body.questions : [];
        batchState.failed = Array.isArray(body?.failed) ? body.failed : [];

        renderBatchResults();
        batchIngestBtn.classList.remove("hidden");
        hideBatchProgress();
        const totalQ = batchState.questions.length + batchState.failed.length;
        toast.success(`整卷解析完成: 成功 ${batchState.questions.length} / 失败 ${batchState.failed.length}`);
        if (batchState.questions.length > 0) {
          pushHistory({
            ts: Date.now(),
            summary: `[整卷] ${batchState.questions.length}/${totalQ} 题`,
            subject: SUBJECTS.find((s) => s.code === state.selectedSubject)?.name || "",
          });
        }
      } catch (err) {
        console.error("[vision] batch parse error:", err);
        toast.error("整卷解析失败: " + (err.message || ""));
        hideBatchProgress();
      } finally {
        batchState.busy = false;
        batchSubmitBtn.disabled = batchState.files.length === 0;
      }
    }

    async function submitBatchIngest() {
      if (batchState.questions.length === 0) return;
      batchIngestBtn.disabled = true;
      try {
        const res = await vision.batchIngest({ questions: batchState.questions });
        const body = (res && res.data) ? res.data : res;
        const ok = body?.success_count ?? 0;
        const fail = body?.failed_count ?? 0;
        const mastery = body?.mastery_updates ?? 0;
        const srs = body?.srs_scheduled ?? 0;
        toast.success(`已入库 ${ok} 题 · mastery -10 × ${mastery} · SRS 调度 × ${srs}` + (fail > 0 ? ` · 失败 ${fail}` : ""));
        setTimeout(() => {
          window.location.href = "./wrong-book.html";
        }, 800);
      } catch (err) {
        console.error("[vision] batch ingest error:", err);
        toast.error("批量入库失败: " + (err.message || ""));
        batchIngestBtn.disabled = false;
      }
    }

    function clearBatch() {
      if (batchState.busy) return;
      batchState.files = [];
      batchState.questions = [];
      batchState.failed = [];
      renderBatchPreview();
      batchResultCard.classList.add("hidden");
      batchIngestBtn.classList.add("hidden");
      batchSubmitBtn.disabled = true;
      batchFileEl.value = "";
      batchPdfEl.value = "";
      hideBatchProgress();
      toast.info("已清空");
    }

    batchFileEl.addEventListener("change", (e) => handleBatchFiles(e.target.files));
    batchPdfEl.addEventListener("change", (e) => handleBatchPdf(e.target.files[0]));
    batchSubmitBtn.addEventListener("click", submitBatchParse);
    batchIngestBtn.addEventListener("click", submitBatchIngest);
    batchClearBtn.addEventListener("click", clearBatch);

    // 初始化预览
    renderBatchPreview();
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
