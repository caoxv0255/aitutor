                      style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                  </div>
                  <p id="reg-phone-error" class="hidden text-xs text-error-500 flex items-center gap-1" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                    <i data-lucide="alert-circle" class="w-3 h-3"></i>
                    <span>请输入正确的手机号</span>
                  </p>
                </div>

                <div class="space-y-1.5">
                  <label class="block text-sm font-medium text-foreground" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">验证码</label>
                  <div class="flex gap-2">
                    <div class="relative flex-1">
                      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i data-lucide="shield" class="w-[18px] h-[18px] text-foreground-muted"></i>
                      </div>
                      <input type="text" id="reg-code-input" placeholder="请输入验证码" maxlength="6"
                        class="w-full h-10 pl-10 pr-3.5 rounded-[8px] border border-border bg-surface text-foreground text-sm placeholder:text-foreground-muted focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 focus:outline-none transition-all"
                        style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                    </div>
                    <button type="button" id="reg-get-code-btn" class="h-10 px-4 shrink-0 rounded-[8px] border border-primary-500 text-primary-500 text-sm font-medium hover:bg-primary-50 transition-colors whitespace-nowrap" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                      获取验证码
                    </button>
                  </div>
                  <p id="reg-code-error" class="hidden text-xs text-error-500 flex items-center gap-1" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                    <i data-lucide="alert-circle" class="w-3 h-3"></i>
                    <span>请输入验证码</span>
                  </p>
                </div>

                <div class="space-y-1.5">
                  <label class="block text-sm font-medium text-foreground" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">密码</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <i data-lucide="lock" class="w-[18px] h-[18px] text-foreground-muted"></i>
                    </div>
                    <input type="password" id="reg-password-input" placeholder="请设置密码（6-20位）"
                      class="w-full h-10 pl-10 pr-11 rounded-[8px] border border-border bg-surface text-foreground text-sm placeholder:text-foreground-muted focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 focus:outline-none transition-all"
                      style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                    <button type="button" id="reg-toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-foreground-muted hover:text-foreground-secondary transition-colors">
                      <i id="reg-eye-open" data-lucide="eye" class="w-[18px] h-[18px]"></i>
                      <i id="reg-eye-closed" data-lucide="eye-off" class="w-[18px] h-[18px] hidden"></i>
                    </button>
                  </div>
                  <p id="reg-password-error" class="hidden text-xs text-error-500 flex items-center gap-1" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                    <i data-lucide="alert-circle" class="w-3 h-3"></i>
                    <span>密码长度需在6-20位之间</span>
                  </p>
                </div>

                <div class="space-y-1.5">
                  <label class="block text-sm font-medium text-foreground" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">确认密码</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <i data-lucide="lock-check" class="w-[18px] h-[18px] text-foreground-muted"></i>
                    </div>
                    <input type="password" id="reg-confirm-input" placeholder="请再次输入密码"
                      class="w-full h-10 pl-10 pr-3.5 rounded-[8px] border border-border bg-surface text-foreground text-sm placeholder:text-foreground-muted focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 focus:outline-none transition-all"
                      style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                  </div>
                  <p id="reg-confirm-error" class="hidden text-xs text-error-500 flex items-center gap-1" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                    <i data-lucide="alert-circle" class="w-3 h-3"></i>
                    <span>两次输入的密码不一致</span>
                  </p>
                </div>

                <label class="flex items-start gap-2 cursor-pointer select-none group pt-2">
                  <input type="checkbox" id="reg-agree" class="w-4 h-4 rounded-[4px] border-border text-primary-500 focus:ring-primary-500/20 accent-primary-500 cursor-pointer mt-0.5">
                  <span class="text-sm text-foreground-secondary group-hover:text-foreground transition-colors" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                    我已阅读并同意 <a href="#" class="text-primary-500 hover:text-primary-600">服务条款</a> 和 <a href="#" class="text-primary-500 hover:text-primary-600">隐私政策</a>
                  </span>
                </label>
                <p id="reg-agree-error" class="hidden text-xs text-error-500 flex items-center gap-1" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                  <i data-lucide="alert-circle" class="w-3 h-3"></i>
                  <span>请同意服务条款和隐私政策</span>
                </p>

                <button type="button" data-dom-id="reg-submit" class="reg-btn w-full h-12 mt-2 rounded-[14px] bg-primary-500 text-white text-[15px] font-semibold hover:bg-primary-600 active:scale-[0.99] transition-all shadow-[0_1px_2px_rgba(0,0,0,0.06)] hover:shadow-[0_4px_8px_rgba(215,25,32,0.25)] inline-flex items-center justify-center gap-2" style="font-family:'DM Sans','Noto Sans SC',sans-serif;">
                  <span class="reg-btn-text">注册</span>
                  <span class="reg-btn-loading hidden items-center gap-2">
                    <svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    注册中...
                  </span>
                </button>
              </div>

              <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-border-light"></div>
                <span class="text-xs text-foreground-muted shrink-0" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">或</span>
                <div class="flex-1 h-px bg-border-light"></div>
              </div>

              <div class="flex items-center justify-center gap-4">
                <button type="button" aria-label="微信登录" class="w-11 h-11 rounded-full bg-success-500 flex items-center justify-center text-white hover:bg-success-600 hover:shadow-[0_4px_8px_rgba(5,150,105,0.3)] transition-all">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>
                </button>
                <button type="button" aria-label="QQ登录" class="w-11 h-11 rounded-full bg-info-500 flex items-center justify-center text-white hover:bg-info-600 hover:shadow-[0_4px_8px_rgba(2,132,199,0.3)] transition-all">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M21.395 15.035a39.548 39.548 0 0 0-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.526 4.632 17.351 0 12 0S4.474 4.632 4.474 9.241c0 .274.013.804.014.836l-1.08 2.695a38.97 38.97 0 0 0-.802 2.264c-1.021 3.283-.69 4.543-.434 4.543.408 0 1.449-1.527 1.449-1.527 0 .904.466 2.091 1.491 2.957-.393.122-.872.309-1.19.554-.283.218-.25.453-.201.552.212.426 3.609.272 4.502-.129.004-.009.249-.124.16-.072 1.072.299 2.424.472 3.617.472 1.193 0 2.545-.173 3.618-.472l.16.072c.892.401 4.289.555 4.502.129.048-.099.082-.334-.201-.552a4.184 4.184 0 0 0-1.19-.554c1.025-.866 1.491-2.053 1.491-2.957 0 0 1.041 1.527 1.449 1.527.256 0 .587-1.26-.434-4.544z"/></svg>
                </button>
              </div>

              <p class="text-center text-sm text-foreground-secondary mt-8" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                已有账号？
                <a href="./login.html" class="text-primary-500 font-medium hover:text-primary-600 transition-colors">立即登录</a>
              </p>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function() {
          var togglePwd = document.getElementById('reg-toggle-password');
          var pwdInput = document.getElementById('reg-password-input');
          var eyeOpen = document.getElementById('reg-eye-open');
          var eyeClosed = document.getElementById('reg-eye-closed');

          togglePwd.addEventListener('click', function() {
            var isPwd = pwdInput.type === 'password';
            pwdInput.type = isPwd ? 'text' : 'password';
            eyeOpen.classList.toggle('hidden', isPwd);
            eyeClosed.classList.toggle('hidden', !isPwd);
          });

          var getCodeBtn = document.getElementById('reg-get-code-btn');
          var countdownTimer = null;

          getCodeBtn.addEventListener('click', function() {
            if (getCodeBtn.disabled) return;
            var phoneInput = document.getElementById('reg-phone-input');
            var phone = phoneInput.value.trim();
            var phoneError = document.getElementById('reg-phone-error');
            var phoneReg = /^1[3-9]\d{9}$/;

            if (!phoneReg.test(phone)) {
              phoneInput.classList.remove('border-border');
              phoneInput.classList.add('border-error-500');
              phoneError.classList.remove('hidden');
              phoneInput.focus();
              return;
            }
            phoneInput.classList.remove('border-error-500');
            phoneInput.classList.add('border-border');
            phoneError.classList.add('hidden');

            var seconds = 60;
            getCodeBtn.disabled = true;
            getCodeBtn.classList.add('opacity-60', 'cursor-not-allowed');
            getCodeBtn.classList.remove('hover:bg-primary-50');
            getCodeBtn.textContent = seconds + 's 后重发';

            countdownTimer = setInterval(function() {
              seconds--;
              if (seconds <= 0) {
                clearInterval(countdownTimer);
                getCodeBtn.disabled = false;
                getCodeBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                getCodeBtn.classList.add('hover:bg-primary-50');
                getCodeBtn.textContent = '获取验证码';
              } else {
                getCodeBtn.textContent = seconds + 's 后重发';
              }
            }, 1000);
          });

          ['reg-phone-input', 'reg-code-input', 'reg-password-input', 'reg-confirm-input'].forEach(function(id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('input', function() {
              var errId = id.replace('-input', '-error');
              var errEl = document.getElementById(errId);
              if (errEl) errEl.classList.add('hidden');
              el.classList.remove('border-error-500');
              el.classList.add('border-border');
            });
          });

          var regBtn = document.querySelector('.reg-btn');
          regBtn.addEventListener('click', function() {
            var phoneInp = document.getElementById('reg-phone-input');
            var codeInp = document.getElementById('reg-code-input');
            var pwdInp = document.getElementById('reg-password-input');
            var confirmInp = document.getElementById('reg-confirm-input');
            var agreeInp = document.getElementById('reg-agree');

            var phoneErr = document.getElementById('reg-phone-error');
            var codeErr = document.getElementById('reg-code-error');
            var pwdErr = document.getElementById('reg-password-error');
            var confirmErr = document.getElementById('reg-confirm-error');
            var agreeErr = document.getElementById('reg-agree-error');

            var phoneReg = /^1[3-9]\d{9}$/;
            var valid = true;

            if (!phoneReg.test(phoneInp.value.trim())) {
              phoneInp.classList.remove('border-border');
              phoneInp.classList.add('border-error-500');
              phoneErr.classList.remove('hidden');
              valid = false;
            }
            if (!codeInp.value.trim() || codeInp.value.trim().length < 4) {
              codeInp.classList.remove('border-border');
              codeInp.classList.add('border-error-500');
              codeErr.classList.remove('hidden');
              valid = false;
            }
            if (!pwdInp.value.trim() || pwdInp.value.length < 6 || pwdInp.value.length > 20) {
              pwdInp.classList.remove('border-border');
              pwdInp.classList.add('border-error-500');
              pwdErr.classList.remove('hidden');
              valid = false;
            }
            if (confirmInp.value.trim() !== pwdInp.value.trim()) {
              confirmInp.classList.remove('border-border');
              confirmInp.classList.add('border-error-500');
              confirmErr.classList.remove('hidden');
              valid = false;
            }
            if (!agreeInp.checked) {
              agreeErr.classList.remove('hidden');
              valid = false;
            }

            if (!valid) return;

            var btnText = regBtn.querySelector('.reg-btn-text');
            var btnLoading = regBtn.querySelector('.reg-btn-loading');
            btnText.classList.add('hidden');
            btnLoading.classList.remove('hidden');
            regBtn.disabled = true;

            setTimeout(function() {
              btnText.classList.remove('hidden');
              btnLoading.classList.add('hidden');
              regBtn.disabled = false;
              window.location.href = './dashboard.html';
            }, 1500);
          });
        })();
      </script>
      <script src="https://unpkg.com/lucide@latest"></script>
      <script>lucide.createIcons();</script>
    </main>
</body>
</html>
