<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI tutor - 智能复习</title>

  <!-- Tailwind v4 + Design System (D093) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../assets/css/design-system.css">

  <style>
    /* ============================================================
     * Design Token v1 语义别名 (alias 到 D093 --ds-*)
     * ============================================================ */
    :root {
      --ait-color-primary-500:  var(--ds-accent);
      --ait-color-primary-600:  var(--ds-accent-active);
      --ait-color-success-500:  #059669;
      --ait-color-warning-500:  #f59e0b;
      --ait-color-danger-500:   #ef4444;
      --ait-color-info-500:     #0284c7;
      --ait-fg-strong:    var(--ds-fg-primary);
      --ait-fg-default:   var(--ds-fg-primary);
      --ait-fg-secondary: var(--ds-fg-secondary);
      --ait-fg-tertiary:  var(--ds-fg-muted);
      --ait-bg-page:      var(--ds-bg-page);
      --ait-bg-surface:   var(--ds-bg-surface);
      --ait-border:       var(--ds-border);
      --ait-shadow-lg:    0 8px 24px -8px rgba(0,0,0,.18);
      --ait-shadow-xl:    0 16px 40px -12px rgba(0,0,0,.24);
      --ait-radius-lg:    16px;
      --ait-radius-xl:    20px;
    }

    /* ============================================================
     * 冲刺 1.1 — 闪卡 3D 翻转 (CSS Transform)
     * ============================================================ */
    .flashcard-wrap {
      perspective: 1600px;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }
    .flashcard {
      position: relative;
      width: 100%;
      min-height: 360px;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
      will-change: transform;
    }
    .flashcard.is-flipped {
      transform: rotateY(180deg);
    }
    .flashcard-face {
      position: absolute;
      inset: 0;
      width: 100%;
      min-height: 360px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--ait-radius-xl);
      background: var(--ait-bg-surface);
      border: 1px solid var(--ait-border);
      box-shadow: var(--ait-shadow-lg);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .flashcard-face.is-back {
      transform: rotateY(180deg);
    }

    /* Swipe Out 动效 — 卡片滑出视口 */
    @keyframes swipe-out-right {
      0%   { transform: translateX(0)    rotate(0deg);  opacity: 1; }
      100% { transform: translateX(120%) rotate(15deg); opacity: 0; }
    }
    @keyframes swipe-out-left {
      0%   { transform: translateX(0)    rotate(0deg);  opacity: 1; }
      100% { transform: translateX(-120%) rotate(-15deg); opacity: 0; }
    }
    .flashcard.swipe-right {
      animation: swipe-out-right 0.45s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
    }
    .flashcard.swipe-left {
      animation: swipe-out-left 0.45s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
    }

    /* ============================================================
     * 冲刺 1.2 — 三档自评按钮
     * ============================================================ */
    .rate-bar {
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      padding: 16px 0;
      background: linear-gradient(to top,
        var(--ait-bg-page) 70%,
        rgba(248, 249, 251, 0.0) 100%);
      z-index: 10;
    }
    .rate-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 72px;
      padding: 14px 8px;
      border-radius: var(--ait-radius-lg);
      border: 2px solid transparent;
      background: var(--ait-bg-surface);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      color: var(--ait-fg-strong);
    }
    .rate-btn:active { transform: scale(0.97); }
    .rate-btn:hover  { box-shadow: var(--ait-shadow-lg); }

    .rate-btn.is-danger {
      background: var(--ait-color-danger-500);
      color: #fff;
    }
    .rate-btn.is-danger:hover {
      background: #dc2626;
      border-color: var(--ait-color-danger-500);
    }
    .rate-btn.is-warning {
      background: var(--ait-color-warning-500);
      color: #fff;
    }
    .rate-btn.is-warning:hover {
      background: #d97706;
      border-color: var(--ait-color-warning-500);
    }
    .rate-btn.is-success {
      background: var(--ait-color-success-500);
      color: #fff;
    }
    .rate-btn.is-success:hover {
      background: #047857;
      border-color: var(--ait-color-success-500);
    }
    .rate-btn .hint {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.85;
    }

    /* ============================================================
     * 冲刺 1.3 — Skeleton 骨架屏
     * ============================================================ */
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg,
        var(--ds-bg-subtle) 25%,
        var(--ds-bg-elevated) 50%,
        var(--ds-bg-subtle) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    .skeleton-line { height: 14px; margin-bottom: 10px; }
    .skeleton-line.is-lg { height: 24px; width: 60%; }
    .skeleton-line.is-md { height: 18px; width: 40%; }

    /* ============================================================
     * 冲刺 1.4 — 庆祝 EmptyState
     * ============================================================ */
    .review-done {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 48px 24px;
      text-align: center;
    }
    .review-done .badge {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: var(--ait-color-success-500);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(5, 150, 105, 0.35);
    }
    .review-done .stat-delta {
      font-size: 14px;
      color: var(--ait-color-success-500);
      font-weight: 700;
    }
  </style>
</head>

<body class="min-h-screen font-sans antialiased" style="font-family: 'Noto Sans SC', 'DM Sans', sans-serif;">
  <main class="min-h-screen bg-surface-secondary" style="background: var(--ait-bg-page);">

    <!-- PageHeader + 进度 -->
    <header class="max-w-5xl mx-auto px-4 sm:px-6 pt-6 sm:pt-8 pb-4 flex items-center justify-between">
      <div>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ds-accent);">
          SRS · 闪卡复习
        </span>
        <h1 class="mt-1 text-2xl font-bold" style="color: var(--ait-fg-strong);">智能复习</h1>
      </div>
      <div id="progress-badge" class="text-right">
        <div class="text-2xl font-bold tabular-nums" style="color: var(--ait-fg-strong);">
          <span data-progress-current>0</span> / <span data-progress-total>0</span>
        </div>
        <div class="text-xs" style="color: var(--ait-fg-tertiary);">今日待复习</div>
      </div>
    </header>

    <!-- 容器：闪卡 或 队列空状态 -->
    <div id="review-container" class="max-w-5xl mx-auto px-4 sm:px-6 pb-32">

      <!-- Skeleton 默认显示，JS 拿到数据后切换 -->
      <div id="skeleton-loader" class="flashcard-wrap">
        <div class="flashcard-face" style="position: relative;">
          <div class="skeleton skeleton-line is-lg"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line is-md" style="margin-top: 16px;"></div>
      </div>
    </div>

      <!-- 闪卡区域（JS 渲染） -->
      <div id="flashcard-region" class="hidden">
        <div class="flashcard-wrap">
          <div id="flashcard" class="flashcard" role="button" tabindex="0" aria-label="点击翻面">
            <!-- 正面：题面 -->
            <div class="flashcard-face is-front">
              <div class="flex items-center justify-between">
                <span data-subject-chip
                      class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold"
                      style="background: var(--ds-bg-subtle); color: var(--ait-fg-secondary);">
                  数学
                </span>
                <span class="text-xs" style="color: var(--ait-fg-tertiary);">
                  点击卡片查看解析
                </span>
              </div>
              <h2 class="text-xl font-bold mt-2" style="color: var(--ait-fg-strong);">
                <span data-card-topic>加载中...</span>
              </h2>
              <div class="flex flex-wrap gap-2 mt-1">
                <span class="text-xs px-2 py-0.5 rounded"
                      style="background: var(--ait-color-info-500); color: #fff;"
                      data-card-meta>掌握度 32%</span>
                <span class="text-xs px-2 py-0.5 rounded"
                      style="background: var(--ds-bg-subtle); color: var(--ait-fg-secondary);"
                      data-card-overdue>逾期 5 天</span>
              </div>
              <!-- 题干（占位：实际从 knowledge 服务拉）-->
              <div class="mt-4 p-4 rounded-lg"
                   style="background: var(--ds-bg-subtle); color: var(--ait-fg-default); font-size: 15px; line-height: 1.6; min-height: 100px;"
                   data-card-stem>
                正在加载题目...
              </div>
              <div class="mt-auto text-center text-xs" style="color: var(--ait-fg-tertiary);">
                想想怎么解，然后<i data-lucide="rotate-cw" class="inline w-3 h-3 mx-1"></i>翻面查看 AI 解析
              </div>
            </div>

            <!-- 背面：AI 解析 + 错因归因 -->
            <div class="flashcard-face is-back">
              <div class="flex items-center justify-between">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold"
                      style="background: var(--ait-color-info-500); color: #fff;">
                  <i data-lucide="sparkles" class="w-3 h-3 mr-1"></i>
                  AI 解析
                </span>
                <span class="text-xs" style="color: var(--ait-fg-tertiary);">
                  <span data-card-back-meta></span>
                </span>
              </div>
              <h2 class="text-lg font-bold mt-2" style="color: var(--ait-fg-strong);">
                <span data-card-back-topic></span>
              </h2>
              <div data-card-explanation class="text-sm leading-relaxed"
                   style="color: var(--ait-fg-default);">
                解析加载中...
              </div>
              <!-- 错因归因 chips -->
              <div data-card-errors class="flex flex-wrap gap-2 mt-2"></div>
            </div>
          </div>
        </div>

        <!-- 三档自评按钮 -->
        <div class="rate-bar max-w-5xl mx-auto">
          <button class="rate-btn is-danger"   data-rate="again">
            还是不会
            <span class="hint">重新安排到 1 天后</span>
          </button>
          <button class="rate-btn is-warning" data-rate="hard">
            有点印象
            <span class="hint">原间隔 ×1.2</span>
          </button>
          <button class="rate-btn is-success" data-rate="good">
            完全掌握
            <span class="hint">原间隔 ×2.5</span>
          </button>
        </div>
      </div>

      <!-- EmptyState（队列空 / 完成庆祝） -->
      <div id="empty-state" class="hidden review-done">
        <div class="badge">
          <i data-lucide="party-popper" style="width: 48px; height: 48px; color: #fff;"></i>
        </div>
        <h2 class="text-2xl font-bold mt-2" style="color: var(--ait-fg-strong);">
          今日复习完成 🎉
        </h2>
        <p class="text-sm" style="color: var(--ait-fg-secondary);">
          你已完成所有 <span data-done-total>0</span> 张闪卡的 SRS 自评
        </p>
        <div class="stat-delta mt-2">
          整体掌握度 <span data-mastery-delta>+0.0%</span>
        </div>
        <button class="ds-btn mt-6" onclick="window.location.href='/f3/pages/dashboard.html'">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          返回学习仪表盘
        </button>
      </div>

      <!-- 错误状态 -->
      <div id="error-state" class="hidden review-done">
        <div class="badge" style="background: var(--ait-color-danger-500);">
          <i data-lucide="alert-triangle" style="width: 48px; height: 48px; color: #fff;"></i>
        </div>
        <h2 class="text-2xl font-bold mt-2" style="color: var(--ait-fg-strong);">
          复习任务加载失败
        </h2>
        <p class="text-sm" style="color: var(--ait-fg-secondary);" data-error-msg>网络异常，请稍后重试。</p>
        <button class="ds-btn mt-6" data-retry>
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          重试
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    import { srs } from '../assets/js/api/services/srs.js';
    import { knowledge } from '../assets/js/api/services/index.js';
    import { mountErrorBoundary } from '../assets/js/components/error-boundary.js';
    import { toast } from '../assets/js/toast.js';
    import { setUseMock } from '../assets/js/api/USE_MOCK.js';

    mountErrorBoundary();
    setUseMock(true);  // F3 dev 默认 mock，生产环境改 false

    // ---------- 状态机 ----------
    const state = {
      queue: [],
      index: 0,
      total: 0,
      masteryDelta: 0,
      isFlipped: false,
    };

    // ---------- DOM refs ----------
    const $ = (sel) => document.querySelector(sel);
    const els = {
      skeleton:  $('#skeleton-loader'),
      region:    $('#flashcard-region'),
      flashcard: $('#flashcard'),
      empty:     $('#empty-state'),
      error:     $('#error-state'),
      retry:     $('[data-retry]'),
      progressCurrent: $('[data-progress-current]'),
      progressTotal:   $('[data-progress-total]'),
      doneTotal:       $('[data-done-total]'),
      masteryDelta:    $('[data-mastery-delta]'),
      errorMsg:        $('[data-error-msg]'),
    };

    // ---------- Subject chip 颜色（Tailwind-free, 用 ds- token）----------
    const SUBJECT_BG = {
      '数学':    'var(--ait-color-info-500)',
      '物理':    'var(--ait-color-info-500)',
      '化学':    'var(--ait-color-success-500)',
      '语文':    'var(--ait-color-danger-500)',
      '英语':    'var(--ait-color-warning-500)',
      '政治':    'var(--ait-color-primary-500)',
      '历史':    'var(--ait-color-primary-500)',
      '生物':    'var(--ait-color-success-500)',
      '地理':    'var(--ait-color-info-500)',
    };

    // ---------- 1. 加载今日任务 ----------
    async function loadDailyTasks() {
      try {
        const resp = await srs.getDailyTasks({ limit: 20 });
        if (!resp.success || !resp.data || !resp.data.tasks) {
          throw new Error('SRS 返回数据格式异常');
        }
        state.queue = resp.data.tasks;
        state.total = state.queue.length;
        els.progressTotal.textContent = state.total;

        if (state.total === 0) {
          renderEmpty();
          return;
        }
        renderCard();
      } catch (err) {
        console.error('[review] loadDailyTasks failed:', err);
        renderError(err.message || '网络异常，请稍后重试。');
        toast.error('复习任务加载失败');
      }
    }

    // ---------- 2. 渲染闪卡 ----------
    async function renderCard() {
      const task = state.queue[state.index];
      if (!task) { renderEmpty(); return; }

      // 更新进度
      els.progressCurrent.textContent = state.index + 1;

      // 重置 flip 状态
      state.isFlipped = false;
      els.flashcard.classList.remove('is-flipped', 'swipe-right', 'swipe-left');

      // 填充正面
      const subjectEl = document.querySelector('[data-subject-chip]');
      subjectEl.textContent = task.subject || '—';
      subjectEl.style.background = SUBJECT_BG[task.subject] || 'var(--ds-bg-subtle)';
      subjectEl.style.color = '#fff';

      document.querySelector('[data-card-topic]').textContent = task.topic || '—';
      document.querySelector('[data-card-meta]').textContent = `掌握度 ${task.mastery_score ?? 0}%`;
      document.querySelector('[data-card-overdue]').textContent =
        task.is_overdue ? `逾期 ${task.days_overdue} 天` : `间隔 ${task.interval_days} 天`;

      // 题干（mock：从 knowledge service 拉代表性错题）
      try {
        const kpResp = await knowledge.getKpDetail(task.knowledge_point_id);
        const kpData = kpResp.data || {};
        document.querySelector('[data-card-stem]').textContent =
          kpData.sample_question || kpData.description || `复习主题: ${task.topic}`;
      } catch {
        document.querySelector('[data-card-stem]').textContent =
          `请回忆该知识点: ${task.topic}`;
      }

      // 背面（占位：实际可接 LLM explainQuestion）
      document.querySelector('[data-card-back-topic]').textContent = task.topic || '—';
      document.querySelector('[data-card-back-meta]').textContent =
        `第 ${task.attempt_count} 次复习 · 正确率 ${task.accuracy ?? 0}%`;
      document.querySelector('[data-card-explanation]').textContent =
        `${task.topic} 涉及的核心概念与典型题型。\n` +
        `关键步骤: ① 审题 ② 定位考点 ③ 套用公式 ④ 验算\n` +
        `建议: 结合错题本中相关错题，强化 ${task.subject} 学科的薄弱环节。`;
      const errorsEl = document.querySelector('[data-card-errors]');
      errorsEl.innerHTML = [
        `<span class="text-xs px-2 py-0.5 rounded" style="background: var(--ait-color-warning-500); color: #fff;">概念辨析不清</span>`,
        `<span class="text-xs px-2 py-0.5 rounded" style="background: var(--ait-color-danger-500); color: #fff;">公式应用错误</span>`,
      ].join('');

      // 切换可见性
      els.skeleton.classList.add('hidden');
      els.region.classList.remove('hidden');
      els.empty.classList.add('hidden');
      els.error.classList.add('hidden');

      // lucide 图标刷新
      if (window.lucide) lucide.createIcons();
    }

    // ---------- 3. 闪卡翻转 ----------
    function flipCard() {
      state.isFlipped = !state.isFlipped;
      els.flashcard.classList.toggle('is-flipped');
    }
    els.flashcard.addEventListener('click', flipCard);
    els.flashcard.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipCard(); }
    });

    // ---------- 4. 三档自评 ----------
    document.querySelectorAll('[data-rate]').forEach(btn => {
      btn.addEventListener('click', () => rateCard(btn.dataset.rate));
    });

    // 键盘 1/2/3 快捷键（翻转后才能评分）
    document.addEventListener('keydown', (e) => {
      if (els.region.classList.contains('hidden')) return;
      if (!state.isFlipped) return;
      if (e.key === '1') rateCard('again');
      else if (e.key === '2') rateCard('hard');
      else if (e.key === '3') rateCard('good');
    });

    // rate → again=0 correct, hard=0 correct, good=1 correct
    async function rateCard(rating) {
      if (!state.isFlipped) {
        toast.info('请先翻面查看解析');
        flipCard();
        return;
      }
      const task = state.queue[state.index];
      if (!task) return;

      // Swipe 动效方向: again/hard → 左滑（继续复习），good → 右滑（掌握）
      const dir = rating === 'good' ? 'swipe-right' : 'swipe-left';
      els.flashcard.classList.add(dir);

      const isCorrect = rating === 'good';

      try {
        const resp = await srs.completeTask(task.knowledge_point_id, isCorrect, 0);
        if (resp.success && resp.data) {
          const delta = resp.data.mastery_delta ?? 0;
          state.masteryDelta += delta;
          toast.success(
            rating === 'good' ? `掌握度 +${delta.toFixed(1)}%`
                               : `已重新安排复习 (质量 ${resp.data.quality ?? '—'})`
          );
        }
      } catch (err) {
        console.warn('[review] completeTask failed (mock mode ok):', err);
      }

      // 400ms 动效结束后推进
      setTimeout(() => {
        state.index++;
        if (state.index >= state.total) {
          renderEmpty();
        } else {
          renderCard();
        }
      }, 420);
    }

    // ---------- 5. EmptyState / ErrorState ----------
    function renderEmpty() {
      els.skeleton.classList.add('hidden');
      els.region.classList.add('hidden');
      els.error.classList.add('hidden');
      els.empty.classList.remove('hidden');
      els.doneTotal.textContent = state.total;
      els.masteryDelta.textContent =
        (state.masteryDelta >= 0 ? '+' : '') + state.masteryDelta.toFixed(1) + '%';
      if (window.lucide) lucide.createIcons();
    }

    function renderError(msg) {
      els.skeleton.classList.add('hidden');
      els.region.classList.add('hidden');
      els.empty.classList.add('hidden');
      els.error.classList.remove('hidden');
      els.errorMsg.textContent = msg;
      if (window.lucide) lucide.createIcons();
    }

    els.retry?.addEventListener('click', () => {
      els.skeleton.classList.remove('hidden');
      els.error.classList.add('hidden');
      loadDailyTasks();
    });

    // ---------- 启动 ----------
    loadDailyTasks();
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
