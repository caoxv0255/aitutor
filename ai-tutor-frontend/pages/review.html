<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>

    <style type="text/tailwindcss">

    --color-error-300: #fca5a5;
    --color-error-400: #f87171;
    --color-error-500: #ef4444;
    --color-error-600: #dc2626;
    --color-error-700: #b91c1c;
    --color-error-800: #991b1b;
    --color-error-900: #7f1d1d;
    --color-info-50: #f0f9ff;
    --color-info-100: #e0f2fe;
    --color-info-200: #bae6fd;
    --color-info-300: #7dd3fc;
    --color-info-400: #38bdf8;
    --color-info-500: #0284c7;
    --color-info-600: #0369a1;

    --color-severe-50: #fff7ed;
    --color-severe-100: #ffedd5;
    --color-severe-200: #fed7aa;
    --color-severe-300: #fdba74;
    --color-severe-400: #fb923c;

    --color-severe-600: #ea580c;

    --color-creative-50: #f5f3ff;
    --color-creative-100: #ede9fe;

    --color-creative-300: #c4b5fd;

    --color-surface: #ffffff;

    --color-border-light: #f1f5f9;
    --shadow-primary-glow: 0 2px 8px rgba(215,25,32,0.25);
    --shadow-primary-glow-md: 0 4px 12px rgba(215,25,32,0.25);
    --shadow-primary-glow-lg: 0 6px 20px rgba(215,25,32,0.35);
    --shadow-creative-glow: 0 8px 24px rgba(124,58,237,0.12);
    --shadow-glow-warning: 0 4px 16px rgba(245,158,11,0.35);
    --shadow-glow-warning-sm: 0 3px 10px rgba(245,158,11,0.3);
    --shadow-glow-error: 0 4px 12px rgba(239,68,68,0.3);
    --shadow-glow-error-sm: 0 3px 10px rgba(239,68,68,0.3);
    --shadow-glow-success: 0 3px 10px rgba(5,150,105,0.3);
    --font-display: 'DM Sans', 'Noto Sans SC', sans-serif;
    --font-sans: 'Noto Sans SC', 'DM Sans', sans-serif;
    --radius-sm: 8px;

    --radius-lg: 16px;

  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
        <main class="min-h-screen bg-surface-secondary" style="font-family:DM Sans,Noto Sans SC,sans-serif;">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
        <section class="mb-6">
          <span class="ait-badge ait-badge-primary">F3 Slice 4.4 commit 6</span>
          <h1 class="mt-2 text-2xl font-bold text-foreground">学情报告</h1>
          <p class="mt-1 text-[13px] text-foreground-secondary">学习效果回顾、趋势分析、危机点监测</p>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Card: trend summary -->
          <section data-card="trend" class="bg-surface rounded-2xl border border-border shadow-sm p-5">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-base font-semibold text-foreground flex items-center gap-2">
                <i data-lucide="trending-up" class="w-4 h-4 text-primary-500"></i>
                30 天趋势
              </h2>
              <span data-trend-loading class="text-[12px] text-foreground-muted">加载中…</span>
            </div>
            <div data-trend-body class="grid grid-cols-3 gap-3 text-center">
              <div><div class="text-[11px] text-foreground-muted">回答量</div><div data-trend-q class="text-xl font-bold text-foreground">—</div></div>
              <div><div class="text-[11px] text-foreground-muted">正确率</div><div data-trend-acc class="text-xl font-bold text-success-500">—</div></div>
              <div><div class="text-[11px] text-foreground-muted">均分</div><div data-trend-score class="text-xl font-bold text-primary-500">—</div></div>
            </div>
          </section>

          <!-- Card: weak points -->
          <section data-card="weak" class="bg-surface rounded-2xl border border-border shadow-sm p-5">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-base font-semibold text-foreground flex items-center gap-2">
                <i data-lucide="alert-triangle" class="w-4 h-4 text-warning-500"></i>
                危机点
              </h2>
              <span data-weak-loading class="text-[12px] text-foreground-muted">加载中…</span>
            </div>
            <ul data-weak-list class="space-y-2 text-[13px]"></ul>
          </section>

          <!-- Card: session history -->
          <section data-card="history" class="bg-surface rounded-2xl border border-border shadow-sm p-5 md:col-span-2">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-base font-semibold text-foreground flex items-center gap-2">
                <i data-lucide="history" class="w-4 h-4 text-foreground-secondary"></i>
                近期会话
              </h2>
              <span data-history-loading class="text-[12px] text-foreground-muted">加载中…</span>
            </div>
            <div data-history-list class="space-y-2 text-[13px]"></div>
          </section>

          <!-- Card: reports list -->
          <section data-card="reports" class="bg-surface rounded-2xl border border-border shadow-sm p-5 md:col-span-2">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-base font-semibold text-foreground flex items-center gap-2">
                <i data-lucide="file-text" class="w-4 h-4 text-foreground-secondary"></i>
                学情报告列表
              </h2>
              <span data-reports-loading class="text-[12px] text-foreground-muted">加载中…</span>
            </div>
            <div data-reports-list class="space-y-2 text-[13px]"></div>
          </section>
        </div>
      </div>
    </main>

    <script type="module">
      import { review } from "../assets/js/api/services/index.js";
      import { mountErrorBoundary } from "../assets/js/components/error-boundary.js";
      import { setUseMock } from "../assets/js/api/USE_MOCK.js";
      import { mount as mountNav } from "../assets/js/navator.js";
      import { useAsyncResource } from "../assets/js/hooks/useAsyncResource.js";
      import { toast } from "../assets/js/toast.js";

      mountErrorBoundary();
      setUseMock(false);  // F3.6: review backend 5 个 endpoint 已就绪
      mountNav("review");

      const esc = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      // --- trend ---
      const trendRes = useAsyncResource(() => review.getTrendSummary({ days: 30 }));
      trendRes.subscribe(({ data, loading, error }) => {
        const loadingEl = document.querySelector("[data-trend-loading]");
        if (loading) { if (loadingEl) loadingEl.textContent = "加载中…"; return; }
        if (error) { if (loadingEl) loadingEl.textContent = "加载失败"; return; }
        if (data) {
          if (loadingEl) loadingEl.classList.add("hidden");
          const d = data.data || {};
          const qEl = document.querySelector("[data-trend-q]");
          const accEl = document.querySelector("[data-trend-acc]");
          const scoreEl = document.querySelector("[data-trend-score]");
          if (qEl) qEl.textContent = d.total_questions ?? "—";
          if (accEl) accEl.textContent = d.accuracy ? (d.accuracy * 100).toFixed(1) + "%" : "—";
          if (scoreEl) scoreEl.textContent = d.avg_score ?? "—";
        }
      });

      // --- weak points ---
      const weakRes = useAsyncResource(() => review.getWeakPoints({}));
      weakRes.subscribe(({ data, loading, error }) => {
        const loadingEl = document.querySelector("[data-weak-loading]");
        const listEl = document.querySelector("[data-weak-list]");
        if (loading) { if (loadingEl) loadingEl.textContent = "加载中…"; return; }
        if (error) { if (loadingEl) loadingEl.textContent = "加载失败"; return; }
        if (data) {
          if (loadingEl) loadingEl.classList.add("hidden");
          const items = data.data || [];
          if (items.length === 0) {
            listEl.innerHTML = "<li class=\"text-foreground-muted\">暂无危机点</li>";
            return;
          }
          listEl.innerHTML = items.slice(0, 8).map((it) =>
            "<li class=\"flex items-center justify-between gap-3 py-1.5 border-b border-border last:border-0\"><span class=\"truncate\">" + esc(it.kp_name || it.name || it.knowledge_point || it.topic || "—") + "</span><span class=\"shrink-0 text-[12px] text-warning-600 font-medium\">" + (it.error_rate != null ? (it.error_rate * 100).toFixed(0) + "%" : esc(it.level || it.priority || "")) + "</span></li>"
          ).join("");
        }
      });

      // --- session history ---
      const historyRes = useAsyncResource(() => review.getSessionHistory({ limit: 10 }));
      historyRes.subscribe(({ data, loading, error }) => {
        const loadingEl = document.querySelector("[data-history-loading]");
        const listEl = document.querySelector("[data-history-list]");
        if (loading) { if (loadingEl) loadingEl.textContent = "加载中…"; return; }
        if (error) { if (loadingEl) loadingEl.textContent = "加载失败"; return; }
        if (data) {
          if (loadingEl) loadingEl.classList.add("hidden");
          const items = data.data || [];
          if (items.length === 0) {
            listEl.innerHTML = "<div class=\"text-foreground-muted\">暂无会话记录</div>";
            return;
          }
          listEl.innerHTML = items.map((it) =>
            "<div class=\"flex items-center justify-between gap-3 py-2 border-b border-border last:border-0\"><div class=\"min-w-0\"><div class=\"truncate\">" + esc(it.title || it.subject || it.mode || "会话") + "</div><div class=\"text-[11px] text-foreground-muted\">" + esc(it.started_at || it.created_at || "") + "</div></div><span class=\"shrink-0 text-[12px] text-foreground-secondary\">" + esc(it.mode || "") + "</span></div>"
          ).join("");
        }
      });

      // --- reports list ---
      const reportsRes = useAsyncResource(() => review.getReports({ page: 1, pageSize: 5 }));
      reportsRes.subscribe(({ data, loading, error }) => {
        const loadingEl = document.querySelector("[data-reports-loading]");
        const listEl = document.querySelector("[data-reports-list]");
        if (loading) { if (loadingEl) loadingEl.textContent = "加载中…"; return; }
        if (error) { if (loadingEl) loadingEl.textContent = "加载失败"; return; }
        if (data) {
          if (loadingEl) loadingEl.classList.add("hidden");
          const items = data.data || [];
          if (items.length === 0) {
            listEl.innerHTML = "<div class=\"text-foreground-muted\">暂无报告</div>";
            return;
          }
          listEl.innerHTML = items.map((it) =>
            "<div class=\"flex items-center justify-between gap-3 py-2 border-b border-border last:border-0\"><div class=\"min-w-0\"><div class=\"truncate font-medium\">" + esc(it.title || it.period || "报告") + "</div><div class=\"text-[11px] text-foreground-muted\">" + esc(it.subject || "") + " · " + esc(it.created_at || it.date || "") + "</div></div><span class=\"shrink-0 text-[12px] text-primary-500 font-medium\">" + esc(it.score != null ? it.score + " 分" : "") + "</span></div>"
          ).join("");
        }
      });
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
