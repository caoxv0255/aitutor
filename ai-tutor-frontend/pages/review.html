<body class="min-h-screen font-sans antialiased">
        <main class="min-h-screen bg-surface-secondary" style="font-family:DM Sans,Noto Sans SC,sans-serif;">

    </main>

    <script type="module">
      import { review } from "../assets/js/api/services/index.js";
      import { mountErrorBoundary } from "../assets/js/components/error-boundary.js";
      import { setUseMock } from "../assets/js/api/USE_MOCK.js";
      import { mount as mountNav } from "../assets/js/navator.js";
      import { useAsyncResource } from "../assets/js/hooks/useAsyncResource.js";
      import { toast } from "../assets/js/toast.js";

      mountErrorBoundary();
      setUseMock(true);  // 后端缺 review 路由, 暂走 mock
      mountNav("review");

      const esc = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      // --- trend ---
      const trendRes = useAsyncResource(() => review.getTrendSummary({ days: 30 }));
      trendRes.subscribe(({ data, loading, error }) => {
        const loadingEl = document.querySelector("[data-trend-loading]");
        if (loading) { if (loadingEl) loadingEl.textContent = "加载中…"; return; }
        if (error) { if (loadingEl) loadingEl.textContent = "加载失败"; return; }
        if (data) {
          if (loadingEl) loadingEl.classList.add("hidden");
          const d = data.data || {};
          const qEl = document.querySelector("[data-trend-q]");
          const accEl = document.querySelector("[data-trend-acc]");
          const scoreEl = document.querySelector("[data-trend-score]");
          if (qEl) qEl.textContent = d.total_questions ?? "—";
          if (accEl) accEl.textContent = d.accuracy ? (d.accuracy * 100).toFixed(1) + "%" : "—";
          if (scoreEl) scoreEl.textContent = d.avg_score ?? "—";
        }
      });

      // --- weak points ---
      const weakRes = useAsyncResource(() => review.getWeakPoints({}));
      weakRes.subscribe(({ data, loading, error }) => {
        const loadingEl = document.querySelector("[data-weak-loading]");
        const listEl = document.querySelector("[data-weak-list]");
        if (loading) { if (loadingEl) loadingEl.textContent = "加载中…"; return; }
        if (error) { if (loadingEl) loadingEl.textContent = "加载失败"; return; }
        if (data) {
          if (loadingEl) loadingEl.classList.add("hidden");
          const items = data.data || [];
          if (items.length === 0) {
            listEl.innerHTML = "<li class=\"text-foreground-muted\">暂无危机点</li>";
            return;
          }
          listEl.innerHTML = items.slice(0, 8).map((it) =>
            "<li class=\"flex items-center justify-between gap-3 py-1.5 border-b border-border last:border-0\"><span class=\"truncate\">" + esc(it.kp_name || it.name || it.knowledge_point || "—") + "</span><span class=\"shrink-0 text-[12px] text-warning-600 font-medium\">" + (it.error_rate ? (it.error_rate * 100).toFixed(0) + "%" : esc(it.level || "")) + "</span></li>"
          ).join("");
        }
      });

      // --- session history ---
      const historyRes = useAsyncResource(() => review.getSessionHistory({ limit: 10 }));
      historyRes.subscribe(({ data, loading, error }) => {
        const loadingEl = document.querySelector("[data-history-loading]");
        const listEl = document.querySelector("[data-history-list]");
        if (loading) { if (loadingEl) loadingEl.textContent = "加载中…"; return; }
        if (error) { if (loadingEl) loadingEl.textContent = "加载失败"; return; }
        if (data) {
          if (loadingEl) loadingEl.classList.add("hidden");
          const items = data.data || [];
          if (items.length === 0) {
            listEl.innerHTML = "<div class=\"text-foreground-muted\">暂无会话记录</div>";
            return;
          }
          listEl.innerHTML = items.map((it) =>
            "<div class=\"flex items-center justify-between gap-3 py-2 border-b border-border last:border-0\"><div class=\"min-w-0\"><div class=\"truncate\">" + esc(it.title || it.subject || "会话") + "</div><div class=\"text-[11px] text-foreground-muted\">" + esc(it.started_at || it.created_at || "") + "</div></div><span class=\"shrink-0 text-[12px] text-foreground-secondary\">" + esc(it.mode || "") + "</span></div>"
          ).join("");
        }
      });

      // --- reports list ---
      const reportsRes = useAsyncResource(() => review.getReports({ page: 1, pageSize: 5 }));
      reportsRes.subscribe(({ data, loading, error }) => {
        const loadingEl = document.querySelector("[data-reports-loading]");
        const listEl = document.querySelector("[data-reports-list]");
        if (loading) { if (loadingEl) loadingEl.textContent = "加载中…"; return; }
        if (error) { if (loadingEl) loadingEl.textContent = "加载失败"; return; }
        if (data) {
          if (loadingEl) loadingEl.classList.add("hidden");
          const items = data.data || [];
          if (items.length === 0) {
            listEl.innerHTML = "<div class=\"text-foreground-muted\">暂无报告</div>";
            return;
          }
          listEl.innerHTML = items.map((it) =>
            "<div class=\"flex items-center justify-between gap-3 py-2 border-b border-border last:border-0\"><div class=\"min-w-0\"><div class=\"truncate font-medium\">" + esc(it.title || it.period || "报告") + "</div><div class=\"text-[11px] text-foreground-muted\">" + esc(it.subject || "") + " · " + esc(it.created_at || it.date || "") + "</div></div><span class=\"shrink-0 text-[12px] text-primary-500 font-medium\">" + esc(it.score != null ? it.score + " 分" : "") + "</span></div>"
          ).join("");
        }
      });
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
