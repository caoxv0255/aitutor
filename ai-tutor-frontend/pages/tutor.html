<body class="min-h-screen font-sans antialiased">
    <main>
      <style>
        :root {
          --brand: #d71920;
          --brand-dark: #b8151b;
          --brand-light: #fff1f1;
          --brand-mid: #ffe0e0;
          --success: #059669;
          --success-light: #ecfdf5;
          --warning: #f59e0b;
          --warning-light: #fffbeb;
          --error: #ef4444;
          --info: #0284c7;
          --info-light: #f0f9ff;
          --radius-sm: 8px;
          --radius-md: 14px;
          --radius-lg: 16px;
          --radius-pill: 9999px;
        }
        @keyframes bounce-dot {
          0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
          40% { transform: scale(1); opacity: 1; }
        }
        @keyframes blink-cursor {
          0%, 50% { opacity: 1; }
          51%, 100% { opacity: 0; }
        }
        @keyframes fade-in-up {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .typing-dot {
          animation: bounce-dot 1.4s ease-in-out infinite both;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.16s; }
        .typing-dot:nth-child(3) { animation-delay: 0.32s; }
        .blink-cursor {
          display: inline-block;
          width: 2px;
          height: 1em;
          background: var(--brand);
          margin-left: 2px;
          vertical-align: text-bottom;
          animation: blink-cursor 0.9s step-end infinite;
          border-radius: 1px;
        }
        .msg-enter {
          animation: fade-in-up 0.35s ease-out both;
        }
        .formula-inline {
          font-family: 'DM Sans', 'Cambria Math', 'Times New Roman', serif;
          font-style: italic;
          letter-spacing: 0.02em;
        }
        .formula-block {
          font-family: 'DM Sans', 'Cambria Math', 'Times New Roman', serif;
          background: var(--color-surface-code);
          color: var(--color-on-dark);
          border-radius: var(--radius-md);
          padding: 16px 20px;
          margin: 12px 0;
          overflow-x: auto;
          font-size: 17px;
          line-height: 1.8;
          letter-spacing: 0.03em;
        }
        .formula-block .frac {
          display: inline-flex;
          flex-direction: column;
          align-items: center;
          vertical-align: middle;
          margin: 0 4px;
        }
        .formula-block .frac-num {
          border-bottom: 1.5px solid var(--color-on-dark);
          padding: 0 6px 2px;
        }
        .formula-block .frac-den {
          padding: 2px 6px 0;
        }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }
        .subject-tag-active {
          background: var(--brand);
          color: var(--color-on-dark);
        }
        .history-item-active {
          background: var(--brand-light);
          color: var(--brand);
          font-weight: 500;
        }
        .chat-input {
          border: 2px solid transparent;
          transition: border-color 0.2s, box-shadow 0.2s;
        }
        .chat-input:focus {
          border-color: var(--brand);
          box-shadow: 0 0 0 3px rgba(215,25,32,0.12);
        }
      </style>

      <div class="h-screen flex flex-col overflow-hidden bg-surface" style="font-family: 'Noto Sans SC','DM Sans',sans-serif;">

        <!-- ========== 顶部固定栏 ========== -->
        <header class="flex items-center justify-between h-14 px-3 sm:px-5 border-b border-border-light shrink-0 bg-surface z-20 relative">
          <div class="flex items-center gap-2 sm:gap-3 min-w-0">

              <h1 class="text-base sm:text-lg font-semibold text-foreground truncate" style="font-family:'DM Sans','Noto Sans SC',sans-serif;">AI 导师</h1>

              <i data-lucide="trash-2" class="w-4.5 h-4.5 text-foreground-secondary"></i>
            </button>
          </div>
        </header>

        <div class="flex flex-1 min-h-0">

          <!-- ========== 左侧对话历史（桌面端显示） ========== -->
          <aside class="hidden lg:flex w-64 flex-col border-r border-border-light bg-surface-tertiary/60 shrink-0">
            <div class="p-3 border-b border-border-light">
              <button class="w-full flex items-center justify-center gap-2 h-10 rounded-full text-white text-sm font-medium transition-all hover:opacity-90" style="background:var(--brand); font-family:'DM Sans','Noto Sans SC',sans-serif;">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>新建对话</span>
              </button>
            </div>
            <div class="flex-1 overflow-y-auto sidebar-scroll px-2 py-2">
              <p id="chat-history-heading" class="text-xs font-medium text-foreground-muted px-3 py-2 uppercase tracking-wider" style="font-family:'DM Sans',sans-serif;">历史对话</p>
              <ul id="chat-history-list" class="space-y-0.5">
                <!-- 8 history items rendered by F3 script module (see bottom of file) -->
              </ul>
            </div>
            <div class="p-3 border-t border-border-light">
              <div class="flex items-center gap-2.5 px-2 py-2">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background:linear-gradient(135deg,var(--color-primary-500),var(--color-primary-400));">学</div>
                <div class="min-w-0 flex-1">
                  <p class="text-sm font-medium text-foreground truncate">学习者</p>
                  <p class="text-xs text-foreground-muted truncate">高二 · 数学强化中</p>
                </div>
                <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface transition-colors">
                  <i data-lucide="settings" class="w-4 h-4 text-foreground-muted"></i>
                </button>
              </div>
            </div>
          </aside>

          <!-- ========== 中间主区域 ========== -->
          <div class="flex-1 flex flex-col min-w-0">

            <!-- 消息流区域 -->
            <div id="messages" class="flex-1 overflow-y-auto chat-scroll px-4 sm:px-6 lg:px-8 py-5 space-y-5" style="scroll-behavior:smooth;">

              <!-- 1. AI 欢迎消息 -->
              <div class="msg-enter flex gap-3 items-start max-w-[90%] sm:max-w-[75%] lg:max-w-[70%]">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0 mt-0.5" style="background:var(--brand); font-family:'DM Sans','Noto Sans SC',sans-serif;">AI</div>
                <div class="flex flex-col gap-1">
                  <div class="px-4 py-3 rounded-2xl rounded-tl-md text-foreground leading-relaxed text-[15px] bg-surface-tertiary" style="border-radius:var(--radius-lg); border-top-left-radius:6px">
                    你好！我是AI tutor，有什么题目不会做吗？你可以直接输入问题，或者拍照搜题。
                  </div>
                  <span class="text-xs text-foreground-muted ml-1">刚刚</span>
                </div>
              </div>

              <!-- 底部留白，防止内容被输入区遮挡 -->
              <div class="h-2"></div>
            </div>

            <!-- ========== 底部输入区域 ========== -->
            <div class="border-t border-border-light bg-surface px-3 sm:px-5 py-3 shrink-0">
              <!-- 学科快捷标签 (Phase 2 动态渲染, 默认 4 个) -->
              <div id="subject-tags" class="flex items-center gap-2 mb-2.5 overflow-x-auto no-scrollbar">
                <!-- 4 quick tags rendered by F3 script module (see bottom of file) -->
              </div>

              <!-- 输入框 + 按钮 -->
              <div class="flex items-end gap-2 sm:gap-2.5">
                <!-- 附件按钮 -->
                <button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-tertiary transition-colors shrink-0 self-end mb-0.5" title="添加附件" aria-label="添加附件">
                  <i data-lucide="paperclip" class="w-5 h-5 text-foreground-secondary"></i>
                </button>

                <!-- 文本输入框 -->
                <div class="flex-1 min-w-0 relative">
                  <textarea
                    id="chat-input"
                    rows="1"
                    placeholder="输入你的问题，支持 LaTeX 公式..."
                    class="chat-input w-full resize-none px-4 py-2.5 pr-4 text-[15px] leading-6 outline-none transition-all max-h-32 overflow-y-auto bg-surface-tertiary"
                    style="border-radius:var(--radius-lg); font-family:'Noto Sans SC','DM Sans',sans-serif"
                    oninput="this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,128)+'px';"
                  ></textarea>
                </div>

                <!-- 拍照按钮 -->
                <button data-dom-id="tutor-to-vision" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-tertiary transition-colors shrink-0 self-end mb-0.5" title="拍照搜题" aria-label="拍照搜题">
                  <i data-lucide="camera" class="w-5 h-5 text-foreground-secondary"></i>
                </button>

                <!-- 发送按钮 (Phase 3: id="send-btn" for handler) -->
                <button id="send-btn" data-dom-id="tutor-send" class="flex items-center justify-center w-10 h-10 rounded-full text-white transition-all hover:opacity-90 active:scale-95 shrink-0 self-end mb-0.5 disabled:opacity-50 disabled:cursor-not-allowed" style="background:var(--brand);" title="发送" aria-label="发送">
                  <i data-lucide="send-horizontal" class="w-5 h-5"></i>
                </button>
              </div>

              <!-- 提示文字 -->
              <p class="text-center text-[11px] text-foreground-muted mt-2">
                AI 生成内容仅供参考，请仔细甄别
              </p>
            </div>

          </div>
        </div>
      </div>
      </div>
    </main>

    <!-- ===== F3 Slice 4.1 — Workspace Shell 数据接入样板 (Phase 2 read-only MVP) ===== -->
    <section id="ait-f3-status" class="ait-page" style="padding:0;padding-bottom:24px;">
      <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <span class="ait-badge ait-badge-primary">F3 Slice 4.1</span>
        <span style="color:var(--color-muted-foreground);font-size:13px">
          tutor Workspace Shell 数据接入样板 (Workspace Adapter 首次验证 — history + subject 双向绑定, 不接 chat input)
        </span>
      </div>
    </section>

    <script type="module">
      import { tutor, wrong } from '../assets/js/api/services/index.js';
      import { useAsyncResource } from '../assets/js/hooks/useAsyncResource.js';
      import { mountErrorBoundary } from '../assets/js/components/error-boundary.js';
      import { setUseMock } from '../assets/js/api/USE_MOCK.js';

      mountErrorBoundary();
      setUseMock(true);  // Phase 2 强制 mock, 后端 :3002 不一定起

      // ===== SUBJECTS 9 学科 (D35a hardcode, 跟 wrong-book SUBJECT_MAP 一致) =====
      const SUBJECTS = ['数学', '语文', '英语', '物理', '化学', '政治', '生物', '历史', '地理'];

      // ===== conversationState (D33, long-lived, 6 字段固定顺序) =====
      const conversationState = {
        subject: '数学',          // 当前学科 (Phase 2 双向绑定)
        currentSessionId: null,   // 当前激活 session (Phase 4.4 才用)
        sessions: [],             // chat history list (Phase 2 从 mock 加载)
        messages: [],             // 当前 session 消息 (Phase 3 才渲染, Phase 2 保留 hardcoded)
        loading: false,           // tutor.ask 等待状态 (Phase 3)
        error: null,              // 错误信息 (Phase 3)
      };

      // ===== Escape helper =====
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      // ===== renderHistory: sidebar list from conversationState.sessions =====
      function renderHistory(sessions) {
        const listEl = document.getElementById('chat-history-list');
        if (!listEl) return;
        if (!sessions || sessions.length === 0) {
          listEl.innerHTML = '<li class="px-3 py-2.5 text-sm text-foreground-secondary">暂无历史对话</li>';
          return;
        }
        listEl.innerHTML = sessions.map((s, idx) => {
          const isActive = idx === 0;  // Phase 2: 第一项 active
          const activeClass = isActive ? 'history-item-active' : 'text-foreground-secondary hover:bg-surface';
          const iconColor = isActive ? '' : 'text-foreground-muted';
          return `<li data-session-id="${esc(s.id)}" class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm cursor-pointer transition-colors ${activeClass}"><i data-lucide="message-square" class="w-4 h-4 shrink-0 ${iconColor}"></i><span class="truncate">${esc(s.title)}</span></li>`;
        }).join('');
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
      }

      // ===== renderSubjectTags: 4 quick tags (Phase 2 范围) =====
      function renderSubjectTags() {
        const tagsEl = document.getElementById('subject-tags');
        if (!tagsEl) return;
        const quickSubjects = SUBJECTS.slice(0, 4);  // 数学/语文/英语/物理
        tagsEl.innerHTML = quickSubjects.map((subj) => {
          const isActive = subj === conversationState.subject;
          const activeClass = isActive ? 'subject-tag-active' : 'text-foreground-secondary bg-surface-tertiary hover:bg-border-light';
          return `<button data-subject="${esc(subj)}" class="inline-flex items-center gap-1 h-7 px-3 rounded-full text-xs font-medium whitespace-nowrap transition-all shrink-0 ${activeClass}" style="border-radius:var(--radius-pill);"><span>${esc(subj)}</span></button>`;
        }).join('');
      }

      // ===== syncSubjectDropdown: 同步 native select value =====
      function syncSubjectDropdown() {
        const sel = document.getElementById('subject-dropdown');
        if (sel) sel.value = conversationState.subject;
      }

      // ===== 主数据流: history list (Phase 2 only) =====
      const historyRes = useAsyncResource(() => tutor.getHistory());
      historyRes.subscribe(({ data, loading, error }) => {
        if (error) {
          console.error('[Slice4] history error:', error.type, error.code, error.message);
          conversationState.error = error;
          return;
        }
        if (loading && !data) return;
        if (data) {
          conversationState.sessions = data.data || [];
          console.log('[Slice4] history loaded:', conversationState.sessions.length, 'sessions');
          renderHistory(conversationState.sessions);
        }
      });

      // ===== Event handlers (D18 event delegation 风格) =====
      // Subject dropdown change
      const dropdownEl = document.getElementById('subject-dropdown');
      if (dropdownEl) {
        dropdownEl.addEventListener('change', (e) => {
          conversationState.subject = e.target.value;
          renderSubjectTags();  // sync quick tags
          console.log('[Slice4] subject dropdown changed:', conversationState.subject);
        });
      }

      // Subject quick tags click (event delegation)
      const tagsEl = document.getElementById('subject-tags');
      if (tagsEl) {
        tagsEl.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-subject]');
          if (!btn) return;
          conversationState.subject = btn.dataset.subject;
          syncSubjectDropdown();
          renderSubjectTags();
          console.log('[Slice4] subject tag clicked:', conversationState.subject);
        });
      }

      // Initial render (Phase 2: subject dropdown 跟 conversationState 默认 '数学' 同步)
      syncSubjectDropdown();
      renderSubjectTags();

      // ================================================================================
      // ===== Slice 4 Phase 3 — Non-streaming Chat MVP =====
      // ================================================================================

      // ===== Mock routing (D44a: question content hint) =====
      function pickMockName(question) {
        const guidedHints = ['不会', '不懂', '先复习', '基础'];
        if (guidedHints.some(h => question.includes(h))) return 'tutor_ask_guided';
        return 'tutor_ask';
      }

      // ===== Helper: format timestamp =====
      function fmtTime(ts) {
        if (!ts) return '';
        try { return new Date(ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
        catch { return ''; }
      }

      // ===== Message template: user bubble (right-aligned) =====
      function userMessageTemplate(msg) {
        return `
              <div class="msg-enter dynamic-msg flex justify-end">
                <div class="flex flex-col gap-1 items-end max-w-[90%] sm:max-w-[75%] lg:max-w-[70%]">
                  <div class="px-4 py-3 rounded-2xl rounded-tr-md text-white leading-relaxed text-[15px]" style="background:var(--brand); border-radius:var(--radius-lg); border-top-right-radius:6px;">
                    ${esc(msg.content)}
                  </div>
                  <span class="text-xs text-foreground-muted mr-1">${esc(fmtTime(msg.timestamp))}</span>
                </div>
              </div>`;
      }

      // ===== Message template: assistant reply =====
      function assistantMessageTemplate(msg) {
        const responseHtml = esc(msg.content || '').replace(/\n\n/g, '</p><p class="mb-3 mt-3">').replace(/\n/g, '<br>');
        return `
              <div class="msg-enter dynamic-msg flex gap-3 items-start max-w-[92%] sm:max-w-[80%] lg:max-w-[72%]">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0 mt-0.5" style="background:var(--brand); font-family:'DM Sans','Noto Sans SC',sans-serif;">AI</div>
                <div class="flex-1 min-w-0 flex flex-col gap-1">
                  <article class="px-4 py-3.5 rounded-2xl rounded-tl-md text-foreground leading-[1.75] text-[15px] bg-surface-tertiary" style="border-radius:var(--radius-lg); border-top-left-radius:6px">
                    <p class="mb-3">${responseHtml}</p>
                  </article>
                  <div class="flex items-center gap-2 ml-1">
                    <button data-dom-id="tutor-add-wrong" data-question-text="${esc((msg.content || '').slice(0, 200))}" class="inline-flex items-center gap-1.5 h-7 px-3 rounded-full text-xs font-medium text-white transition-all hover:opacity-90 disabled:opacity-50" style="background:var(--brand);">
                      <i data-lucide="bookmark-plus" class="w-3.5 h-3.5"></i>
                      加入错题本
                    </button>
                  </div>
                  <span class="text-xs text-foreground-muted ml-1">${esc(fmtTime(msg.timestamp))}</span>
                </div>
              </div>`;
      }

      // ===== Message template: error bubble (D48a silent + inline) =====
      function errorMessageTemplate(msg) {
        const err = msg.error || {};
        return `
              <div class="msg-enter dynamic-msg flex gap-3 items-start max-w-[90%] sm:max-w-[75%] lg:max-w-[70%]">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0 mt-0.5" style="background:var(--error); font-family:'DM Sans','Noto Sans SC',sans-serif;">!</div>
                <div class="flex-1 min-w-0 flex flex-col gap-1">
                  <div class="px-4 py-3 rounded-2xl text-error-700 bg-error-50 border border-error-200 text-[14px]" style="border-radius:var(--radius-lg);">
                    <p class="font-semibold mb-1">请求失败 (${esc(err.type || 'UNKNOWN')})</p>
                    <p>${esc(err.message || '未知错误')}</p>
                  </div>
                </div>
              </div>`;
      }

      // ===== Diagnosis card (conditional, skip_allowed=false 才显示) =====
      function diagnosisCardTemplate(diagnosis, context) {
        if (!diagnosis || diagnosis.skip_allowed !== false) return '';
        const weakKPs = (diagnosis.weak_points || []).map((name) =>
          `<span class="inline-flex items-center h-6 px-2.5 rounded-md text-xs font-medium whitespace-nowrap" style="background:var(--color-warning-100); color:var(--color-warning-800);">${esc(name)}</span>`
        ).join('');
        const strongKPs = (diagnosis.strong_points || []).map((name) =>
          `<span class="inline-flex items-center h-6 px-2.5 rounded-md text-xs font-medium whitespace-nowrap" style="background:var(--color-info-100); color:var(--color-info-700);">${esc(name)}</span>`
        ).join('');
        const masteryPct = context && context.current_mastery && context.current_mastery.mastery_score != null
          ? context.current_mastery.mastery_score : null;
        const masteryText = masteryPct != null
          ? `<span class="font-bold text-base" style="color:var(--warning);">${masteryPct}%</span>` : '—';
        return `
              <div class="msg-enter dynamic-msg flex gap-3 items-start max-w-[90%] sm:max-w-[75%] lg:max-w-[70%]">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0 mt-0.5" style="background:var(--brand); font-family:'DM Sans','Noto Sans SC',sans-serif;">AI</div>
                <div class="flex-1 min-w-0 flex flex-col gap-2">
                  <div class="border rounded-2xl p-4" style="background:linear-gradient(135deg,var(--color-success-50) 0%,var(--color-success-50) 100%); border-color:var(--color-success-200); border-radius:var(--radius-lg);">
                    <div class="flex items-start gap-2.5">
                      <div class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 mt-0.5" style="background:var(--success);">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-white"></i>
                      </div>
                      <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold mb-1.5" style="color:var(--color-success-700); font-family:'DM Sans','Noto Sans SC',sans-serif;">诊断结果</p>
                        <p class="text-sm leading-relaxed mb-3" style="color:var(--color-success-600);">
                          ${esc(diagnosis.summary || '')} 掌握度为 ${masteryText}${diagnosis.weak_points && diagnosis.weak_points.length ? '，建议先复习薄弱前置知识。' : '。'}
                        </p>
                        ${(weakKPs || strongKPs) ? `<div class="flex flex-wrap gap-1.5 mb-3">${weakKPs}${strongKPs}</div>` : ''}
                        <button data-dom-id="tutor-to-mastery" class="inline-flex items-center gap-1.5 h-8 px-3 rounded-full text-xs font-medium transition-all hover:opacity-90 text-white" style="background:var(--success);">
                          <i data-lucide="network" class="w-3.5 h-3.5"></i>
                          查看知识图谱
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>`;
      }

      // ===== Unified message dispatch =====
      function messageTemplate(msg) {
        if (msg.role === 'user') return userMessageTemplate(msg);
        if (msg.role === 'assistant') {
          if (msg.error) return errorMessageTemplate(msg);
          return assistantMessageTemplate(msg);
        }
        return '';
      }

      // ===== Render all messages (insert BEFORE spacer .h-2) =====
      function renderMessages(messages) {
        const listEl = document.getElementById('messages');
        if (!listEl) return;
        let html = '';
        for (const msg of messages) {
          html += messageTemplate(msg);
          if (msg.role === 'assistant' && msg.diagnosis && msg.diagnosis.skip_allowed === false) {
            html += diagnosisCardTemplate(msg.diagnosis, msg.context);
          }
        }
        // Clear all existing dynamic messages (between welcome msg and spacer)
        const existingDynamic = listEl.querySelectorAll('.msg-enter.dynamic-msg');
        existingDynamic.forEach(el => el.remove());
        const spacer = listEl.querySelector('.h-2');
        if (spacer) spacer.insertAdjacentHTML('beforebegin', html);
        else listEl.insertAdjacentHTML('beforeend', html);
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        scrollToBottom();
      }

      // ===== Render loading (D46 typing indicator + input/send disable) =====
      function renderLoading() {
        const messagesEl = document.getElementById('messages');
        const textarea = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const existing = document.getElementById('typing-indicator');
        if (existing) existing.remove();
        if (conversationState.loading) {
          const typing = `
              <div id="typing-indicator" class="msg-enter dynamic-msg flex gap-3 items-start max-w-[90%] sm:max-w-[75%] lg:max-w-[70%]">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0 mt-0.5" style="background:var(--brand); font-family:'DM Sans','Noto Sans SC',sans-serif;">AI</div>
                <div class="px-4 py-3.5 rounded-2xl rounded-tl-md flex items-center gap-2 bg-surface-tertiary" style="border-radius:var(--radius-lg); border-top-left-radius:6px">
                  <span class="typing-dot w-2 h-2 rounded-full" style="background:var(--brand);"></span>
                  <span class="typing-dot w-2 h-2 rounded-full" style="background:var(--brand);"></span>
                  <span class="typing-dot w-2 h-2 rounded-full" style="background:var(--brand);"></span>
                  <span class="text-xs text-foreground-muted ml-1">正在思考…</span>
                </div>
              </div>`;
          const spacer = messagesEl.querySelector('.h-2');
          if (spacer) spacer.insertAdjacentHTML('beforebegin', typing);
          else messagesEl.insertAdjacentHTML('beforeend', typing);
          if (textarea) { textarea.disabled = true; textarea.classList.add('opacity-50'); }
          if (sendBtn) { sendBtn.disabled = true; sendBtn.classList.add('opacity-50', 'cursor-not-allowed'); }
          scrollToBottom();
        } else {
          if (textarea) { textarea.disabled = false; textarea.classList.remove('opacity-50'); }
          if (sendBtn) { sendBtn.disabled = false; sendBtn.classList.remove('opacity-50', 'cursor-not-allowed'); }
        }
      }

      // ===== Scroll to bottom (D47a: force smooth) =====
      function scrollToBottom() {
        const messagesEl = document.getElementById('messages');
        if (!messagesEl) return;
        try { messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' }); }
        catch (_) { messagesEl.scrollTop = messagesEl.scrollHeight; }
      }

      // ===== sendMessage — Phase 3 imperative state mgmt =====
      async function sendMessage() {
        if (conversationState.loading) return;
        const textarea = document.getElementById('chat-input');
        const question = (textarea?.value || '').trim();
        if (!question) return;
        textarea.value = '';
        textarea.style.height = 'auto';
        conversationState.messages.push({ role: 'user', content: question, timestamp: Date.now() });
        renderMessages(conversationState.messages);
        conversationState.loading = true;
        renderLoading();
        const mockName = pickMockName(question);
        try {
          const res = await tutor.ask({ question, subject: conversationState.subject, mockName });
          conversationState.messages.push({
            role: 'assistant',
            content: res.data.response || '',
            diagnosis: res.data.diagnosis,
            learningPath: res.data.learning_path,
            metadata: res.data.metadata,
            context: res.data.context,
            timestamp: Date.now(),
          });
        } catch (err) {
          conversationState.messages.push({
            role: 'assistant', content: '',
            error: { type: err.type || 'UNKNOWN', code: err.code, message: err.message || '请求失败' },
            timestamp: Date.now(),
          });
          console.error('[Slice4] ask error:', err.type, err.code, err.message);
        } finally {
          conversationState.loading = false;
          renderMessages(conversationState.messages);
          renderLoading();
        }
      }

      // ===== Event handlers (D43: Enter + IME + send button) =====
      const chatInputEl = document.getElementById('chat-input');
      if (chatInputEl) {
        chatInputEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            sendMessage();
          }
        });
      }
      const sendBtnEl = document.getElementById('send-btn');
      if (sendBtnEl) {
        sendBtnEl.addEventListener('click', sendMessage);
      }

      // ===== Slice 3.2: '加入错题本' 按钮 → wrong.createQuestion (cross-page) =====
      const messagesEl2 = document.getElementById('messages');
      if (messagesEl2) {
        messagesEl2.addEventListener('click', async (e) => {
          const btn = e.target.closest('[data-dom-id="tutor-add-wrong"]');
          if (!btn || btn.disabled) return;
          btn.disabled = true;
          const orig = btn.innerHTML;
          btn.innerHTML = '<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> 添加中...';
          if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
          const questionText = btn.dataset.questionText || '';
          try {
            await wrong.createQuestion({
              question: questionText,
              subject: conversationState.subject,
              answer: '',
              analysis: '',
              difficulty: 3,
            });
            btn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i> 已加入';
            if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
            console.log('[Slice4] question added to wrong-book');
            setTimeout(() => {
              btn.disabled = false;
              btn.innerHTML = orig;
              if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
            }, 3000);
          } catch (err) {
            btn.disabled = false;
            btn.innerHTML = orig;
            if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
            console.error('[Slice4] add-wrong error:', err.type, err.code, err.message);
          }
        });
      }

      // ===== Initial: 5 hardcoded blocks 已删, renderMessages([]) 处理空数组 =====
      renderMessages(conversationState.messages);
    </script>

    <script>lucide.createIcons();</script>
</body>
</html>
