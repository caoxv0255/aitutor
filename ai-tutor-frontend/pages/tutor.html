<body class="min-h-screen font-sans antialiased">
    <main>
      <style>
        :root {
          --brand: #d71920;
          --brand-dark: #b8151b;
          --brand-light: #fff1f1;
          --brand-mid: #ffe0e0;
          --success: #059669;
          --success-light: #ecfdf5;
          --warning: #f59e0b;
          --warning-light: #fffbeb;
          --error: #ef4444;
          --info: #0284c7;
          --info-light: #f0f9ff;
          --radius-sm: 8px;
          --radius-md: 14px;
          --radius-lg: 16px;
          --radius-pill: 9999px;
        }
        @keyframes bounce-dot {
          0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
          40% { transform: scale(1); opacity: 1; }
        }
        @keyframes blink-cursor {
          0%, 50% { opacity: 1; }
          51%, 100% { opacity: 0; }
        }
        @keyframes fade-in-up {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .typing-dot {
          animation: bounce-dot 1.4s ease-in-out infinite both;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.16s; }
        .typing-dot:nth-child(3) { animation-delay: 0.32s; }
        .blink-cursor {
          display: inline-block;
          width: 2px;
          height: 1em;
          background: var(--brand);
          margin-left: 2px;
          vertical-align: text-bottom;
          animation: blink-cursor 0.9s step-end infinite;
          border-radius: 1px;
        }
        .msg-enter {
          animation: fade-in-up 0.35s ease-out both;
        }
        .formula-inline {
          font-family: 'DM Sans', 'Cambria Math', 'Times New Roman', serif;
          font-style: italic;
          letter-spacing: 0.02em;
        }
        .formula-block {
          font-family: 'DM Sans', 'Cambria Math', 'Times New Roman', serif;
          background: var(--color-surface-code);
          color: var(--color-on-dark);
          border-radius: var(--radius-md);
          padding: 16px 20px;
          margin: 12px 0;
          overflow-x: auto;
          font-size: 17px;
          line-height: 1.8;
          letter-spacing: 0.03em;
        }
        .formula-block .frac {
          display: inline-flex;
          flex-direction: column;
          align-items: center;
          vertical-align: middle;
          margin: 0 4px;
        }
        .formula-block .frac-num {
          border-bottom: 1.5px solid var(--color-on-dark);
          padding: 0 6px 2px;
        }
        .formula-block .frac-den {
          padding: 2px 6px 0;
        }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }
        .subject-tag-active {
          background: var(--brand);
          color: var(--color-on-dark);
        }
        .history-item-active {
          background: var(--brand-light);
          color: var(--brand);
          font-weight: 500;
        }
        .chat-input {
          border: 2px solid transparent;
          transition: border-color 0.2s, box-shadow 0.2s;
        }
        .chat-input:focus {
          border-color: var(--brand);
          box-shadow: 0 0 0 3px rgba(215,25,32,0.12);
        }
      </style>

      <div class="h-screen flex flex-col overflow-hidden bg-surface" style="font-family: 'Noto Sans SC','DM Sans',sans-serif;">

        <!-- ========== 顶部固定栏 ========== -->
        <header class="flex items-center justify-between h-14 px-3 sm:px-5 border-b border-border-light shrink-0 bg-surface z-20 relative">
          <div class="flex items-center gap-2 sm:gap-3 min-w-0">

            <div class="flex items-center gap-2 min-w-0">
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0" style="background: var(--brand); font-family: 'DM Sans','Noto Sans SC',sans-serif;">AI</div>

            </div>

            <!-- 学科选择下拉 (D37a native select, Phase 2 验证 state binding) -->

                <option value="政治">政治</option>

        <div class="flex flex-1 min-h-0">

          <!-- ========== 左侧对话历史（桌面端显示） ========== -->
          <aside class="hidden lg:flex w-64 flex-col border-r border-border-light bg-surface-tertiary/60 shrink-0">

                <i data-lucide="plus" class="w-4 h-4"></i>

            </div>
            <div class="p-3 border-t border-border-light">

                <div class="min-w-0 flex-1">

          <!-- ========== 中间主区域 ========== -->
          <div class="flex-1 flex flex-col min-w-0">

            <!-- 消息流区域 -->
            <div id="messages" class="flex-1 overflow-y-auto chat-scroll px-4 sm:px-6 lg:px-8 py-5 space-y-5" style="scroll-behavior:smooth;">

              <!-- 1. AI 欢迎消息 -->
              <div class="msg-enter flex gap-3 items-start max-w-[90%] sm:max-w-[75%] lg:max-w-[70%]">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0 mt-0.5" style="background:var(--brand); font-family:'DM Sans','Noto Sans SC',sans-serif;">AI</div>
                <div class="flex flex-col gap-1">
                  <div class="px-4 py-3 rounded-2xl rounded-tl-md text-foreground leading-relaxed text-[15px] bg-surface-tertiary" style="border-radius:var(--radius-lg); border-top-left-radius:6px">
                    你好！我是AI tutor，有什么题目不会做吗？你可以直接输入问题，或者拍照搜题。
                  </div>
                  <span class="text-xs text-foreground-muted ml-1">刚刚</span>
                </div>
              </div>

              <!-- 底部留白，防止内容被输入区遮挡 -->
              <div class="h-2"></div>
            </div>

            <!-- ========== 底部输入区域 ========== -->
            <div class="border-t border-border-light bg-surface px-3 sm:px-5 py-3 shrink-0">
              <!-- 学科快捷标签 (Phase 2 动态渲染, 默认 4 个) -->
              <div id="subject-tags" class="flex items-center gap-2 mb-2.5 overflow-x-auto no-scrollbar">
                <!-- 4 quick tags rendered by F3 script module (see bottom of file) -->
              </div>

              <!-- 输入框 + 按钮 -->
              <div class="flex items-end gap-2 sm:gap-2.5">
                <!-- 附件按钮 -->
                <button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-tertiary transition-colors shrink-0 self-end mb-0.5" title="添加附件" aria-label="添加附件">
                  <i data-lucide="paperclip" class="w-5 h-5 text-foreground-secondary"></i>
                </button>

                <!-- 文本输入框 -->
                <div class="flex-1 min-w-0 relative">
                  <textarea
                    id="chat-input"
                    rows="1"
                    placeholder="输入你的问题，支持 LaTeX 公式..."
                    class="chat-input w-full resize-none px-4 py-2.5 pr-4 text-[15px] leading-6 outline-none transition-all max-h-32 overflow-y-auto bg-surface-tertiary"
                    style="border-radius:var(--radius-lg); font-family:'Noto Sans SC','DM Sans',sans-serif"
                    oninput="this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,128)+'px';"
                  ></textarea>

                <button id="send-btn" data-dom-id="tutor-send" class="flex items-center justify-center w-10 h-10 rounded-full text-white transition-all hover:opacity-90 active:scale-95 shrink-0 self-end mb-0.5 disabled:opacity-50 disabled:cursor-not-allowed" style="background:var(--brand);" title="发送" aria-label="发送">

    <!-- ===== F3 Slice 4.1 — Workspace Shell 数据接入样板 (Phase 2 read-only MVP) ===== -->
    <section id="ait-f3-status" class="ait-page" style="padding:0;padding-bottom:24px;">
      <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <span class="ait-badge ait-badge-primary">F3 Slice 4.1</span>
        <span style="color:var(--color-muted-foreground);font-size:13px">
          tutor Workspace Shell 数据接入样板 (Workspace Adapter 首次验证 — history + subject 双向绑定, 不接 chat input)
        </span>
      </div>
    </section>

    <script type="module">
      import { tutor, wrong, rag } from '../assets/js/api/services/index.js';
      import { useAsyncResource } from '../assets/js/hooks/useAsyncResource.js';
      import { mountErrorBoundary } from '../assets/js/components/error-boundary.js';
      import { setUseMock } from '../assets/js/api/USE_MOCK.js';
      import { toast } from '../assets/js/toast.js';

      mountErrorBoundary();
      setUseMock(false);  // P0.7 (2026-08-15): ask/askStream 真后端 + history 走 localStorage

      // ===== SUBJECTS 9 学科 (D35a hardcode, 跟 wrong-book SUBJECT_MAP 一致) =====
      const SUBJECTS = ['数学', '语文', '英语', '物理', '化学', '政治', '生物', '历史', '地理'];

      // ===== conversationState (D33, long-lived, 6 字段固定顺序, 4.3 加 streamController 第 7 字段) =====
      const conversationState = {
        subject: '数学',
        currentSessionId: null,
        sessions: [],
        messages: [],
        loading: false,
        error: null,
        streamController: null,  // 4.3 加: AbortController for SSE
      };

      // ===== Slice 4.4 commit 1: localStorage session store (D56) =====
      // Schema: { [sid]: { id, title, subject, messages, lastMessageAt } }
      const LS_KEY = 'aitutor.tutor.sessions';

      function loadSessionStore() {
        try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
        catch (_) { return {}; }
      }

      function saveSessionStore(store) {
        try { localStorage.setItem(LS_KEY, JSON.stringify(store)); }
        catch (_) { /* quota exceeded 等忽略 */ }
      }

      function loadSessionMessages(sid) {
        const store = loadSessionStore();
        return (store[sid] && store[sid].messages) || [];
      }

      function saveSession(sid, subject, messages) {
        if (!sid) return;
        const store = loadSessionStore();
        // 第一次存: title 从 first user message 截取
        let title = store[sid]?.title;
        if (!title && messages.length > 0) {
          const firstUser = messages.find(m => m.role === 'user');
          title = firstUser ? firstUser.content.slice(0, 30) : '新对话';
        }
        store[sid] = {
          ...(store[sid] || {}),
          id: sid,
          subject,
          title,
          messages,
          lastMessageAt: new Date().toISOString(),
        };
        saveSessionStore(store);
      }

      // ===== Slice 4.4 commit 1: ?sid=X URL 解析 (D58) =====
      function parseSidFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('sid');
      }

      function setSidInUrl(sid, replace = true) {
        const url = new URL(window.location.href);
        if (sid) url.searchParams.set('sid', sid);
        else url.searchParams.delete('sid');
        // replace 不污染 history (避免每条消息多一条 history entry)
        if (replace) window.history.replaceState({}, '', url);
        else window.history.pushState({}, '', url);
      }

      // ===== Escape helper =====
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      // ===== renderHistory: sidebar list from conversationState.sessions =====
      function renderHistory(sessions) {
        const listEl = document.getElementById('chat-history-list');
        if (!listEl) return;
        if (!sessions || sessions.length === 0) {
          listEl.innerHTML = '<li class="px-3 py-2.5 text-sm text-foreground-secondary">暂无历史对话</li>';
          return;
        }
        listEl.innerHTML = sessions.map((s) => {
          // 4.4: active by id, not by idx
          const isActive = s.id === conversationState.currentSessionId;
          const activeClass = isActive ? 'history-item-active' : 'text-foreground-secondary hover:bg-surface';
          const iconColor = isActive ? '' : 'text-foreground-muted';
          return `<li data-session-id="${esc(s.id)}" class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm cursor-pointer transition-colors ${activeClass}" data-domain-id="tutor-history-item"><i data-lucide="message-square" class="w-4 h-4 shrink-0 ${iconColor}"></i><span class="truncate">${esc(s.title)}</span></li>`;
        }).join('');
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
      }

      // ===== renderSubjectTags: 4 quick tags (Phase 2 范围) =====
      function renderSubjectTags() {
        const tagsEl = document.getElementById('subject-tags');
        if (!tagsEl) return;
        const quickSubjects = SUBJECTS.slice(0, 4);  // 数学/语文/英语/物理
        tagsEl.innerHTML = quickSubjects.map((subj) => {
          const isActive = subj === conversationState.subject;
          const activeClass = isActive ? 'subject-tag-active' : 'text-foreground-secondary bg-surface-tertiary hover:bg-border-light';

      // ===== syncSubjectDropdown: 同步 native select value =====
      function syncSubjectDropdown() {
        const sel = document.getElementById('subject-dropdown');

      // ===== 主数据流: history list (Phase 2 only) =====
      const historyRes = useAsyncResource(() => tutor.getHistory());

        if (error) {
          console.error('[Slice4] history error:', error.type, error.code, error.message);

        }
        if (loading && !data) return;
        if (data) {
          conversationState.sessions = data.data || [];

      // ===== Event handlers (D18 event delegation 风格) =====

      // ===== Helper: format timestamp =====
      function fmtTime(ts) {
        if (!ts) return '';

      // ===== Message template: user bubble (right-aligned) =====
      function userMessageTemplate(msg) {
        return `

      // ===== Slice 4.3 commit 3: inline markdown (D53 escape → regex) =====
      // 顺序: escape 先 (XSS), markdown regex 后 (LLM 输出 '<script>' 仍被 escape 守住)
      function renderInlineMd(escaped) {
        if (!escaped) return '';
        // **bold** → <strong>
        let out = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold">$1</strong>');
        // `code` → <code>
        out = out.replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-surface-tertiary text-[13px] font-mono">$1</code>');
        // $..$ inline LaTeX → <span class="math-latex" data-latex="..."> (KaTeX 留 Slice 4.5)
        out = out.replace(/\$([^$]+)\$/g, '<span class="math-latex italic text-foreground-secondary" data-latex="$1">$1</span>');
        return out;
      }

        return `

                <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0 mt-0.5" style="background:var(--brand); font-family:'DM Sans','Noto Sans SC',sans-serif;">AI</div>
                <div class="flex-1 min-w-0 flex flex-col gap-1">

                    <button data-dom-id="tutor-add-wrong" data-question-id="${esc(msg.questionId || ('new_' + Date.now()))}" data-question-text="${esc((msg.content || '').slice(0, 200))}" class="inline-flex items-center gap-1.5 h-7 px-3 rounded-full text-xs font-medium text-white transition-all hover:opacity-90 disabled:opacity-50" style="background:var(--brand);">
                      <i data-lucide="bookmark-plus" class="w-3.5 h-3.5"></i>
                      加入错题本

      }

                          ${esc(diagnosis.summary || '')} 掌握度为 ${masteryText}${diagnosis.weak_points && diagnosis.weak_points.length ? '，建议先复习薄弱前置知识。' : '。'}
                        </p>
                        ${(weakKPs || strongKPs) ? `<div class="flex flex-wrap gap-1.5 mb-3">${weakKPs}${strongKPs}</div>` : ''}
                        <button data-dom-id="tutor-to-mastery" class="inline-flex items-center gap-1.5 h-8 px-3 rounded-full text-xs font-medium transition-all hover:opacity-90 text-white" style="background:var(--success);">
                          <i data-lucide="network" class="w-3.5 h-3.5"></i>

      }

      // ===== Unified message dispatch =====
      function messageTemplate(msg) {
        if (msg.role === 'user') return userMessageTemplate(msg);
        if (msg.role === 'assistant') {
          if (msg.error) return errorMessageTemplate(msg);
          return assistantMessageTemplate(msg);
        }
        return '';
      }

      // ===== Render all messages (insert BEFORE spacer .h-2) =====
      function renderMessages(messages) {
        const listEl = document.getElementById('messages');
        if (!listEl) return;
        let html = '';
        for (const msg of messages) {
          html += messageTemplate(msg);
          if (msg.role === 'assistant' && msg.diagnosis && msg.diagnosis.skip_allowed === false) {
            html += diagnosisCardTemplate(msg.diagnosis, msg.context);
          }
        }
        // Clear all existing dynamic messages (between welcome msg and spacer)
        const existingDynamic = listEl.querySelectorAll('.msg-enter.dynamic-msg');
        existingDynamic.forEach(el => el.remove());
        const spacer = listEl.querySelector('.h-2');
        if (spacer) spacer.insertAdjacentHTML('beforebegin', html);
        else listEl.insertAdjacentHTML('beforeend', html);
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        scrollToBottom();
      }

      // ===== Render loading (D46 typing indicator + input/send disable) =====
      function renderLoading() {
        const messagesEl = document.getElementById('messages');
        const textarea = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const existing = document.getElementById('typing-indicator');
        if (existing) existing.remove();
        if (conversationState.loading) {
          const typing = `
              <div id="typing-indicator" class="msg-enter dynamic-msg flex gap-3 items-start max-w-[90%] sm:max-w-[75%] lg:max-w-[70%]">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0 mt-0.5" style="background:var(--brand); font-family:'DM Sans','Noto Sans SC',sans-serif;">AI</div>
                <div class="px-4 py-3.5 rounded-2xl rounded-tl-md flex items-center gap-2 bg-surface-tertiary" style="border-radius:var(--radius-lg); border-top-left-radius:6px">
                  <span class="typing-dot w-2 h-2 rounded-full" style="background:var(--brand);"></span>
                  <span class="typing-dot w-2 h-2 rounded-full" style="background:var(--brand);"></span>
                  <span class="typing-dot w-2 h-2 rounded-full" style="background:var(--brand);"></span>
                  <span class="text-xs text-foreground-muted ml-1">正在思考…</span>
                </div>
              </div>`;
          const spacer = messagesEl.querySelector('.h-2');
          if (spacer) spacer.insertAdjacentHTML('beforebegin', typing);
          else messagesEl.insertAdjacentHTML('beforeend', typing);
          if (textarea) { textarea.disabled = true; textarea.classList.add('opacity-50'); }
          if (sendBtn) { sendBtn.disabled = true; sendBtn.classList.add('opacity-50', 'cursor-not-allowed'); }
          scrollToBottom();
        } else {
          if (textarea) { textarea.disabled = false; textarea.classList.remove('opacity-50'); }
          if (sendBtn) { sendBtn.disabled = false; sendBtn.classList.remove('opacity-50', 'cursor-not-allowed'); }
        }
      }

      // ===== Scroll to bottom (D47a: force smooth) =====
      function scrollToBottom() {
        const messagesEl = document.getElementById('messages');
        if (!messagesEl) return;
        try { messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' }); }
        catch (_) { messagesEl.scrollTop = messagesEl.scrollHeight; }
      }

      // ===== sendMessage — Slice 4.3 commit 2: streaming version (D52 + D55) =====
      async function sendMessage() {
        if (conversationState.loading) return;
        const textarea = document.getElementById('chat-input');
        const question = (textarea?.value || '').trim();
        if (!question) return;
        textarea.value = '';
        textarea.style.height = 'auto';
        // 1. Optimistic user bubble
        conversationState.messages.push({ role: 'user', content: question, timestamp: Date.now() });
        renderMessages(conversationState.messages);
        // 2. Loading state + AbortController (D55)
        conversationState.loading = true;
        const streamController = new AbortController();
        conversationState.streamController = streamController;
        renderLoading();
        // 3. Streaming assistant bubble (创建空 bubble, content 累加)
        const assistantMsg = {
          role: 'assistant',
          content: '',
          diagnosis: null,
          learningPath: null,
          metadata: null,
          context: null,
          timestamp: Date.now(),
        };
        conversationState.messages.push(assistantMsg);
        const assistantMsgIndex = conversationState.messages.length - 1;
        // 4.4 commit 2: 新对话分配 tmp sessionId (流完成时如果没 currentSessionId 就用这个)
        if (!conversationState.currentSessionId) {
          assistantMsg._tmpSid = `tmp_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
        }
        // 4. Call askStream
        try {
          await tutor.askStream({
            question,
            subject: conversationState.subject,
            signal: streamController.signal,
            mockName: 'tutor_ask_stream',  // commit 2 强制走 stream mock
            onEvent: (ev) => {
              if (ev.event === 'metadata') {
                // 立即填充 diagnosis / context, 触发诊断卡片渲染
                assistantMsg.diagnosis = ev.data.diagnosis;
                assistantMsg.context = ev.data.context;
                // 2026-08-19 DSH: 隐性 RAG — 在 AI 回答末尾附"参考了 N 道相似题", 前端自调 rag.search
                // 理由: 后端 stream 事件只给 count 不给具体题, 前端自调一次拿到 Top-3 显示给用户
                rag.search({
                  query: question,
                  subject: conversationState.subject,
                  topK: 3,
                  threshold: 0.4,
                }).then(r => {
                  const hits = r?.data?.results || [];
                  if (hits.length > 0) {
                    assistantMsg.ragHits = hits;
                    scheduleRenderMessages();
                  }
                }).catch(() => { /* 静默失败, AI 回答照常 */ });
                scheduleRenderMessages();  // rAF throttle
              } else if (ev.event === 'content') {
                // 累加 content
                assistantMsg.content += ev.data.delta || '';
                scheduleRenderMessages();  // rAF throttle (高频)
              } else if (ev.event === 'done') {
                // 流结束: rAF flush 一次
                if (renderRafId) {
                  cancelAnimationFrame(renderRafId);
                  renderRafId = null;
                }
                renderMessages(conversationState.messages);
                console.log('[Slice4.3] stream done:', ev.data);
                // Slice 4.4 commit 2: 流完成 → 持久化到 localStorage (D56+D57)
                // 若有 currentSessionId (历史 session 续聊) 或 临时 sessionId
                if (assistantMsg.content) {
                  saveSession(
                    conversationState.currentSessionId || `tmp_${Date.now()}`,
                    conversationState.subject,
                    conversationState.messages
                  );
                  // 如果是临时 session, 设为 currentSessionId 并更新 URL
                  if (!conversationState.currentSessionId) {
                    conversationState.currentSessionId = assistantMsg._tmpSid;
                  }
                }
              } else if (ev.event === 'error') {
                assistantMsg.content = ev.data.message || '流式错误';
                assistantMsg.error = { type: 'STREAM', code: null, message: ev.data.message };
                renderMessages(conversationState.messages);
              }
            },
          });
        } catch (err) {
          // D55: AbortError 不是 error, 用户自己停
          if (err.name === 'AbortError') {
            console.log('[Slice4.3] stream aborted by user');
            return;  // 不追加 error bubble, 已经在 final 里 reset loading
          }
          // 移除空 assistant bubble, 加 error bubble
          conversationState.messages.splice(assistantMsgIndex, 1);
          conversationState.messages.push({
            role: 'assistant', content: '',
            error: { type: err.type || 'UNKNOWN', code: err.code, message: err.message || '请求失败' },
            timestamp: Date.now(),
          });
          console.error('[Slice4.3] stream error:', err.type, err.code, err.message);
        } finally {
          conversationState.loading = false;
          conversationState.streamController = null;
          renderMessages(conversationState.messages);
          renderLoading();
        }
      }

      // ===== Slice 4.4 commit 3: 5 dead buttons live + 新建对话 toast =====
      // 1. 查看知识图谱 (dialog card 里的按钮)
      const toMasteryBtn = document.querySelector('[data-dom-id="tutor-to-mastery"]');
      if (toMasteryBtn) {
        toMasteryBtn.addEventListener('click', () => {
          window.location.href = './mastery.html';

      // 2. 拍照搜题 (input bar 里的相机按钮)
      const toVisionBtn = document.querySelector('[data-dom-id="tutor-to-vision"]');
      if (toVisionBtn) {

      // 3. 清空对话 (header 里的 trash 按钮)
      const clearBtn = document.getElementById('clear-chat-btn');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          if (!confirm('清空当前对话? 历史会话保留。')) return;
          conversationState.messages = [];
          conversationState.error = null;
          conversationState.currentSessionId = null;
          setSidInUrl(null);
          renderMessages([]);
          const messagesEl = document.getElementById('messages');
          if (messagesEl) messagesEl.scrollTop = 0;
          toast.success('已清空当前对话');
        });
      }

      // 4. "新建对话" 增强 — 加 toast 提示 (sidebar > first button > i.lucide-plus)
      const newConvBtn = document.querySelector('aside .lucide-plus')?.closest('button');
      if (newConvBtn) {
        newConvBtn.addEventListener('click', () => {
          conversationState.currentSessionId = null;
          conversationState.messages = [];
          conversationState.error = null;
          setSidInUrl(null);
          renderHistory(conversationState.sessions);
          renderMessages(conversationState.messages);
          const messagesEl = document.getElementById('messages');
          if (messagesEl) messagesEl.scrollTop = 0;
          toast.success('已切换到新对话');
          console.log('[Slice4.4] new conversation');
        });
      }

      // 5. "åæ­¢çæ" - send-btn dual role (Slice 4.4 commit 5)
      // streaming -> abort + red square icon; else sendMessage
      const sendBtnRef = document.getElementById("send-btn");
      if (sendBtnRef) {
        const newSendBtn = sendBtnRef.cloneNode(true);
        sendBtnRef.parentNode.replaceChild(newSendBtn, sendBtnRef);
        newSendBtn.addEventListener("click", () => {
          if (conversationState.loading && conversationState.streamController) {
            conversationState.streamController.abort();
            console.log("[Slice4.4] stream aborted by user via send-btn");
            toast.info("å·²åæ­¢çæ");
          } else {
            sendMessage();
          }
        });
      }

      // ===== Slice 4.4 commit 5: send-btn visual sync =====
      function refreshSendBtn() {
        const btn = document.getElementById("send-btn");
        if (!btn) return;
        const streaming = conversationState.loading;
        btn.title = streaming ? "åæ­¢çæ" : "åé";
        btn.setAttribute("aria-label", btn.title);
        const icon = btn.querySelector("i[data-lucide]");
        if (icon) {
          icon.setAttribute("data-lucide", streaming ? "square" : "send-horizontal");
          if (window.lucide) window.lucide.createIcons();
        }
        btn.style.background = streaming ? "var(--error, #dc2626)" : "var(--brand)";
      }
      refreshSendBtn();
      setInterval(refreshSendBtn, 250);

      // ===== Slice 4.4 commit 2: history item click → load session + URL sync =====
      const historyListEl = document.getElementById('chat-history-list');
      if (historyListEl) {
        historyListEl.addEventListener('click', (e) => {
          const li = e.target.closest('li[data-session-id]');
          if (!li) return;
          const sid = li.dataset.sessionId;
          if (!sid || sid === conversationState.currentSessionId) return;
          // 加载 session: 从 LS 读 messages, 切换 currentSessionId, 更新 URL
          conversationState.currentSessionId = sid;
          conversationState.messages = loadSessionMessages(sid);
          // 切 subject (如果 LS 存了)
          const store = loadSessionStore();
          if (store[sid] && store[sid].subject) {
            conversationState.subject = store[sid].subject;
            syncSubjectDropdown();
            renderSubjectTags();
          }
          setSidInUrl(sid);
          renderHistory(conversationState.sessions);
          renderMessages(conversationState.messages);
          scrollToBottom();
          console.log('[Slice4.4] switched to session:', sid);
        });
      }

      // ===== D55: 切页面/refresh 自动 abort =====
      window.addEventListener('beforeunload', () => {
        if (conversationState.streamController) {
          conversationState.streamController.abort();
        }
      });
      // visibilitychange: 切到后台 5s 后 abort (saves backend resources)
      let hideTimer = null;
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          hideTimer = setTimeout(() => {
            if (conversationState.streamController) conversationState.streamController.abort();
          }, 5000);
        } else if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }
      });

      // ===== Event handlers (D43: Enter + IME + send button) =====
      const chatInputEl = document.getElementById('chat-input');
      if (chatInputEl) {
        chatInputEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            sendMessage();
          }
        });
      }
      const sendBtnEl = document.getElementById('send-btn');
      if (sendBtnEl) {
        sendBtnEl.addEventListener('click', sendMessage);
      }

      // ===== Slice 4.4 commit 3 D59 REVERSAL: navigate wrong-book.html?highlight=QID =====
      // Owner framing: navigate is physical closure of cross-page loop, not just notification.
      const messagesEl2 = document.getElementById('messages');
      if (messagesEl2) {
        messagesEl2.addEventListener('click', async (e) => {
          const btn = e.target.closest('[data-dom-id="tutor-add-wrong"]');
          if (!btn || btn.disabled) return;
          btn.disabled = true;
          const questionText = btn.dataset.questionText || '';
          const qid = btn.dataset.questionId || '';
          btn.innerHTML = '<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> 添加中...';
          if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
          try {
            const res = await wrong.createQuestion({
              question: questionText,
              subject: conversationState.subject,
              answer: '',
              analysis: '',
              difficulty: 3,
            });
            // mock has data.id; real backend will too
            const newId = (res && res.data && res.data.id) || qid;
            toast.success('已加入错题本, 正在跳转...');
            console.log('[Slice4.4] question added to wrong-book, id=' + newId);
            // 800ms delay so toast is visible
            setTimeout(() => {
              window.location.href = './wrong-book.html?highlight=' + encodeURIComponent(newId);
            }, 800);
          } catch (err) {
            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="bookmark-plus" class="w-3.5 h-3.5"></i> 加入错题本';
            if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
            console.error('[Slice4.4] add-wrong error:', err.type, err.code, err.message);
            toast.error('加入失败: ' + (err.message || '未知错误'));
          }
        });
      }

      // ===== Slice 4.3 commit 2: streaming state (D54 imperative + rAF throttle) =====
      // conversationState 第 7 字段: streamController (AbortController for D55)
      conversationState.streamController = null;

      // rAF throttle: SSE chunks 可能 50-200/s, 不节流 scrollToBottom 会抖
      let renderRafId = null;
      function scheduleRenderMessages() {
        if (renderRafId) return;
        renderRafId = requestAnimationFrame(() => {
          renderRafId = null;
          renderMessages(conversationState.messages);
        });
      }

      // ===== Slice 4.4 commit 1: init - parse ?sid=X, load session, set currentSessionId =====
      const initSid = parseSidFromUrl();
      if (initSid) {
        // URL 指定 session: load messages from localStorage
        conversationState.currentSessionId = initSid;
        conversationState.messages = loadSessionMessages(initSid);
      }
      // 没 URL 参数: 默认第一项 (Phase 2 retro 兼容)
      // (sess_001 暂用空 messages, 因为 mock 只有 title 列表)

      // ===== Initial: 5 hardcoded blocks 已删, renderMessages([]) 处理空数组 =====
      renderMessages(conversationState.messages);
    </script>

    <script>lucide.createIcons();</script>
</body>
</html>
