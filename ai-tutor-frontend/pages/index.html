<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Tutor - 智启AI导师 (v2 迁移中)</title>

<!-- F1 Foundation: 4 层 CSS -->
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/tailwind-theme.css">
<link rel="stylesheet" href="../assets/css/aitutor.css">
<link rel="stylesheet" href="../assets/css/router.css">
<link rel="stylesheet" href="../assets/css/brand.css">

<style>
  body { padding-top: 64px; }
  .hero { padding: var(--spacing-7) var(--spacing-5); text-align: center; }
  .hero h1 { font-size: var(--text-5xl); font-weight: 800; margin: 0 0 var(--spacing-4); color: var(--color-foreground); }
  .hero p { font-size: var(--text-lg); color: var(--color-muted-foreground); margin: 0 0 var(--spacing-5); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacing-4); margin: var(--spacing-5) 0; }
  .stat { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-4); text-align: center; }
  .stat .num { font-size: var(--text-4xl); font-weight: 800; color: var(--color-primary); line-height: 1.2; }
  .stat .lbl { font-size: var(--text-sm); color: var(--color-muted-foreground); margin-top: var(--spacing-1); }
  @media (max-width: 768px) { .stats { grid-template-columns: repeat(2, 1fr); } .hero h1 { font-size: var(--text-3xl); } }
</style>
</head>
<body>
<main class="ait-page" id="app">
  <!-- Hero -->
  <div class="hero">
    <h1>AI Tutor <span class="ait-badge ait-badge-primary">v2 迁移中</span></h1>
    <p>F1 Foundation 验证页 — Service Layer + Design Token + Mock 已就绪</p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:24px">
      <button class="ait-btn ait-btn-primary" id="btn-load">加载 dashboard (Mock)</button>
      <button class="ait-btn ait-btn-outline" id="btn-theme">切换暗色主题</button>
    </div>
  </div>

  <!-- Stats (filled by JS) -->
  <div class="stats" id="stats">
    <div class="stat"><div class="num">—</div><div class="lbl">已答题数</div></div>
    <div class="stat"><div class="num">—</div><div class="lbl">正确率</div></div>
    <div class="stat"><div class="num">—</div><div class="lbl">薄弱点</div></div>
    <div class="stat"><div class="num">—</div><div class="lbl">学习天数</div></div>
  </div>

  <!-- Service Layer Demo -->
  <div class="ait-card" style="margin-top:32px">
    <h3 class="ait-card-title">🎯 Service Layer 验证</h3>
    <p class="ait-card-desc">7 个 service 已就绪: auth, user, exam, rag, knowledge, review, vision</p>
    <pre id="service-log" style="background:var(--color-surface-container-low);padding:16px;border-radius:8px;font-size:12px;margin-top:12px;max-height:200px;overflow:auto">点击 "加载 dashboard" 按钮测试...</pre>
  </div>
</main>

<!-- Lucide icons -->
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>

<!-- F1 Foundation JS -->
<script type="module">
  import { auth, user, exam, rag, knowledge, review, vision } from '../assets/js/api/services/index.js';
  import { setUseMock } from '../assets/js/api/USE_MOCK.js';
  import { toast } from '../assets/js/toast.js';
  import { isLoggedIn, logout } from '../assets/js/auth.js';
  import '../assets/js/router.js';

  // 默认开 mock
  setUseMock(true);

  window.AIT = { auth, user, exam, rag, knowledge, review, vision, toast, logout };

  const log = (msg) => {
    const el = document.getElementById('service-log');
    el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + el.textContent;
  };

  // 1. 加载 dashboard
  document.getElementById('btn-load').onclick = async () => {
    try {
      log('→ user.getDashboard() 调用...');
      const res = await user.getDashboard();
      log('← 返回: ' + JSON.stringify(res).slice(0, 200) + '...');
      const s = res.data.stats;
      document.querySelectorAll('#stats .stat').forEach((el, i) => {
        const vals = [s.questions_solved, (s.accuracy * 100).toFixed(1) + '%', s.weak_points_count, s.study_days];
        el.querySelector('.num').textContent = vals[i];
      });
      toast.success('Dashboard 加载成功');
    } catch (e) {
      log('✗ 错误: ' + e.message);
      toast.error(e.message);
    }
  };

  // 2. 暗色主题切换
  document.getElementById('btn-theme').onclick = () => {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.setItem('aitutor.theme', isDark ? 'dark' : 'light');
    toast.info('已切换到 ' + (isDark ? '暗色' : '亮色') + ' 主题');
  };

  // 3. 启动时恢复主题
  if (localStorage.getItem('aitutor.theme') === 'dark') {
    document.documentElement.classList.add('dark');
  }

  // 4. 启动 log
  log('✓ F1 Foundation 验证页加载');
  log('  USE_MOCK: true (URL 加 ?mock=false 关闭)');
  log('  Services: ' + Object.keys({auth, user, exam, rag, knowledge, review, vision}).join(', '));
  log('  Auth: ' + (isLoggedIn() ? '已登录' : '未登录'));

  // 自动渲染 lucide icons
  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
