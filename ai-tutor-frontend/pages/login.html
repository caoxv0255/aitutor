              <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform"></i>

          </div>

          <!-- Centered form container -->
          <div class="flex-1 flex items-center justify-center px-6 sm:px-8 pb-12 -mt-8">
            <div class="w-full max-w-[400px]">

              <!-- Mobile logo (only shown on small screens) -->
              <div class="lg:hidden flex items-center justify-center gap-3 mb-8">
                <div class="w-10 h-10 rounded-xl bg-primary-500 flex items-center justify-center shadow-md">
                  <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                </div>
                <span class="text-foreground text-lg font-semibold tracking-tight" style="font-family:'DM Sans','Noto Sans SC',sans-serif;">AI tutor</span>
              </div>

              <!-- Title block -->
              <div class="mb-8">
                <h2 class="text-[28px] font-bold text-foreground mb-2" style="font-family:'DM Sans','Noto Sans SC',sans-serif; text-wrap:balance; word-break:keep-all;">欢迎回来</h2>
                <p class="text-foreground-secondary text-[15px]" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">登录继续你的学习之旅</p>
              </div>





              <!-- ===== Panel 2: Password Login ===== -->
              <div id="panel-id" class="login-panel space-y-4" role="tabpanel">
                <!-- Account input -->
                <div class="space-y-1.5">
                  <label class="block text-sm font-medium text-foreground" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">邮箱</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <i data-lucide="user" class="w-[18px] h-[18px] text-foreground-muted"></i>
                    </div>
                    <input type="email" id="email-input" placeholder="请输入邮箱"
                      class="w-full h-10 pl-10 pr-3.5 rounded-[8px] border border-border bg-surface text-foreground text-sm placeholder:text-foreground-muted focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 focus:outline-none transition-all"
                      style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                  </div>
                  <p id="email-error" class="hidden text-xs text-error-500 flex items-center gap-1" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                    <i data-lucide="alert-circle" class="w-3 h-3"></i>
                    <span>请输入正确的邮箱</span>
                  </p>
                </div>

                <!-- Password input -->
                <div class="space-y-1.5">
                  <label class="block text-sm font-medium text-foreground" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">密码</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <i data-lucide="lock" class="w-[18px] h-[18px] text-foreground-muted"></i>
                    </div>
                    <input type="password" id="password-input" placeholder="请输入密码"
                      class="w-full h-10 pl-10 pr-11 rounded-[8px] border border-border bg-surface text-foreground text-sm placeholder:text-foreground-muted focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 focus:outline-none transition-all"
                      style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-foreground-muted hover:text-foreground-secondary transition-colors">
                      <i id="eye-open" data-lucide="eye" class="w-[18px] h-[18px]"></i>
                      <i id="eye-closed" data-lucide="eye-off" class="w-[18px] h-[18px] hidden"></i>
                    </button>
                  </div>
                  <p id="password-error" class="hidden text-xs text-error-500 flex items-center gap-1" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                    <i data-lucide="alert-circle" class="w-3 h-3"></i>
                    <span>请输入密码</span>
                  </p>
                </div>

                <!-- Remember me + Forgot password -->
                <div class="flex items-center justify-between pt-1">
                  <label class="flex items-center gap-2 cursor-pointer select-none group">
                    <input type="checkbox" id="remember-me" class="w-4 h-4 rounded-[4px] border-border text-primary-500 focus:ring-primary-500/20 accent-primary-500 cursor-pointer">
                    <span class="text-sm text-foreground-secondary group-hover:text-foreground transition-colors" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">记住我</span>
                  </label>
                  <a href="#" class="text-sm text-primary-500 hover:text-primary-600 transition-colors" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">忘记密码？</a>
                </div>

                <!-- Login button -->
                <button type="button" data-dom-id="login-submit" class="login-btn w-full h-12 mt-1 rounded-[14px] bg-primary-500 text-white text-[15px] font-semibold hover:bg-primary-600 active:scale-[0.99] transition-all shadow-[0_1px_2px_rgba(0,0,0,0.06)] hover:shadow-[0_4px_8px_rgba(215,25,32,0.25)] inline-flex items-center justify-center gap-2" style="font-family:'DM Sans','Noto Sans SC',sans-serif;">
                  <span class="login-btn-text">登录</span>
                  <span class="login-btn-loading hidden items-center gap-2">
                    <svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    登录中...
                  </span>
                </button>
              </div>

              <!-- Divider "或" -->
              <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-border-light"></div>
                <span class="text-xs text-foreground-muted shrink-0" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">或</span>
                <div class="flex-1 h-px bg-border-light"></div>
              </div>

              <!-- Third-party login -->
              <div class="flex items-center justify-center gap-4">
                <button type="button" aria-label="微信登录" class="w-11 h-11 rounded-full bg-success-500 flex items-center justify-center text-white hover:bg-success-600 hover:shadow-[0_4px_8px_rgba(5,150,105,0.3)] transition-all">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>
                </button>
                <button type="button" aria-label="QQ登录" class="w-11 h-11 rounded-full bg-info-500 flex items-center justify-center text-white hover:bg-info-600 hover:shadow-[0_4px_8px_rgba(2,132,199,0.3)] transition-all">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M21.395 15.035a39.548 39.548 0 0 0-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.526 4.632 17.351 0 12 0S4.474 4.632 4.474 9.241c0 .274.013.804.014.836l-1.08 2.695a38.97 38.97 0 0 0-.802 2.264c-1.021 3.283-.69 4.543-.434 4.543.408 0 1.449-1.527 1.449-1.527 0 .904.466 2.091 1.491 2.957-.393.122-.872.309-1.19.554-.283.218-.25.453-.201.552.212.426 3.609.272 4.502-.129.004-.009.249-.124.16-.072 1.072.299 2.424.472 3.617.472 1.193 0 2.545-.173 3.618-.472l.16.072c.892.401 4.289.555 4.502.129.048-.099.082-.334-.201-.552a4.184 4.184 0 0 0-1.19-.554c1.025-.866 1.491-2.053 1.491-2.957 0 0 1.041 1.527 1.449 1.527.256 0 .587-1.26-.434-4.544z"/></svg>
                </button>
              </div>

              <!-- Register link -->
              <p class="text-center text-sm text-foreground-secondary mt-8" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                还没有账号？
                <a href="./register.html" class="text-primary-500 font-medium hover:text-primary-600 transition-colors">立即注册</a>
              </p>
            </div>
          </div>
        </div>
      </div>

      <script type="module">
        // ===== F3 Slice F3.1 — login page auth wiring (real backend) =====
        import { auth } from "../assets/js/api/services/index.js";
        import { setUseMock } from "../assets/js/api/USE_MOCK.js";
        // 默认走真后端 (useMock = false); 用户可通过 navator 顶栏 Mock 按钮切换
        setUseMock(false);

        ["email-input", "password-input"].forEach(function(id) {
          var el = document.getElementById(id);
          if (!el) return;
          el.addEventListener("input", function() {
            var errId = id.replace("-input", "-error");
            var errEl = document.getElementById(errId);
            if (errEl) errEl.classList.add("hidden");
            el.classList.remove("border-error-500");
            el.classList.add("border-border");
          });
        });

        var pwdInput = document.getElementById("password-input");
        var togglePwd = document.getElementById("toggle-password");
        var eyeOpen = document.getElementById("eye-open");
        var eyeClosed = document.getElementById("eye-closed");
        if (togglePwd && pwdInput) {
          togglePwd.addEventListener("click", function() {
            var isPwd = pwdInput.type === "password";
            pwdInput.type = isPwd ? "text" : "password";
            if (eyeOpen) eyeOpen.classList.toggle("hidden", isPwd);
            if (eyeClosed) eyeClosed.classList.toggle("hidden", !isPwd);
          });
        }

        var loginBtn = document.querySelector(".login-btn");
        if (loginBtn) {
          loginBtn.addEventListener("click", async function() {
            var emailInp = document.getElementById("email-input");
            var pwdInp = document.getElementById("password-input");
            var emailErr = document.getElementById("email-error");
            var pwdErr = document.getElementById("password-error");
            var emailReg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            var valid = true;
            if (!emailReg.test(emailInp.value.trim())) {
              emailInp.classList.remove("border-border");
              emailInp.classList.add("border-error-500");
              emailErr.classList.remove("hidden");
              valid = false;
            }
            if (!pwdInp.value.trim()) {
              pwdInp.classList.remove("border-border");
              pwdInp.classList.add("border-error-500");
              pwdErr.classList.remove("hidden");
              valid = false;
            }
            if (!valid) return;

            loginBtn.disabled = true;
            loginBtn.classList.add("opacity-80", "cursor-wait");
            var btnText = loginBtn.querySelector(".login-btn-text");
            var btnLoading = loginBtn.querySelector(".login-btn-loading");
            if (btnText) btnText.classList.add("hidden");
            if (btnLoading) { btnLoading.classList.remove("hidden"); btnLoading.classList.add("inline-flex"); }

            try {
              const res = await auth.login({
                email: emailInp.value.trim(),
                password: pwdInp.value,
              });
              window.location.href = "./dashboard.html";
            } catch (err) {
              loginBtn.disabled = false;
              loginBtn.classList.remove("opacity-80", "cursor-wait");
              if (btnText) btnText.classList.remove("hidden");
              if (btnLoading) { btnLoading.classList.add("hidden"); btnLoading.classList.remove("inline-flex"); }
              if (pwdErr) {
                pwdErr.textContent = err.message || "登录失败";
                pwdErr.classList.remove("hidden");
              }
              console.error("[F3.1] login error:", err.type, err.code, err.message);
            }
          });
        }
      </script>
    </main>
    <script>lucide.createIcons();</script>
</body>
