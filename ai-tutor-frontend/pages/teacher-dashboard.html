<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - 教师仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary-50: #fff1f1;
    --color-primary-100: #ffe1e2;
    --color-primary-200: #ffc7c9;
    --color-primary-300: #ffa0a4;
    --color-primary-400: #ff686d;
    --color-primary-500: #d71920;
    --color-primary-600: #b8151b;
    --color-primary-700: #941218;
    --color-primary-800: #7a1014;
    --color-primary-900: #660f13;
    --color-success-50: #ecfdf5;
    --color-success-100: #d1fae5;
    --color-success-200: #a7f3d0;
    --color-success-300: #6ee7b7;
    --color-success-400: #34d399;
    --color-success-500: #059669;
    --color-success-600: #047857;
    --color-success-700: #065f46;
    --color-warning-50: #fffbeb;
    --color-warning-100: #fef3c7;
    --color-warning-200: #fde68a;
    --color-warning-300: #fcd34d;
    --color-warning-400: #fbbf24;
    --color-warning-500: #f59e0b;
    --color-warning-600: #d97706;
    --color-warning-700: #b45306;
    --color-error-50: #fef2f2;
    --color-error-100: #fee2e2;
    --color-error-200: #fecaca;
    --color-error-300: #fca5a5;
    --color-error-400: #f87171;
    --color-error-500: #ef4444;
    --color-error-600: #dc2626;
    --color-error-700: #b91c1c;
    --color-info-50: #f0f9ff;
    --color-info-100: #e0f2fe;
    --color-info-500: #0284c7;
    --color-info-600: #0369a1;
    --color-creative-50: #f5f3ff;
    --color-creative-500: #8b5cf6;
    --color-surface: #ffffff;
    --color-surface-secondary: #f8f9fb;
    --color-surface-tertiary: #f1f5f9;
    --color-foreground: #0f172a;
    --color-foreground-secondary: #475569;
    --color-foreground-muted: #94a3b8;
    --color-border: #e2e8f0;
    --color-border-light: #f1f5f9;
    --font-display: 'DM Sans', 'Noto Sans SC', sans-serif;
    --font-sans: 'Noto Sans SC', 'DM Sans', sans-serif;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 16px;
    --radius-pill: 9999px;
    --shadow-card: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-hover: 0 4px 8px -2px rgb(0 0 0 / 0.10);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-foreground); }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen bg-surface-secondary">
      <div class="px-4 sm:px-6 lg:px-8 py-6 lg:py-8 max-w-[1400px] mx-auto">

        <!-- 顶部标题区 -->
        <div class="mb-6">
          <div class="flex items-center gap-1.5 text-xs text-foreground-secondary mb-2" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
            <a href="/f3/pages/index.html" class="hover:text-primary-500 transition-colors">首页</a>
            <i data-lucide="chevron-right" class="w-3 h-3"></i>
            <span class="text-foreground font-medium">教师仪表盘</span>
          </div>
          <div class="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
            <div class="min-w-0">
              <div class="inline-flex items-center gap-2 px-3 h-7 rounded-full bg-warning-50 text-warning-600 text-xs font-medium mb-3" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                <span>👨‍🏫</span>
                <span>教师视角 · PM P1-9</span>
              </div>
              <h1 class="text-2xl sm:text-[28px] font-bold text-foreground leading-tight" style="font-family:'DM Sans','Noto Sans SC',sans-serif; text-wrap:balance; word-break:keep-all;">班级学情总览</h1>
              <p class="mt-1 text-sm text-foreground-secondary" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">实时掌握班级动态,精准识别待关注学生</p>
            </div>
            <div class="flex items-center gap-2 shrink-0 flex-wrap">
              <select class="inline-flex items-center gap-2 px-3.5 h-10 rounded-xl bg-surface border border-border-light text-sm text-foreground" id="grade-select">
                <option value="">全年级</option>
                <option value="grade1">高一</option>
                <option value="grade2">高二</option>
                <option value="grade3">高三</option>
              </select>
              <select class="inline-flex items-center gap-2 px-3.5 h-10 rounded-xl bg-surface border border-border-light text-sm text-foreground" id="subject-select">
                <option value="">全学科</option>
                <option value="math">数学</option>
                <option value="physics">物理</option>
                <option value="chemistry">化学</option>
              </select>
            </div>
          </div>
        </div>

        <!-- KPI 行 -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5" id="kpi-row">
          <div class="bg-surface rounded-2xl p-5 shadow-card border border-border-light">
            <div class="flex items-center justify-between mb-2">
              <div class="text-sm text-foreground-secondary" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">学生总数</div>
              <div class="w-9 h-9 rounded-xl bg-primary-50 flex items-center justify-center">
                <i data-lucide="users" class="w-4 h-4 text-primary-500"></i>
              </div>
            </div>
            <div class="text-3xl font-bold text-foreground" style="font-family:'DM Sans','Noto Sans SC',sans-serif;" id="kpi-students">—</div>
            <div class="text-xs text-foreground-muted mt-1" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">所带班级</div>
          </div>
          <div class="bg-surface rounded-2xl p-5 shadow-card border border-border-light">
            <div class="flex items-center justify-between mb-2">
              <div class="text-sm text-foreground-secondary" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">班级平均分</div>
              <div class="w-9 h-9 rounded-xl bg-success-50 flex items-center justify-center">
                <i data-lucide="trending-up" class="w-4 h-4 text-success-500"></i>
              </div>
            </div>
            <div class="text-3xl font-bold text-foreground" style="font-family:'DM Sans','Noto Sans SC',sans-serif;" id="kpi-avg">—</div>
            <div class="text-xs text-success-500 mt-1" style="font-family:'Noto Sans SC','DM Sans',sans-serif;" id="kpi-avg-trend">较上周 —</div>
          </div>
          <div class="bg-surface rounded-2xl p-5 shadow-card border border-border-light">
            <div class="flex items-center justify-between mb-2">
              <div class="text-sm text-foreground-secondary" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">出勤率</div>
              <div class="w-9 h-9 rounded-xl bg-info-50 flex items-center justify-center">
                <i data-lucide="check-circle-2" class="w-4 h-4 text-info-500"></i>
              </div>
            </div>
            <div class="text-3xl font-bold text-foreground" style="font-family:'DM Sans','Noto Sans SC',sans-serif;" id="kpi-att">—</div>
            <div class="text-xs text-foreground-muted mt-1" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">近 30 天</div>
          </div>
          <div class="bg-surface rounded-2xl p-5 shadow-card border border-border-light">
            <div class="flex items-center justify-between mb-2">
              <div class="text-sm text-foreground-secondary" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">待关注学生</div>
              <div class="w-9 h-9 rounded-xl bg-error-50 flex items-center justify-center">
                <i data-lucide="alert-triangle" class="w-4 h-4 text-error-500"></i>
              </div>
            </div>
            <div class="text-3xl font-bold text-error-500" style="font-family:'DM Sans','Noto Sans SC',sans-serif;" id="kpi-attention">—</div>
            <div class="text-xs text-error-500 mt-1" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">C 档 · 需介入</div>
          </div>
        </div>

        <!-- 学生分层 + 共性错因 -->
        <div class="grid grid-cols-1 xl:grid-cols-[1.4fr_1fr] gap-4 mb-5">

          <!-- 学生分层列表 -->
          <div class="bg-surface rounded-2xl shadow-card border border-border-light overflow-hidden">
            <div class="flex items-center justify-between px-5 py-4 border-b border-border-light">
              <div>
                <h3 class="text-base font-semibold text-foreground" style="font-family:'DM Sans','Noto Sans SC',sans-serif;">学生分层 (按掌握度)</h3>
                <p class="text-xs text-foreground-secondary mt-0.5" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">A ≥ 85 / B 60-84 / C < 60</p>
              </div>
              <div class="flex items-center gap-2">
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs bg-success-50 text-success-600" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                  <span class="w-1.5 h-1.5 rounded-full bg-success-500"></span>A
                </span>
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs bg-warning-50 text-warning-600" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                  <span class="w-1.5 h-1.5 rounded-full bg-warning-500"></span>B
                </span>
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs bg-error-50 text-error-500" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">
                  <span class="w-1.5 h-1.5 rounded-full bg-error-500"></span>C
                </span>
              </div>
            </div>
            <div class="p-3" id="tier-students">
              <!-- 学生列表 (JS 渲染) -->
            </div>
          </div>

          <!-- 共性错因 TOP 5 -->
          <div class="bg-surface rounded-2xl shadow-card border border-border-light overflow-hidden">
            <div class="px-5 py-4 border-b border-border-light">
              <h3 class="text-base font-semibold text-foreground" style="font-family:'DM Sans','Noto Sans SC',sans-serif;">本周共性错因 TOP 5</h3>
              <p class="text-xs text-foreground-secondary mt-0.5" style="font-family:'Noto Sans SC','DM Sans',sans-serif;">班级整体错因分布,用于针对性讲解</p>
            </div>
            <div class="p-5 space-y-3" id="error-reasons">
              <!-- 错因列表 (JS 渲染) -->
            </div>
          </div>
        </div>

        <!-- 本周动态 -->
        <div class="bg-surface rounded-2xl shadow-card border border-border-light overflow-hidden">
          <div class="flex items-center justify-between px-5 py-4 border-b border-border-light">
            <h3 class="text-base font-semibold text-foreground" style="font-family:'DM Sans','Noto Sans SC',sans-serif;">本周动态</h3>
            <span class="text-xs text-foreground-muted" style="font-family:'Noto Sans SC','DM Sans',sans-serif;" id="week-range">—</span>
          </div>
          <div class="divide-y divide-border-light" id="weekly-dynamics">
            <!-- 动态列表 (JS 渲染) -->
          </div>
        </div>

      </div>

      <script type="module">
        import { classAnalysis } from '../assets/js/api/services/index.js';
        import { useAsyncResource } from '../assets/js/hooks/useAsyncResource.js';
        import { mountErrorBoundary } from '../assets/js/components/error-boundary.js';
        import { setUseMock } from '../assets/js/api/USE_MOCK.js';

        mountErrorBoundary();
        // Phase-I-fix (2026-08-24): 默认开 mock, 真实 API 需登录态 (B 端教师用户)
        setUseMock(true);

        const dashboardRes = useAsyncResource(() => classAnalysis.getTeacherDashboard());
        const analysisRes  = useAsyncResource(() => classAnalysis.getClassAnalysis());

        const setText = (id, text) => {
          const el = document.getElementById(id);
          if (el) el.textContent = text;
        };

        const subjectColor = (s) => ({
          '数学':'#d71920','语文':'#7c3aed','英语':'#0284c7','物理':'#059669','化学':'#f59e0b','生物':'#16a34a'
        })[s] || '#475569';

        const tierBadge = (t) => ({
          'A': '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-success-50 text-success-600" style="font-family:DM Sans,Noto Sans SC,sans-serif;">A</span>',
          'B': '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-warning-50 text-warning-600" style="font-family:DM Sans,Noto Sans SC,sans-serif;">B</span>',
          'C': '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-error-50 text-error-500" style="font-family:DM Sans,Noto Sans SC,sans-serif;">C</span>'
        })[t] || '';

        // 1. 教师仪表盘 KPI
        dashboardRes.subscribe(({ data, loading, error }) => {
          if (error) { console.error('[teacher-dashboard]', error); return; }
          if (loading && !data) return;
          if (!data) return;
          const d = data.data || {};
          const ov = d.overview || {};
          setText('kpi-students', String(ov.totalStudents ?? '—'));
          setText('kpi-att', ov.weeklyActiveRate ? (ov.weeklyActiveRate * 100).toFixed(0) + '%' : '—');
          // 平均分从 classes 聚合
          const classes = d.classes || [];
          if (classes.length > 0) {
            const avg = (classes.reduce((s, c) => s + (c.averageScore || 0), 0) / classes.length).toFixed(1);
            setText('kpi-avg', avg);
          }
          const att = (classes.reduce((s, c) => s + (c.attentionCount || 0), 0));
          setText('kpi-attention', String(att || '—'));
          setText('kpi-avg-trend', '所带 ' + classes.length + ' 个班级');
          // 周报时间区间
          const wd = d.weeklyDynamics || {};
          if (wd.weekStart && wd.weekEnd) {
            setText('week-range', wd.weekStart + ' ~ ' + wd.weekEnd);
          }
          // 学生分层列表 (按 attentionStudents 渲染 C 档待关注)
          const ul = document.getElementById('tier-students');
          if (ul) {
            const list = (d.classes || []).flatMap(c =>
              (c.tierDistribution ? [['A', c.tierDistribution.A || 0], ['B', c.tierDistribution.B || 0], ['C', c.tierDistribution.C || 0]] : [])
                .map(([t, n]) => ({ className: c.name, tier: t, count: n }))
            );
            // 同时取 analysis 中的 attentionStudents 渲染
            const html = [];
            html.push('<div class="grid grid-cols-3 gap-2 mb-3">');
            for (const t of ['A','B','C']) {
              const total = (classes || []).reduce((s, c) => s + ((c.tierDistribution || {})[t] || 0), 0);
              const cls = t === 'A' ? 'bg-success-50 text-success-600' : t === 'B' ? 'bg-warning-50 text-warning-600' : 'bg-error-50 text-error-500';
              html.push(`<div class="${cls} rounded-xl p-3 text-center">
                <div class="text-2xl font-bold" style="font-family:DM Sans,Noto Sans SC,sans-serif;">${total}</div>
                <div class="text-xs" style="font-family:Noto Sans SC,DM Sans,sans-serif;">${t} 档 · ${t==='A'?'掌握良好':t==='B'?'稳步提升':'待关注'}</div>
              </div>`);
            }
            html.push('</div>');
            html.push('<div class="text-xs font-semibold text-foreground-secondary px-2 py-1.5" style="font-family:Noto Sans SC,DM Sans,sans-serif;">C 档待关注</div>');
            // 渲染占位 — 由 analysis 实际数据补全
            html.push('<div id="attention-list" class="space-y-1.5"></div>');
            ul.innerHTML = html.join('');
          }
          // 本周动态
          const dyn = document.getElementById('weekly-dynamics');
          if (dyn) {
            const events = wd.keyEvents || [];
            if (events.length === 0) {
              dyn.innerHTML = '<div class="px-5 py-6 text-sm text-foreground-muted text-center">暂无动态</div>';
            } else {
              dyn.innerHTML = events.map(e => {
                const iconMap = { report:'file-text', alert:'alert-triangle', milestone:'award' };
                const colorMap = { report:'info', alert:'error', milestone:'success' };
                const ic = iconMap[e.type] || 'circle';
                const cl = colorMap[e.type] || 'foreground';
                return `<div class="flex items-start gap-3 px-5 py-3">
                  <div class="w-8 h-8 rounded-lg bg-${cl}-50 flex items-center justify-center shrink-0">
                    <i data-lucide="${ic}" class="w-4 h-4 text-${cl}-500"></i>
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="text-sm text-foreground" style="font-family:Noto Sans SC,DM Sans,sans-serif;">${e.title}</div>
                    <div class="text-xs text-foreground-muted mt-0.5" style="font-family:Noto Sans SC,DM Sans,sans-serif;">${e.time}</div>
                  </div>
                </div>`;
              }).join('');
              if (window.lucide) lucide.createIcons();
            }
          }
        });

        // 2. 班级分析 — 共性错因 + attentionStudents 真实数据
        analysisRes.subscribe(({ data, loading, error }) => {
          if (error) { console.error('[class-analysis]', error); return; }
          if (loading && !data) return;
          if (!data) return;
          const d = data.data || {};
          // 共性错因
          const er = document.getElementById('error-reasons');
          if (er) {
            const list = d.commonErrorReasons || [];
            const max = Math.max(...list.map(r => r.frequency || 0), 1);
            er.innerHTML = list.slice(0, 5).map((r, i) => {
              const w = Math.round((r.frequency / max) * 100);
              return `<div>
                  <div class="flex items-center justify-between mb-1">
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-bold text-foreground-muted w-4" style="font-family:DM Sans,Noto Sans SC,sans-serif;">${i + 1}</span>
                      <span class="text-sm text-foreground" style="font-family:Noto Sans SC,DM Sans,sans-serif;">${r.reason}</span>
                    </div>
                    <div class="flex items-center gap-2 text-xs text-foreground-secondary" style="font-family:Noto Sans SC,DM Sans,sans-serif;">
                      <span>${r.frequency} 人</span>
                      <span class="text-foreground-muted">${(r.percentage * 100).toFixed(0)}%</span>
                    </div>
                  </div>
                  <div class="w-full h-1.5 bg-surface-tertiary rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary-400 to-primary-500 rounded-full" style="width:${w}%;"></div>
                  </div>
                </div>`;
            }).join('');
          }
          // C 档待关注学生
          const al = document.getElementById('attention-list');
          if (al) {
            const list = d.attentionStudents || [];
            if (list.length === 0) {
              al.innerHTML = '<div class="text-sm text-foreground-muted px-2 py-3">暂无待关注学生 🎉</div>';
            } else {
              al.innerHTML = list.map(s => `
                <a href="/f3/pages/student-progress.html?student_id=${s.student_id}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-surface-tertiary transition-colors">
                  <div class="w-9 h-9 rounded-full bg-gradient-to-br from-error-400 to-error-500 flex items-center justify-center text-white text-xs font-semibold shrink-0" style="font-family:DM Sans,Noto Sans SC,sans-serif;">${s.name.slice(0, 1)}</div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                      <span class="text-sm font-semibold text-foreground" style="font-family:Noto Sans SC,DM Sans,sans-serif;">${s.name}</span>
                      ${tierBadge(s.tier)}
                    </div>
                    <div class="text-xs text-foreground-secondary truncate" style="font-family:Noto Sans SC,DM Sans,sans-serif;">${s.warning}</div>
                  </div>
                  <div class="text-right shrink-0">
                    <div class="text-sm font-bold text-error-500" style="font-family:DM Sans,Noto Sans SC,sans-serif;">${s.avgScore}</div>
                    <div class="text-[11px] text-foreground-muted" style="font-family:Noto Sans SC,DM Sans,sans-serif;">${s.errorCount} 错</div>
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-foreground-muted shrink-0"></i>
                </a>
              `).join('');
              if (window.lucide) lucide.createIcons();
            }
          }
          // 学科平均分补充 KPI
          if (d.subjects && d.subjects.length > 0) {
            const subjAvg = (d.subjects.reduce((s, x) => s + (x.avgScore || 0), 0) / d.subjects.length).toFixed(1);
            setText('kpi-avg', subjAvg);
          }
          const summary = d.summary || {};
          setText('kpi-students', String(summary.totalStudents || '—'));
          setText('kpi-att', summary.attendanceRate ? (summary.attendanceRate * 100).toFixed(0) + '%' : '—');
          setText('kpi-attention', String(summary.attentionCount || '—'));
        });

        // 顶部 navator — P1-fix (2026-08-24 audit)
        import('../assets/js/navator.js').then(m => m.mount({ active: 'teacher' }));
        // 渲染 lucide 图标
        if (window.lucide) lucide.createIcons();
      </script>
    </main>
</body>
</html>
